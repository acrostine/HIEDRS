						<div class="markdown-doc"><script type="text/plain">**A Study Programme Proposal is submitted.** The responsible academic body puts forward the proposal. The stream moves through curriculum design, internal program evaluation and effectiveness measurement. It produces a Program Evaluation Report and an Accreditation Self-Evaluation Report sufficient for submission to NAT. The point is to prepare accreditation renewal on complete documentation and current standards, protecting the programme's right to enrol students.

**Documentation and standards must be current.** The stream depends on Study Programme Documentation being complete and standards being up to date. When they are, the evaluation reports are ready for NAT and the programme keeps its enrolment rights. This connects proposal to national accreditation.

**Accreditation Self-Evaluation Report goes to NAT.** It is the evidence package prepared for the national accreditation body.</script></div>
