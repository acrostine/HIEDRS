						<div class="markdown-doc"><script type="text/plain">**Council approves the course list.** After an accredited curriculum is in place, the academic council approves the course offerings list. The stream turns those approved courses into bookable classroom sessions with reserved teaching spaces and equipment. The aim is to ensure every required course has a qualified instructor and a room before registration opens. Students and staff receive:
- a published Class Schedule
- a Teaching Load Report
- Resource Booking Confirmations

**Scheduling depends on instructors and rooms.** The stream requires a qualified instructor and an available room for each required course. When those are in place, the course is scheduled and students register. This connects curriculum approval to day-to-day teaching operations.

**A published Class Schedule opens registration.** It lists the bookable classroom sessions for the term.</script></div>
