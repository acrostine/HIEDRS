						<div class="markdown-doc"><script type="text/plain">**What this is.** A map of what a higher education institution does, adapted to Serbian law and the European Higher Education Area. It sets out 7 domains, 53 capabilities and 130 flows between capabilities, each capability with a list of its key processes, plus 10 stakeholders, 7 drivers, 7 goals and 10 value streams. The adaptation covers the Law on Higher Education, accreditation by the National Accreditation Body, ECTS and the three cycles, quality assurance against ESG 2015, personal data protection, Erasmus+ mobility, state-funded places and the student standard. It is a structural reference for people who decide process ownership, system boundaries and capability gaps across a university and its faculties.

**Where it comes from.** A Higher Education capability model adapted to Serbian law and the European Higher Education Area, prepared for discussion with colleagues at FON, University of Belgrade. The descriptions and flows were generated by the AI agents team from a generic higher education model and a short adaptation brief. Statements about Serbian and EU law summarise public instruments at a general level and have not been legally reviewed.

**What comes next.** This is the free reading edition. Richer narratives, adaptation questions, and the model as an ArchiMate file and structured data are planned.</script></div>
