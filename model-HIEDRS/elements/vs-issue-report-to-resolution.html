						<div class="markdown-doc"><script type="text/plain">**A report reaches the service desk.** A student or staff member submits an Information Inquiry or Issue Report, and support staff route it to the right resolver. The resolver fixes the underlying problem and updates reusable knowledge, so the next similar report is handled more quickly.

**The work depends on two conditions.** Each report needs enough diagnostic detail, and each resolver needs access to the affected system or Student Record. When those hold, the issue is resolved and the requester is not left blocked.

**The fix is documented once.** The **Resolution Record** records what was fixed and is completed before the Closure Notification goes to the requester, giving both sides a record of what was resolved.</script></div>
