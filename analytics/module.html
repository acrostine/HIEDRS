ncipal investigator, and a budget built on the sponsor's template. It produces the proposal, application, budget and submission confirmation.\n\n**The Proposal requires every annex.** A missing annex makes the application ineligible.\n\n### Key processes\n- Screen Funding Opportunity\n- Assemble Proposal Team\n- Draft Technical Narrative\n- Prepare Budget\n- Obtain Institutional Endorsement\n- Submit Application\n- Withdraw Application","specialization":""},{"id":"id-3c048211-0449-40be-a766-678a749f7390","type":"Capability","name":"Provide Housing and Auxiliary Services","documentation":"**A housing application starts with eligibility.** Students apply for accommodation and meal plans under the studentski standard, and the institution assigns rooms and contracts once enrollment and subsidy status are confirmed. An application with missing or unconfirmed subsidy stays on the waiting list until the subsidy is confirmed.\n\n**The subsidy decision and the student record shape the assignment.** The institution respects the student centre's eligibility decision for subsidized accommodation and meals. Housing Application must include the Student Standard Subsidy Confirmation; Student Record must confirm enrolled status. Once a room is assigned, a Housing Contract is issued.\n\n**A room assignment leads to a contract.** The **Housing Contract** is issued when a room is allocated to an enrolled student. Move-in waits until eligibility is complete, so no student enters housing on an incomplete record.\n\n### Key processes\n- Evaluate Housing Application\n- Assign Room\n- Issue Housing Contract\n- Assign Meal Plan\n- Bill Auxiliary Charges\n- Handle Maintenance Request","specialization":""},{"id":"id-8abb076b-05fc-4e17-8f75-51b43cf80016","type":"Capability","name":"Provide Information and Advice","documentation":"**A question before a decision gets a sourced answer.** Inquiries about admission, enrollment, fees, examination schedules, and institutional policies are answered with accurate, regulation-aligned guidance. Advisory Requests for procedures such as recognition of foreign qualifications, Erasmus+ credit mobility, or submission of a complaint are handled the same way. If a question is ambiguous, it is returned with a request for clarification before an answer is given.\n\n**Answers rest on current rules and a shared base.** The work searches Knowledge Articles and retrieves the applicable text from the Law on Higher Education or the institutional rulebook. If an inquiry concerns a faculty-specific matter, it is redirected to the competent office; if the answer is unclear, it escalates to a legal advisor. When a new question reveals a gap, that gap is closed by updating a Knowledge Article.\n\n**An Advisory Response states the next step.** It answers the question, cites the relevant regulation, and is traceable to the source document and date. For advice about accreditation status, the response reflects the current decision of the National Accreditation Body. The response is retained for audit, so the reasoning behind an answer remains available after it is delivered.\n\n### Key processes\n- Receive Inquiry\n- Interpret Question\n- Search Knowledge Base\n- Formulate Response\n- Verify Against Regulation\n- Deliver Response\n- Update Knowledge Article\n- Redirect Inquiry","specialization":""},{"id":"id-51cd6874-501c-40ec-b797-8d46bc6d2240","type":"Capability","name":"Receive Funding","documentation":"**Sponsor payments need a home.** A sponsor payment lands in the institution’s bank account and staff match it to the right award and budget line before it can be used. Receive Funding records each payment, checks it against the award and invoice, and posts it where it belongs. When this is done correctly, every grant euro is traceable to its source and purpose, and public funding under the Law on Higher Education stays separate from self-financing student fees.\n\n**The work depends on surrounding records.** A sponsor payment arrives with a remittance advice and a bank statement; the grant award record provides the current budget lines. Those documents determine whether the payment is matched, returned, or held as an Unidentified Payment Notice. What Receive Funding produces then flows into project accounts and auditor reports, so a missing match here shows up downstream as an underfunded project or an unreconciled advance.\n\n**A Cash Receipt carries the audit trail.** Each receipt records the date, amount, currency, award reference, and budget line. That detail is what lets an auditor confirm that state and sponsor funds were not mixed.\n\n### Key processes\n- Match Payment to Invoice\n- Record Cash Receipt\n- Allocate Payment\n- Issue Sponsor Acknowledgment\n- Reconcile Bank Statement\n- Handle Overpayment\n- Escalate Unidentified Payment","specialization":""},{"id":"id-9475e03b-21b2-44ad-a009-25c3be831b1e","type":"Capability","name":"Recognize Foreign Qualifications","documentation":"**A completed application for recognition arrives.** Staff examine it, check the foreign diploma and transcript against the Serbian study programme for the relevant cycle, and request ENIC-NARIC verification when authenticity needs confirmation. The result is a binding Recognition Decision, positive or negative. This formal procedure under the Law on Higher Education is what lets a qualification earned abroad count toward admission or a Serbian diploma.\n\n**The decision feeds student records.** Each Recognition Decision is recorded in the Recognition Register and stored in the student's file. Incomplete applications are returned with a deficiency note, and appeals trigger a reassessment. The student file and register are where the outcome becomes part of the record for later enrolment and diploma issuing.\n\n**The Recognition Decision fixes the outcome.** It cites the verified sources. A decision without full evidence is reassessed, protecting the applicant from a wrong result based on unverified documents.\n\n### Key processes\n- Assess Foreign Qualification\n- Verify Document Authenticity\n- Issue Recognition Decision\n- Record Recognition\n- Handle Recognition Appeal","specialization":""},{"id":"id-42e5f948-24cb-4fd9-8dcd-d99ec588dcef","type":"Capability","name":"Recruit Prospects","documentation":"**Consent comes before communication.** When a prospective student contacts the institution, the first requirement is a valid Consent Record from the inquiry form. Without it, no further recruitment communication is sent, the prospect is not nurtured, and the lead is not passed to admissions. For minors, guardian consent is required.\n\n**Consent and scoring determine who moves forward.** The institution captures inquiries into a Prospect Record, verifies consent, and scores interest. High School Data and Marketing Campaign Results arrive from outreach; only a prospect meeting readiness criteria becomes a Qualified Lead.\n\n**A qualified lead is handed to admissions.** The **Qualified Lead** is produced when a prospect meets readiness criteria and consent is verified. The lead then passes to Admissions, while the rest of the prospect list continues in nurture.\n\n### Key processes\n- Capture Prospect Inquiry\n- Qualify Prospect\n- Maintain Prospect Record\n- Send Recruitment Communication\n- Invite Prospect to Event","specialization":""},{"id":"id-ebfac6ac-707e-497a-b678-abc00810b609","type":"Capability","name":"Sales Force Management","documentation":"**A new salesperson joins the team.** When a Salesperson Profile arrives with a signed employment contract, the sales force work begins. The capability recruits salespeople, assigns territories, sets sales targets, monitors performance, calculates sales incentives, delivers training, and reassigns or terminates where needed. The outcome is a Sales Force Roster that puts the right salesperson on each territory or account segment. Without assigned targets and evaluated performance, sales activity goes unmeasured, incentives go unpaid, and revenue goals slip.\n\n**Planning targets reach people here.** Sales Target, Territory Definition, and Training Plan arrive from planning, market revisions, and professional development. The work here converts those into assignments, evaluations, and incentive payments. In a Serbian higher education institution, every Salesperson Profile must include an employment contract and tax number; a profile missing either is returned before it enters the roster. Mandatory data protection training under the Serbian Law on Personal Data Protection must appear in the Training Plan, or no training is scheduled.\n\n**A Territory Assignment fixes the match.** Once a salesperson is matched to a region or segment, this record is issued. It becomes the basis for sales incentives and performance evaluations.\n\n### Key processes\n- Recruit Salesperson\n- Assign Territory\n- Set Sales Target\n- Evaluate Sales Performance\n- Calculate Sales Incentive\n- Deliver Training\n- Reassign Underperforming Salesperson\n- Terminate Salesperson","specialization":""},{"id":"id-52f6b145-944f-43d6-8dff-7f43ef37bc51","type":"Capability","name":"Sales Planning and Forecasting","documentation":"**After each recruitment cycle ends.** Historical Sales Data covering at least three recent cycles arrives, along with Market Analysis, the ministry-approved Enrollment Quota, the Academic Calendar, and Competitor Activity. This capability creates a Sales Plan that guides all sales activities for the next cycle. Without a Sales Plan finalised before the ministry quota decision, staffing, budgets, and channel plans cannot align, and the sales force works without a target.\n\n**Ministry quotas and ECTS cycles set the frame.** The planning work uses the ministry-approved Enrollment Quota and the Academic Calendar as fixed inputs. Forecasts rest on Historical Sales Data covering at least three recent recruitment cycles; incomplete payment history widens the confidence band. Market Analysis without source citations is kept out of the quantitative forecast.\n\n**A Sold Quota Allocation fixes programme numbers.** Each planning cycle, the capability issues a Sold Quota Allocation for each programme and channel. That document divides the ministry-approved quota across the institution's offerings.\n\n### Key processes\n- Analyse Historical Sales\n- Estimate Market Demand\n- Set Sales Target\n- Allocate Quota\n- Forecast Revenue\n- Review Forecast Accuracy\n- Reforecast After Enrolment Deadline","specialization":""},{"id":"id-1ca721ed-d3db-46c1-8ad3-1680c683cace","type":"Capability","name":"Schedule Classes","documentation":"**Scheduling starts after approval.** Once the academic council approves the Course Offerings List and student course selections close, teaching staff availability and room inventory are used to assemble a term timetable. The Class Schedule places instructors, student groups, and rooms without overlapping commitments. Every accredited course is given an instructor and a room in the required time slot, so the term’s credit load remains complete.\n\n**It uses verified records.** The schedule depends on a final Course Offerings List, teaching availability verified by the human resources office, and room inventory that includes accessibility and equipment details. Rooms missing required equipment are not assigned to courses that need them. The published Class Schedule drives room booking confirmations and teaching load reports for payroll.\n\n**The Class Schedule is published.** It goes out through the student and staff portals before the term starts. That one timetable is what students and instructors rely on to get to the right room at the right time.\n\n### Key processes\n- Collect Instructor Availability\n- Match Room to Class\n- Resolve Time Conflicts\n- Assign Instructors\n- Publish Class Schedule\n- Process Schedule Change","specialization":""},{"id":"id-cbacfae9-ac1b-47fa-9b0f-25a035e0e5c8","type":"Capability","name":"Schedule Resources and Facilities","documentation":"**Practical work needs the right room.** Specialised laboratories, studios, and equipment are allocated to support scheduled classes. Facility Inventory is reviewed to see which spaces are serviceable, and equipment sets are reserved for hands-on sessions. Double bookings between course sections are resolved, and a Resource Booking Confirmation is issued to the requesting instructor. This keeps laboratory-based learning outcomes assessable.\n\n**It runs on current facility records.** Facility Inventory is refreshed after each maintenance cycle and includes safety certification; the Equipment Availability Schedule reflects current repair status. The published Class Schedule is the demand signal. From this come:\n- Laboratory Schedules for each laboratory\n- Equipment Loan Records for portable equipment\n- Maintenance Escalations when a reserved resource becomes unavailable\n\n**The Resource Booking Confirmation is issued.** Instructors receive it when a laboratory or equipment set is reserved for a specific course session. That single confirmation fixes the practical session in the term.\n\n### Key processes\n- Review Facility Inventory\n- Reserve Laboratory Time\n- Book Equipment\n- Issue Resource Confirmation\n- Handle Double Booking\n- Request Maintenance","specialization":""},{"id":"id-6f1e97f2-f962-4853-b211-ad1f254d6ecc","type":"Capability","name":"Segment Customers","documentation":"**New leads and survey responses arrive.** The marketing team groups these prospects into segments for targeted campaigns and lead prioritisation. Personal data is cleansed and pseudonymised where required before any segmentation happens. Records without a consent timestamp or source are rejected, so no individual is assigned to a segment without a lawful basis. A segment with fewer than ten leads is not used, keeping campaign effort focused on groups large enough to act on.\n\n**The outputs go to the campaign team.** This work depends on consent-carrying Prospective Student Data and complete Survey Responses, and it produces a Customer Segment Profile and a Segment Assignment Rule for campaign planning. Segmentation on personal data adheres to the Serbian Law on Personal Data Protection, and cross-border segmentation for joint programmes meets GDPR requirements, including data minimisation and pseudonymisation.\n\n**Lead Scoring Model checked yearly.** Every year, the model is compared against actual enrolment outcomes. If it no longer predicts enrolment, it is retired. That keeps lead prioritisation tied to whether a prospect actually converts.\n\n### Key processes\n- Define Segmentation Criteria\n- Create Prospect Segment\n- Score Prospective Student Lead\n- Assign Leads to Campaign\n- Update Segment with New Data\n- Monitor Segment Conversion\n- Pseudonymise Personal Data\n- Validate Segment Accuracy","specialization":""},{"id":"id-4ea30967-ff0b-4c5d-9d5e-1523da7907d9","type":"Capability","name":"Solicit Prospects","documentation":"**A new prospect starts the work.** When a prospect appears or a major event or campaign targeting stage triggers activity, the team identifies prospective donors from the prospect list and event attendance, then researches their capacity and affinity using wealth screening data and giving history. Each prospect gets a solicitor and a documented next action. Outreach checks consent first; a record without a lawful basis is removed from solicitation until consent is verified.\n\n**Consent and data set the reach.** The prospect list carries consent flags and the date of last contact or gift; wealth screening data is current, because outdated data is rejected and refreshed before research. Prior giving history and event attendance shape the approach. Before a donor meeting is requested, the solicitation plan and proposal go to the responsible legal entity for approval under the Serbian Law on Personal Data Protection and GDPR. No solicitation proceeds without documented consent or legitimate interest.\n\n**The proposal for major gift asks.** Drafted after researching capacity and affinity, it moves a prospect from research toward a donor meeting. The responsible legal entity approves it before any donor meeting request is sent. This protects conversion rates and prevents complaints under data protection law.\n\n### Key processes\n- Identify Major Gift Prospects\n- Research Donor Capacity\n- Assign Solicitor\n- Prepare Solicitation Proposal\n- Record Solicitation Outcome\n- Manage Declined Prospects","specialization":""},{"id":"dr-accreditation-gate","type":"Driver","name":"Accreditation gates enrolment and degree issuance","documentation":"**Enrolment and degrees wait on accreditation.** A study programme cannot enrol students or issue recognised degrees unless it holds a valid NAT accreditation certificate, renewed periodically, and the institution is accredited for that programme.\n\n**The NAT accreditation certificate gates.** It keeps unrecognised programmes from admitting students or awarding degrees, and periodic renewal keeps that gate valid.","specialization":""},{"id":"dr-data-protection","type":"Driver","name":"Data protection law applies across mobility","documentation":"**Personal data law applies to records.** **The Serbian Law on Personal Data Protection**, modelled on GDPR, applies to:\n- student records\n- staff records\n- research participant data\n\n**Cross-border mobility brings GDPR in.** Joint programmes and mobility arrangements put the same protections directly onto those records, so one legal standard follows the data.","specialization":""},{"id":"dr-esg-qa-alignment","type":"Driver","name":"ESG 2015 quality assurance alignment","documentation":"**Quality assurance follows ESG 2015.** Serbian quality assurance is read against ESG 2015, the Standards and Guidelines for Quality Assurance in the European Higher Education Area. That alignment strengthens internal self-evaluation and external evaluation.\n\n**NAT accreditation depends on that evaluation.** The strengthened evaluations feed the accreditation body, so accreditation decisions rest on a clearer read of a programme's quality.","specialization":""},{"id":"dr-erasmus-mobility-recognition","type":"Driver","name":"Erasmus+ credit mobility recognition requirement","documentation":"**Erasmus+ mobility requires recognition.** Credits earned abroad are recognised using ECTS and the Diploma Supplement. Recognition pushes comparability of learning outcomes across institutions.\n\n**The Diploma Supplement carries recognition.** Together with ECTS, it recognises credits earned abroad, and that shared format pushes comparability of learning outcomes.","specialization":""},{"id":"dr-legal-form-split","type":"Driver","name":"Integrated and federated university forms split accountability","documentation":"**Integrated and federated forms move authority.** A university running both integrated and federated legal forms does not keep signing authority, accountability or records in one place. They sit at university or faculty level depending on the form.\n\n**The split reaches signing and filing.** Processes needing a signature, an accountable owner or a stored record follow the legal form. The record ends up where the form places it.\n\n**Integrated and federated university legal forms set the two positions.** The integrated form consolidates at university level; the federated form places them at faculty level. The coexistence of the two forms is what shifts the line.","specialization":""},{"id":"dr-margin-gap","type":"Driver","name":"Margin gap between delivery cost and funding per place","documentation":"**A study place carries a margin.** The margin on a study place is determined by the gap between the cost of delivering that place and the state funding or tuition per place.\n\n**The margin is that gap.** It shows whether the funding per place covers the cost of delivering it.","specialization":""},{"id":"dr-state-budget-quota-limits-volume","type":"Driver","name":"State-funded enrolment quota limits volume","documentation":"**Budget places come with a cap.** State funding is allocated for budget places fixed by enrolment quotas. The number of state-funded students is therefore capped, and the volume of that revenue is constrained.\n\n**The enrolment quota fixes the cap.** It sets the ceiling on state-funded places, so financial planning for that stream stays inside a known boundary.","specialization":""},{"id":"gl-sales-contract-revenue","type":"Goal","name":"Convert prospects into signed revenue agreements","documentation":"**Qualified prospects become signed agreements.** The institution converts qualified prospects into signed enrollment contracts or sales agreements within each recruitment cycle. Fee revenue from self-financing students and contract clients is recognised. A signed agreement is the first point where that revenue becomes real.\n\n**Between prospect record and billing.** A qualified Prospect Record becomes a signed **Enrollment Contract or Sales Agreement**, and billing then issues payment obligations. The commitment protects fee revenue recognition, budget commitments, and billing's ability to issue payment obligations. The signed Enrollment Contract or Sales Agreement tells billing what to invoice.","specialization":""},{"id":"gl-student-record-service","type":"Goal","name":"Ensure every student has a lawful record on an accredited programme","documentation":"**Every student needs a lawful record.** The institution ensures each student is associated with an accredited study programme and a lawful Student Record.\n\n**That record issues the services.** Admissions, enrollment confirmations, aid awards, housing assignments, tuition invoices and transcripts all draw from the master Student Record.\n\n**A Student Record anchors the whole flow.** Without that association, every one of those services halts.","specialization":""},{"id":"gl-grant-funding-compliance","type":"Goal","name":"Meet sponsor terms and recover grant funds","documentation":"**Grant funding follows sponsor terms.** The institution meets those terms, secures usable awards, recovers funds, and answers audit findings so externally funded projects deliver without returning money or losing future awards.\n\n**Compliance keeps projects running.** If terms are unmet, sponsors reject proposals or withhold payment; staff salaries charged to grants go unpaid and funds are returned.\n\n**An audit finding gets answered.** Each answered finding keeps future awards open, not blocked.","specialization":""},{"id":"gl-academic-program-delivery","type":"Goal","name":"Offer accredited programmes and schedulable required courses","documentation":"**A cohort needs a programme.** The institution offers accredited study programmes and schedules required courses with qualified instructors and appropriate rooms so students register, are graded and graduate.\n\n**Scheduling depends on instructors and rooms.** If no qualified instructor or appropriate room is available, a required course is not scheduled, and grades and degrees stall.\n\n**A required course carries the schedule.** Each scheduled course with a qualified instructor and a room is what lets students move from registration to graduation.","specialization":""},{"id":"gl-marketing-accredited-demand","type":"Goal","name":"Promote only accredited programmes and generate qualified demand","documentation":"**A campaign promotes a programme.** The institution promotes only study programmes with a valid accreditation decision and accurate ECTS information, and it generates qualified prospective student demand within state-funded quotas.\n\n**Accuracy decides whether demand qualifies.** A programme without valid accreditation or with misstated ECTS credits leaves materials removed and no qualified Lead Record generated, so the quota goes unfilled.\n\n**A Lead Record turns interest into quota.** Qualified prospective students become Lead Records, and those records fill the state-funded enrolment quota.","specialization":""},{"id":"gl-support-resolution","type":"Goal","name":"Resolve reported issues and answer inquiries authoritatively","documentation":"**When an issue is reported.** The institution resolves it with a documented, authoritative answer, not a holding pattern. Students finish enrollment, staff reach student records, and applicants meet legal deadlines.\n\n**Support depends on triage.** If resolver queues exceed capacity or the knowledge base goes stale, reports pile up and those same groups hit dead ends.\n\n**An Issue Report becomes a documented resolution.** Each report ends with an authoritative answer, never left in a queue.","specialization":""},{"id":"gl-advancement-private-support","type":"Goal","name":"Secure private support through lawful donor relationships","documentation":"**Donor relationships need clear consent.** The institution secures private support only where consent is demonstrable, gift records are correctly attributed, and pledge payments are collected.\n\n**That clarity protects revenue.** If consent is not demonstrated, records are not attributed, or pledges go uncollected, private revenue and endowment growth stall.\n\n**A gift record settles attribution.** Correct attribution to the right legal entity keeps donor intent and collected support together.","specialization":""},{"id":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","type":"Grouping","name":"Grant Management","documentation":"**A call for proposals arrives.** The university screens it and then manages the award through every stage: proposal, signed agreement, spending, delivery, compliance and closeout. This is the part of the institution that keeps externally funded projects usable, recovers sponsor money, and proves the work was done lawfully. When it runs well, staff charged to grants are paid and the university does not return funds it has already received.\n\n**It sits between sponsors and project work.** It depends on clear sponsor calls, accurate expense records and timely audit responses, and it turns those into proposal submissions, signed agreements, invoices, progress reports and compliance reports. A missed audit finding blocks future awards from the same sponsor, so the corrective loop matters as much as the original application.\n\n**The Executed Grant Agreement controls the award.** It exists only after both the institution and the sponsor have signed, and the institution keeps it as the controlling document for everything that follows.","specialization":""},{"id":"id-32ef1aee-f646-4fb4-8a01-90c553ac705a","type":"Grouping","name":"Institutional Advancement","documentation":"**Private support supplements public funding.** Serbian higher education relies on state-funded places and self-financing tuition, so institutional advancement secures philanthropic support, builds donor relationships, and grows endowed funds. Each incoming pledge or gift is checked against the Serbian Law on Personal Data Protection and recorded under the correct university or faculty legal entity. That protects revenue and donor trust across both integrated and federated university forms.\n\n**It feeds a chain of receipts, schedules, and recognition.** Donor prospect lists, gift notifications, and consent records arrive here. When a gift is verified, a pledge signed, or a campaign milestone reached, the domain issues outputs such as gift receipts, pledge payment schedules, and donor acknowledgement letters. Those records keep donors informed and make future outreach lawful and targeted.\n\n**The gift receipt carries the weight.** A verified gift becomes a gift receipt that ties the payment to the specific donor and fund, leaving a traceable record for the institution and the supporter.","specialization":""},{"id":"id-b3783a69-5a26-4c8c-b0dc-f13ebb34baf9","type":"Grouping","name":"Manage Academics","documentation":"**Before each term starts.** The institution must turn approved study programmes into a workable schedule of courses, instructors, and rooms. Manage Academics carries this from curriculum planning through student assessment and academic support. When it works, every enrolled student follows a validated study path, earns ECTS credits, and receives a recognised qualification.\n\n**It links planning to the records the rest of the institution reads.** This work depends on the Study Programme Proposal, Course Syllabus, Teaching Staff Availability, and Room Inventory. The grades it records and the Transcript of Records it issues keep enrolment verification, tuition billing, and graduation certification running, because those downstream processes read the same student data.\n\n**The Course Catalogue publishes the plan.** It is the official list of available courses for a given academic year, and it is what students check before registration opens.","specialization":""},{"id":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","type":"Grouping","name":"Manage Students","documentation":"**From first contact to separation.** A student's administrative lifecycle covers recruitment, admission, enrollment, financial arrangements, housing, records, and billing. Every student on the books is attached to an accredited study programme, holds a lawful Student Record, and receives the services their status carries.\n\n**Accreditation and quota sit upstream.** A Student Record is opened only when NAT has issued a valid Accreditation Decision for the programme. Admissions, enrollment confirmations, financial aid awards, housing assignments, tuition invoices, and transcripts all depend on that central record. When a student is not associated with both an accredited programme and a lawful Student Record, those downstream documents stop.\n\n**The Student Record anchors the rest.** It is the central record, updated when a Personal Data Change Request is verified. When it is accurate, each downstream service proceeds against the same lawful record.","specialization":""},{"id":"id-bd24036d-055c-476f-8c7c-ada1e2d8ebac","type":"Grouping","name":"Marketing","documentation":"**Promotion ties each claim to accreditation.** The marketing function presents accredited study programmes, builds institutional reputation, and generates qualified prospective student demand within state-funded enrolment quotas and the European Higher Education Area. It owns the message that reaches prospective students, parents, employers, and public bodies, and that message must stay in line with the Law on Higher Education and the Standards and Guidelines for Quality Assurance in the European Higher Education Area.\n\n**Every claim traces to official specifications.** The function works from the ministry's Enrolment Quota Decision and the Accredited Study Programme Catalogue with ECTS credit values. Every public claim must be traceable to the official programme specification. Before any public material goes out, it is checked against the accredited programme portfolio and the Law on Higher Education. The check protects against promoting a programme without a valid accreditation decision or misstating its ECTS workload. When that happens, materials are removed and no qualified Lead Record is generated, so the institution cannot fill its state-funded quota.\n\n**Programme Fact Sheet carries the standard.** The Programme Fact Sheet is issued only after a compliance review against accreditation status and ECTS presentation rules. It states the learning outcomes, accreditation status, and workload in ECTS for a study programme, so every public claim can be traced back to the official NAT-accredited programme specification.","specialization":""},{"id":"id-d282e41f-2f23-4160-9a6f-d9401cc14f2a","type":"Grouping","name":"Sales","documentation":"**Prospects arrive from inquiries and campaigns.** The Sales domain turns those prospects into signed revenue agreements for study places, contract education, research services, and other chargeable offerings. In the Serbian and EHEA setting, that means selling nationally accredited programmes to self-financing students and corporate clients within state-set enrolment quotas. The outcome is a signed Sales Agreement or Enrollment Contract valid under the Law on Higher Education and usable for fee collection. When this works, fee revenue from self-financing students and contract clients is recognised, and downstream billing issues payment obligations.\n\n**It depends on accreditation and quotas.** Each saleable programme must hold current NAT accreditation and fit within the ministry-fixed enrolment quota. A programme without current accreditation or with exhausted quota is not sold. The domain builds a valid offer from each Accredited Study Programme record and validates Draft Tuition Fee Schedules against cost and regulatory requirements before use. The signed documents it produces carry the legal signatory of the university or faculty and feed fee collection downstream.\n\n**One quota caps self-financing places.** The ministry-approved **Enrollment Quota** sets the maximum number of sellable places per programme and cycle. A programme that exhausts its quota is not sold, regardless of demand. This protects the institution from committing places it is not authorised to deliver.","specialization":""},{"id":"id-ae0ab1dc-95a9-4226-8013-05a65cb447de","type":"Grouping","name":"Support","documentation":"**Problems are logged, sorted, and answered.** When a student or staff member hits a broken IT system, a facilities fault, or a question about enrollment or fees, the Support domain takes the report and routes it to the right resolver or knowledge source. Its job is to make sure every Issue Report and Inquiry receives a documented resolution or response. Unresolved blockers are what this domain exists to remove.\n\n**It sits across both central and faculty-level help.** The same type of issue is handled by a central support unit or by a faculty-level office, depending on whether the university is integrated or federated. The domain keeps ownership and escalation paths clear while respecting the legal personality of faculties. That consistency is what lets a student complete enrollment or a staff member access records without knowing who is behind the resolution.\n\n**After a fix, the knowledge is kept.** A **Knowledge Article** captures the solution for reuse, so the next person with the same issue does not wait for diagnosis from scratch. It turns a single fix into institutional memory.","specialization":""},{"id":"sh-staff","type":"Stakeholder","name":"Academic and non-academic staff","documentation":"**Staff provide what institutions buy.** Academic and non-academic staff supply **teaching, research and administrative inputs** to higher education institutions.\n\n**The operating model records those purchases.** Operators buy those inputs from staff.","specialization":""},{"id":"sh-commissioner-data-protection","type":"Stakeholder","name":"Commissioner for Information of Public Importance and Personal Data Protection","documentation":"**Personal data handling has an external supervisor.** The Commissioner for Information of Public Importance and Personal Data Protection oversees personal data processing under the Law on Personal Data Protection. That oversight applies to any processing of personal data in the sector.\n\n**The law defines the boundary.** The Commissioner supervises personal data processing to the standard set by the law. The baseline institutions must meet when processing personal data is the **Law on Personal Data Protection**.","specialization":""},{"id":"sh-employers","type":"Stakeholder","name":"Employers","documentation":"**Employers buy three things from institutions.** Higher education operators sell graduates, research results, and contract education to employers. These purchases turn academic output into a commercial exchange.\n\n**Employer demand gives this exchange shape.** Institutions sell research results and graduates to employers. That flow links academic work to the labour market. A direct transaction between an institution and a business is the purchase of **research results**.","specialization":""},{"id":"sh-equipment-suppliers","type":"Stakeholder","name":"Equipment suppliers","documentation":"**Institutions buy their equipment.** Equipment suppliers provide **teaching, laboratory and research equipment** used by higher education institutions.\n\n**These purchases appear in the operating model.** Operators buy teaching, research and administrative inputs from equipment suppliers.","specialization":""},{"id":"sh-facility-providers","type":"Stakeholder","name":"Facility providers","documentation":"**Physical space comes from providers.** Facility providers supply **physical facilities and related services** used by higher education institutions.\n\n**The operating model lists these purchases.** Operators buy teaching, research and administrative inputs from facility providers.","specialization":""},{"id":"sh-ministry-higher-education","type":"Stakeholder","name":"Ministry responsible for higher education","documentation":"**The ministry supervises and funds institutions.** The ministry responsible for higher education allocates budget funding, supervises institutions, and purchases education, research and public services through ministry funding. This makes it the main buyer and supervisor in the sector.\n\n**Public funding reaches institutions through this.** The ministry buys capacity on state-funded places, which directs budget funding into institutions. The transaction that turns a policy decision into a funded study place is the purchase of **capacity on state-funded places**.","specialization":""},{"id":"sh-nat","type":"Stakeholder","name":"National Accreditation Body","documentation":"**Accreditation is the gateway to recognised degrees.** The National Accreditation Body accredits institutions and study programmes. That approval acts as a precondition for enrolling students and issuing recognised degrees.\n\n**Formal records follow each approval.** The body issues Accreditation Certificates and Study Programme Accreditations. The document that unlocks enrolment for a specific programme is a **Study Programme Accreditation**.","specialization":""},{"id":"sh-partner-institutions","type":"Stakeholder","name":"Partner institutions","documentation":"**Erasmus+ credit mobility connects institutions across borders.** Serbian institutions exchange learning agreements and inter-institutional agreements with foreign partner institutions. These agreements set the terms for mobility.\n\n**Partner institutions formalise the exchange through agreements.** Under Erasmus+ credit mobility, institutions exchange Learning Agreements and Inter-Institutional Agreements. The relationship for a specific mobility arrangement is defined by an **Inter-Institutional Agreement**.","specialization":""},{"id":"sh-publishers","type":"Stakeholder","name":"Publishers","documentation":"**Publishers supply the content.** Publishers supply **published content** for teaching and research inputs.\n\n**The operating model shows the purchase.** Operators buy teaching, research and administrative inputs from publishers.","specialization":""},{"id":"sh-students","type":"Stakeholder","name":"Students","documentation":"**Institutions sell education to two kinds of students.** Operators offer study programmes to learners who are either state-funded on budget places or self-financing. Both routes bring revenue into the institution.\n\n**The funding status shapes the exchange.** A state-funded budget place means the state pays; self-financing means the student pays directly. That distinction determines how public and private money supports each programme. The funding route that carries public money into enrolment is a **budget place**.","specialization":""},{"id":"vs-call-to-grant-closeout","type":"ValueStream","name":"Call-to-Grant-Closeout","documentation":"**A Call for Proposals opens.** Sponsor guidelines accompany the call. The stream carries the proposal through award, project execution, compliance and billing. It ends with a Final Project Report and a reconciled sponsor payment recorded against the award. The purpose is to close out the project with every expenditure allowable and aligned with the Law on Higher Education, so payment is released.\n\n**Compliance determines final payment.** The stream depends on sponsor terms aligning with the Law on Higher Education and on every expenditure passing review. When those hold, the sponsor releases payment and the institution records it against the award. This protects the institution from having to return funds.\n\n**Final Project Report closes the award.** It accompanies the reconciled sponsor payment.","specialization":""},{"id":"vs-campaign-to-profitability","type":"ValueStream","name":"Campaign-to-Profitability","documentation":"**A new recruitment cycle begins.** Market research is commissioned, bringing in prospective student and competitor data. The stream carries that evidence through to a demonstrated campaign return, ending with a profitability report that shows which programmes and funding types repay marketing spend. Marketing and finance leadership receive a Profitability Report and Campaign Performance Report. The point is to tie spend to enrolment outcomes, so future budget follows evidence.\n\n**Marketing spend needs evidence.** Enrolment conversion data must carry a marketing source code from first contact to enrolment, and campaign budget must still be available during the main recruitment period. When both hold, the stream hands leadership a clear link between spend and enrolled students, and next cycle's budget is allocated on evidence.\n\n**A Profitability Report settles the budget.** It lists which programmes and funding types repay marketing spend.","specialization":""},{"id":"vs-curriculum-to-class-schedule","type":"ValueStream","name":"Curriculum-to-Class-Schedule","documentation":"**Council approves the course list.** After an accredited curriculum is in place, the academic council approves the course offerings list. The stream turns those approved courses into bookable classroom sessions with reserved teaching spaces and equipment. The aim is to ensure every required course has a qualified instructor and a room before registration opens. Students and staff receive:\n- a published Class Schedule\n- a Teaching Load Report\n- Resource Booking Confirmations\n\n**Scheduling depends on instructors and rooms.** The stream requires a qualified instructor and an available room for each required course. When those are in place, the course is scheduled and students register. This connects curriculum approval to day-to-day teaching operations.\n\n**A published Class Schedule opens registration.** It lists the bookable classroom sessions for the term.","specialization":""},{"id":"vs-donor-prospect-to-endowment","type":"ValueStream","name":"Donor-Prospect-to-Endowment","documentation":"**A consented prospect record arrives.** The advancement database receives a new donor prospect with recorded consent, and that entry starts the journey through prospect research, solicitation, gift processing and endowment establishment. The institution is working to turn private support into lasting funds; it does so only when consent is demonstrated at each step and pledge payments are collected.\n\n**The sequence ends with the fund in place.** What began as a record ends as an endowed fund established, gift receipts issued, and an endowment annual report delivered to the donor. If that chain holds, private revenue is protected and endowment growth continues.\n\n**A final report reaches the donor.** The **Endowment Annual Report** is delivered once the fund is established and receipts are issued, giving the donor a clear record of the endowed fund now in place.","specialization":""},{"id":"vs-enrollment-to-graduation","type":"ValueStream","name":"Enrollment-to-Graduation","documentation":"**An enrolled student seeks course advice.** At the start of a term, the student requests guidance on course selection. The stream carries them through advising, registration, assessment and record completion. It ends with a cumulative Student Record, a Transcript of Records and a Diploma Supplement after final assessment. The purpose is to accumulate ECTS credits course by course, so the student graduates.\n\n**Credits depend on assessment evidence.** The stream requires assessment evidence for each course and a path to pass required courses. When those are present, credits accumulate and final records are issued. This protects the student's progression and the integrity of the transcript.\n\n**A Diploma Supplement completes the record.** It is issued after final assessment, alongside the cumulative Student Record and the Transcript of Records.","specialization":""},{"id":"vs-enrollment-to-paid-tuition","type":"ValueStream","name":"Enrollment-to-Paid-Tuition","documentation":"**Enrollment Confirmation creates a payment obligation.** For every state-funded or self-financing student, that confirmation starts a journey through aid determination, payor relationships and invoice payment allocation. The institution bills and collects tuition only when payor authorization is present and aid eligibility is resolved.\n\n**The account is settled by a recorded allocation.** Once the Tuition Invoice is issued, payments are matched to that invoice. The journey ends when the student account moves out of unpaid status and the obligation is closed.\n\n**The account closure is recorded.** The **Payment Allocation Record** shows where each payment was applied, closing the obligation that enrollment confirmation opened.","specialization":""},{"id":"vs-issue-report-to-resolution","type":"ValueStream","name":"Issue-Report-to-Resolution","documentation":"**A report reaches the service desk.** A student or staff member submits an Information Inquiry or Issue Report, and support staff route it to the right resolver. The resolver fixes the underlying problem and updates reusable knowledge, so the next similar report is handled more quickly.\n\n**The work depends on two conditions.** Each report needs enough diagnostic detail, and each resolver needs access to the affected system or Student Record. When those hold, the issue is resolved and the requester is not left blocked.\n\n**The fix is documented once.** The **Resolution Record** records what was fixed and is completed before the Closure Notification goes to the requester, giving both sides a record of what was resolved.","specialization":""},{"id":"vs-programme-proposal-to-accreditation","type":"ValueStream","name":"Programme-Proposal-to-Accreditation","documentation":"**A Study Programme Proposal is submitted.** The responsible academic body puts forward the proposal. The stream moves through curriculum design, internal program evaluation and effectiveness measurement. It produces a Program Evaluation Report and an Accreditation Self-Evaluation Report sufficient for submission to NAT. The point is to prepare accreditation renewal on complete documentation and current standards, protecting the programme's right to enrol students.\n\n**Documentation and standards must be current.** The stream depends on Study Programme Documentation being complete and standards being up to date. When they are, the evaluation reports are ready for NAT and the programme keeps its enrolment rights. This connects proposal to national accreditation.\n\n**Accreditation Self-Evaluation Report goes to NAT.** It is the evidence package prepared for the national accreditation body.","specialization":""},{"id":"vs-prospect-to-enrollment","type":"ValueStream","name":"Prospect-to-Enrollment","documentation":"**A prospective student submits an inquiry.** The inquiry form or event registration includes recorded consent. The stream carries that contact through recruitment planning, lead qualification, admission, course registration and master record creation. It ends with an Enrollment Confirmation and an active Student Record for a place on an accredited study programme. Admission is protected by two conditions: the programme holds current NAT accreditation, and the prospect has a lawful consent record.\n\n**Accreditation and consent are required.** The stream depends on those conditions before any admission offer is issued. When they hold, the new student record becomes active and downstream academic services begin. This connects recruitment to the institution's academic records.\n\n**An Enrollment Confirmation marks the transition.** It confirms a place on an accredited study programme, turning a prospect into an enrolled student.","specialization":""},{"id":"vs-sales-plan-to-revenue","type":"ValueStream","name":"Sales-Plan-to-Revenue","documentation":"**A ministry-approved enrolment quota starts the year.** Sales staff use that quota to plan territory assignment, pricing, lead conversion, channel sales and account renewal. The work turns the annual plan into revenue; it succeeds when every offer is backed by the accredited programme catalogue and current price list, so no invalid offer goes out.\n\n**The journey ends in account review.** From that planning start, the institution produces three finished outcomes:\n- a Customer Portfolio Analysis\n- renewed contracts\n- signed sales orders for self-financing and contract client places\nEach signed Enrollment Contract or Sales Agreement reflects a valid, deliverable offer.\n\n**The year ends in a single analysis.** The **Customer Portfolio Analysis** gathers the account-level results into one review that closes the sales cycle.","specialization":""}],"relationships":[{"id":"rel-comp-id-ebfc2ab0-2c6f-42e4-b1d7-a387d571b009","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-ae0ab1dc-95a9-4226-8013-05a65cb447de","targetid":"id-ebfc2ab0-2c6f-42e4-b1d7-a387d571b009","specialization":""},{"id":"rel-comp-id onship","name":"","documentation":"","sourceid":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","targetid":"id-fea4c7b7-058d-4326-a804-3451a3d9276e","specialization":""},{"id":"rel-comp-id-23e7115f-0500-4038-95a8-21e2597ef3b0","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","targetid":"id-23e7115f-0500-4038-95a8-21e2597ef3b0","specialization":""},{"id":"rel-comp-id-a1b2e963-145c-42d9-a3b0-fdaff60f0fc3","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","targetid":"id-a1b2e963-145c-42d9-a3b0-fdaff60f0fc3","specialization":""},{"id":"rel-comp-id-51cd6874-501c-40ec-b797-8d46bc6d2240","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","targetid":"id-51cd6874-501c-40ec-b797-8d46bc6d2240","specialization":""},{"id":"rel-comp-id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","specialization":""},{"id":"rel-comp-id-2e6834a2-c238-4cf4-989a-cca3222baa9f","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","specialization":""},{"id":"rel-comp-id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","specialization":""},{"id":"rel-comp-id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","specialization":""},{"id":"rel-comp-id-d6e5d220-7427-459d-b8f4-8fae0c27c848","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-d6e5d220-7427-459d-b8f4-8fae0c27c848","specialization":""},{"id":"rel-comp-id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","specialization":""},{"id":"rel-comp-id-b334c94a-a2ff-449e-869e-70a0960b4aca","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-b334c94a-a2ff-449e-869e-70a0960b4aca","specialization":""},{"id":"rel-comp-id-f02c8a55-396b-4810-ab8a-cea744018b10","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-f02c8a55-396b-4810-ab8a-cea744018b10","specialization":""},{"id":"rel-comp-id-3c048211-0449-40be-a766-678a749f7390","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-3c048211-0449-40be-a766-678a749f7390","specialization":""},{"id":"rel-comp-id-42e5f948-24cb-4fd9-8dcd-d99ec588dcef","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-42e5f948-24cb-4fd9-8dcd-d99ec588dcef","specialization":""},{"id":"rel-comp-id-d7a1670b-5b1f-4419-a987-19f2b699fecb","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-b3783a69-5a26-4c8c-b0dc-f13ebb34baf9","targetid":"id-d7a1670b-5b1f-4419-a987-19f2b699fecb","specialization":""},{"id":"rel-comp-id-4a109615-89b7-4d83-9527-666fb431ad35","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-b3783a69-5a26-4c8c-b0dc-f13ebb34baf9","targetid":"id-4a109615-89b7-4d83-9527-666fb431ad35","specialization":""},{"id":"rel-comp-id-8b80a6ea-0dfa-4673-9eab-027449e3bf84","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-b3783a69-5a2 tid":"id-a609d67d-c8e5-42b1-86fb-23647dc01b52","specialization":""},{"id":"rel-comp-id-8ef1a7e0-4d0f-4e57-bcf7-50501651842d","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-d282e41f-2f23-4160-9a6f-d9401cc14f2a","targetid":"id-8ef1a7e0-4d0f-4e57-bcf7-50501651842d","specialization":""},{"id":"rel-comp-id-a711bf13-8d88-4d21-8410-ab448500566a","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-d282e41f-2f23-4160-9a6f-d9401cc14f2a","targetid":"id-a711bf13-8d88-4d21-8410-ab448500566a","specialization":""},{"id":"rel-comp-id-ebfac6ac-707e-497a-b678-abc00810b609","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-d282e41f-2f23-4160-9a6f-d9401cc14f2a","targetid":"id-ebfac6ac-707e-497a-b678-abc00810b609","specialization":""},{"id":"rel-comp-id-52f6b145-944f-43d6-8dff-7f43ef37bc51","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-d282e41f-2f23-4160-9a6f-d9401cc14f2a","targetid":"id-52f6b145-944f-43d6-8dff-7f43ef37bc51","specialization":""},{"id":"rel-comp-id-a6bbc833-d30e-460f-9df3-0ebe783e8f43","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-b3783a69-5a26-4c8c-b0dc-f13ebb34baf9","targetid":"id-a6bbc833-d30e-460f-9df3-0ebe783e8f43","specialization":""},{"id":"rel-comp-id-9475e03b-21b2-44ad-a009-25c3be831b1e","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-9475e03b-21b2-44ad-a009-25c3be831b1e","specialization":""},{"id":"rel-comp-id-1bdefe7d-266e-4b95-8f83-c2539d0148ab","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-1bdefe7d-266e-4b95-8f83-c2539d0148ab","specialization":""},{"id":"rel-comp-id-7867ed7a-a6c0-499b-a13e-41619962e307","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-7867ed7a-a6c0-499b-a13e-41619962e307","specialization":""},{"id":"rel-comp-id-f7b60e7c-3f68-40f5-9f7d-335d13dd7c1c","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-ae0ab1dc-95a9-4226-8013-05a65cb447de","targetid":"id-f7b60e7c-3f68-40f5-9f7d-335d13dd7c1c","specialization":""},{"id":"rel-comp-id-58101092-095e-42fc-a263-ddc537d93a84","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-58101092-095e-42fc-a263-ddc537d93a84","specialization":""},{"id":"rel-comp-id-703c3278-af18-4e57-8bd0-ef52b23dc077","type":"CompositionRelationship","name":"","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-703c3278-af18-4e57-8bd0-ef52b23dc077","specialization":""},{"id":"rel-flow-hiedrs-0058","type":"FlowRelationship","name":"Academic Probation Notice","documentation":"Content\nA formal notice that a student has failed to meet the minimum ECTS credit progression required, issued when the semester or year results are final.\n\nTrigger\nThe grade report shows the student's earned credits fall below the satisfactory academic progress threshold.\n\nUnlocks\nAward and Monitor Financial Aid can review the student's aid eligibility, adjust the aid package, or initiate revocation of a state-funded place or scholarship.\n\nWithout this\nAward and Monitor Financial Aid continues paying aid to students who are not progressing, misallocating public funds and failing to enforce the statutory study progress condition.","sourceid":"id-8fcac125-67c1-46c5-b3a6-0cb03f136833","targetid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","specialization":""},{"id":"rel-flow-hiedrs-0071","type":"FlowRelationship","name":"Academic Standing Record","documentation":"Content\nA record of the student's academic standing after the grading period, showing earned ECTS credits and whether minimum progression thresholds are met.\n\nTrigger\nThe examination period closes and grades are finalised.\n\nUnlocks\nAdvise Students and Provide can assess academic standing and prepare a Study Plan or Course Selection Advice for the next term.\n\nWithout this\nAdvise Students and Provide lacks the current progression status, so advising occurs on stale data and may approve an unrealistic course load.","sourceid":"id-8fcac125-67c1-46c5-b3a6-0cb03f136833","targetid":"id-d7a1670b-5b1f-4419-a987-19f2b699fecb","specialization":""},{"id":"rel-flow-hiedrs-0066","type":"FlowRelationship","name":"Accommodation Letter","documentation":"Content\nA letter confirming a student's disability-related accommodation need, specifying the required housing adjustment or accessible room features.\n\nTrigger\nThe assistance office validates disability documentation and determines the student's accommodation requirements.\n\nUnlocks\nProvide Housing and Auxiliary Services can assign an appropriate room and record the accommodation in the housing contract, ensuring legal compliance.\n\nWithout this\nProvide Housing and Auxiliary Services assigns standard housing, ignoring accessibility needs and exposing the institution to discrimination claims and student hardship.","sourceid":"id-4a109615-89b7-4d83-9527-666fb431ad35","targetid":"id-3c048211-0449-40be-a766-678a749f7390","specialization":""},{"id":"rel-flow-hiedrs-0018","type":"FlowRelationship","name":"Account Prioritisation List","documentation":"Content\nAccount Prioritisation List ranks customer accounts by value, churn risk, and cross-sell potential, with recommended focus levels produced by the portfolio analysis.\n\nTrigger\nThe quarterly portfolio analysis or an urgent risk event is completed.\n\nUnlocks\nSales Force Management can assign salespeople to high-priority accounts, align territory work, and direct effort to protect revenue and advance cross-sell targets.\n\nWithout this\nEvery account receives equal attention, high-value accounts are neglected, and churn or lost expansion opportunities go unnoticed.","sourceid":"id-6d5adb53-67bb-47a3-86a7-6157091b49aa","targetid":"id-ebfac6ac-707e-497a-b678-abc00810b609","specialization":""},{"id":"rel-flow-hiedrs-0016","type":"FlowRelationship","name":"Account Record","documentation":"Content\nAccount Record leaves Account Management updated after each customer interaction, containing contact details, purchase history, contract status, service complaints, and current segment classification.\n\nTrigger\nA customer interaction, renewal, complaint resolution, or data update is completed.\n\nUnlocks\nCustomer Portfolio Management can segment accounts, analyse lifetime value, detect churn risk, and prioritise accounts using current and accurate attributes.\n\nWithout this\nPortfolio analysis is built on stale records, so prioritisation and risk assessment misdirect sales effort and revenue protection.","sourceid":"id-e5bf6235-0851-40cc-9e21-86b9fbcaac81","targetid":"id-6d5adb53-67bb-47a3-86a7-6157091b49aa","specialization":""},{"id":"rel-flow-hiedrs-0061","type":"FlowRelationship","name":"Accreditation Evidence File","documentation":"Content\nThe collected evidence of internal quality assurance, including survey responses, grade distributions, and graduate employment data, organised for external review.\n\nTrigger\nA study programme is due for periodic accreditation or self-evaluation under ESG 2015.\n\nUnlocks\nEvaluate Academic Program can use the evidence file to prepare the Accreditation Self-Evaluation Report and demonstrate compliance with NAT standards.\n\nWithout this\nEvaluate Academic Program must assemble evidence from scattered records or proceed without proof of learning outcomes, weakening the self-evaluation and risking accreditation conditions.","sourceid":"id-8b80a6ea-0dfa-4673-9eab-027449e3bf84","targetid":"id-d8e4c197-826c-4d16-8f57-a29cd7b40c14","specialization":""},{"id":"rel-flow-hiedrs-0109","type":"FlowRelationship","name":"Accreditation Status Confirmation","documentation":"Content\nAccreditation Status Confirmation moves as an internal notice that a specific study programme holds valid NAT accreditation for the relevant cycle and that enrolment is lawful.\n\nTrigger\nAdmission cycle begins or a programme accreditation is renewed or expires.\n\nUnlocks\nAdmit Students can lawfully evaluate applications for that programme and issue admission decisions because the legal precondition is met.\n\nWithout this\nAdmit Students could enrol applicants into a programme whose accreditation has lapsed, requiring reversal of admissions and risking ministry sanctions.","sourceid":"id-a6bbc833-d30e-460f-9df3-0ebe783e8f43","targetid":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","specialization":""},{"id":"rel-flow-hiedrs-0110","type":"FlowRelationship","name":"Accreditation Status Confirmation","documentation":"Content\nThe confirmation moves as a formal internal statement that the programme to be awarded holds valid NAT accreditation at the moment of graduation.\n\nTrigger\nGraduation clearance is requested for a student in a final-year cohort.\n\nUnlocks\nIssue Diplomas and Diploma Supplements can lawfully verify the study programme is accredited before issuing a recognised diploma and supplement.\n\nWithout this\nThe capability would issue diplomas blind to accreditation status, potentially issuing invalid credentials and undermining legal recognition.","sourceid":"id-a6bbc833-d30e-460f-9df3-0ebe783e8f43","targetid":"id-7867ed7a-a6c0-499b-a13e-41619962e307","specialization":""},{"id":"flow-dom-manage-academics--manage-students","type":"FlowRelationship","name":"Accreditation Status Confirmation","documentation":"","sourceid":"id-b3783a69-5a26-4c8c-b0dc-f13ebb34baf9","targetid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","specialization":""},{"id":"rel-flow-hiedrs-0051","type":"FlowRelationship","name":"Accredited Study Programme","documentation":"Content\nThe study programme record after NAT accreditation, carrying the programme's learning outcomes, ECTS credit total, duration, and the legal basis for enrolling students.\n\nTrigger\nNAT grants accreditation and the institution publishes the accredited programme for the admission cycle.\n\nUnlocks\nAdmit Students can verify that a chosen programme is legally permitted to enrol students and issue recognised degrees, allowing it to evaluate applications against a valid programme.\n\nWithout this\nAdmit Students cannot distinguish accredited from unaccredited programmes, so an application could be evaluated for a programme that lacks the legal right to enrol students, risking admission to an invalid study programme.","sourceid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","targetid":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","specialization":""},{"id":"rel-flow-hiedrs-0047","type":"FlowRelationship","name":"Accredited Study Programme Catalogue","documentation":"Content\nThe catalogue of all currently accredited study programmes with their ECTS distribution, duration, and accreditation status, ready for promotional planning.\n\nTrigger\nThe annual planning cycle starts and the institution issues the updated catalogue after NAT accreditation decisions.\n\nUnlocks\nDefine Marketing Strategy can select which accredited programmes to promote and set enrolment targets aligned with legally permitted offers.\n\nWithout this\nDefine Marketing Strategy cannot distinguish accredited from expired programmes, risking marketing a programme that cannot legally enrol students, wasting budget and damaging reputation.","sourceid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","targetid":"id-b08a3dbb-d42a-4bcc-b7c2-eab26c498651","specialization":""},{"id":"flow-dom-manage-academics--marketing","type":"FlowRelationship","name":"Accredited Study Programme Catalogue","documentation":"","sourceid":"id-b3783a69-5a26-4c8c-b0dc-f13ebb34baf9","targetid":"id-bd24036d-055c-476f-8c7c-ada1e2d8ebac","specialization":""},{"id":"rel-flow-hiedrs-0084","type":"FlowRelationship","name":"Acknowledgement History Entry","documentation":"Content\nAn acknowledgement history entry recording the donor identifier, gift reference, acknowledgement date, and channel used, produced after a donor acknowledgement is sent.\n\nTrigger\nThe donor acknowledgement letter is issued and logged.\n\nUnlocks\nManage Contributors can update the contributor profile with the stewardship touchpoint and avoid premature re-solicitation.\n\nWithout this\nManage Contributors lacks the acknowledgement record, treats a donor as unthanked or over-solicits, and retention scoring loses a stewardship signal.","sourceid":"id-a4637e89-2929-4077-a22a-d756585cb025","targetid":"id-96bbedb3-ee3c-46fc-8623-e16a8fa4e7d2","specialization":""},{"id":"rel-flow-hiedrs-0087","type":"FlowRelationship","name":"Admission Decision Record","documentation":"Content\nThe final Admission Decision Record for an evaluated applicant, signed by the authorised university or faculty body, showing programme, funding status and acceptance conditions.\n\nTrigger\nAn applicant has been evaluated and the admission decision rendered.\n\nUnlocks\nMaintain Student Records can create the master Student Record and establish the student's official enrolment status.\n\nWithout this\nNo student record can be created, and downstream billing, aid, enrolment and directory capabilities have no person to reference.","sourceid":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","targetid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","specialization":""},{"id":"rel-flow-hiedrs-0103","type":"FlowRelationship","name":"Admission Decision Record","documentation":"Content\nThe final Admission Decision Record showing programme, funding status and acceptance conditions, used to establish initial aid eligibility and state-funded or self-financing status.\n\nTrigger\nAn admission decision is rendered and the student is accepted.\n\nUnlocks\nAward and Monitor Financial Aid can verify the student's funding status before scholarships or state-funded support are awarded.\n\nWithout this\nThe aid office lacks the official funding status for newly admitted students, risking incorrect aid decisions.","sourceid":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","targetid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","specialization":""},{"id":"rel-flow-hiedrs-0008","type":"FlowRelationship","name":"Allocation Record","documentation":"Content\nA record showing each sponsor payment matched to a grant award, posted to budget lines, and separated from state-funded or self-financing student fees.\n\nTrigger\nA sponsor payment is matched to an invoice and posted to the grant budget.\n\nUnlocks\nMonitor Compliance can verify that state and sponsor funds are not mixed and that public finance traceability is preserved.\n\nWithout this\nThere is no auditable evidence of fund separation, creating a compliance violation risk and undermining the institution's accountability.","sourceid":"id-51cd6874-501c-40ec-b797-8d46bc6d2240","targetid":"id-23e7115f-0500-4038-95a8-21e2597ef3b0","specialization":""},{"id":"rel-flow-hiedrs-0075","type":"FlowRelationship","name":"Annual Giving Report","documentation":"Content\nThe annual giving report summarizing all collected gifts and pledge payment activity by donor, fund, and legal entity for the completed period.\n\nTrigger\nPeriod close and compilation of the giving report by pledge and gift management.\n\nUnlocks\nManage Contributors can refresh giving history and update donor retention scores and segment membership based on actual recent giving.\n\nWithout this\nManage Contributors works with stale giving history, retention scores no longer reflect true engagement, and segmentation misprioritizes donors.","sourceid":"id-54df2c7e-67f4-4959-8243-c1c192a5cf63","targetid":"id-96bbedb3-ee3c-46fc-8623-e16a8fa4e7d2","specialization":""},{"id":"rel-flow-hiedrs-0011","type":"FlowRelationship","name":"Approved Expenditure Report","documentation":"Content\nA compliance-checked expenditure report for grant costs, with disallowed costs removed and budget line allocations verified against the grant terms.\n\nTrigger\nMonitor Compliance completes expense allowability checks and issues the report to billing.\n\nUnlocks\nBill Sponsor can prepare accurate Sponsor Invoices based on only allowable, verified expenditures.\n\nWithout this\nThe billing function lacks a verified expenditure base and may invoice costs that the sponsor later disallows.","sourceid":"id-23e7115f-0500-4038-95a8-21e2597ef3b0","targetid":"id-1db93bd4-1dfe-459a-8324-c55dee07ec4f","specialization":""},{"id":"rel-flow-hiedrs-0116","type":"FlowRelationship","name":"Approved Learning Agreement","documentation":"Content\nApproved Learning Agreement moves as the signed three-party Erasmus+ learning agreement, listing courses to be taken abroad with ECTS credits and sending/home institution approvals.\n\nTrigger\nThe student, sending institution and host institution have all signed the learning agreement.\n\nUnlocks\nEnroll in Classes can record the incoming or outgoing mobility student's agreed course load and ECTS credits, integrating it with local enrollment records.\n\nWithout this\nEnroll in Classes cannot register mobility students with correct ECTS credit load, causing administrative mismatches and credit recognition failures.","sourceid":"id-1bdefe7d-266e-4b95-8f83-c2539d0148ab","targetid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","specialization":""},{"id":"rel-flow-hiedrs-0043","type":"FlowRelationship","name":"Campaign Performance Report","documentation":"Content\nCampaign Performance Report from effectiveness measurement carries ROI, conversion funnel analysis, cost per enrolment attribution, and optimization recommendations per campaign and programme.\n\nTrigger\nA campaign ends and enrolment conversion data becomes available after the admission cycle.\n\nUnlocks\nDefine Marketing Strategy can review lessons from previous campaigns, adjust strategy, reallocate budget, and refine target segments for the next cycle.\n\nWithout this\nStrategy would repeat untested assumptions; performance failures would go unexamined and budget would be allocated without evidence.","sourceid":"id-4d75a20e-4723-4e0a-b0f8-c439ccd4037f","targetid":"id-b08a3dbb-d42a-4bcc-b7c2-eab26c498651","specialization":""},{"id":"rel-flow-hiedrs-0010","type":"FlowRelationship","name":"Cash Receipt","documentation":"Content\nThe recorded cash receipt for a sponsor payment, with date, amount, currency, award reference, and budget line allocation, returned to the billing function.\n\nTrigger\nReceive Funding records the Cash Receipt after matching a sponsor payment to a Sponsor Invoice.\n\nUnlocks\nBill Sponsor can reconcile the paid invoice and close the receivable.\n\nWithout this\nThe billing unit may continue to pursue a paid invoice and cannot reconcile sponsor accounts.","sourceid":"id-51cd6874-501c-40ec-b797-8d46bc6d2240","targetid":"id-1db93bd4-1dfe-459a-8324-c55dee07ec4f","specialization":""},{"id":"rel-flow-hiedrs-0054","type":"FlowRelationship","name":"Class Schedule","documentation":"Content\nThe published timetable of all course sections for the term, including instructor, room, time, and the student group or cohort each section serves.\n\nTrigger\nThe class schedule is published before registration opens for the term.\n\nUnlocks\nEnroll in Classes can register students into specific course sections, check seat availability, and detect time conflicts for each student.\n\nWithout this\nEnroll in Classes cannot confirm section times or availability, forcing students to select courses blind and risking overlapping schedules or overfilled sections.","sourceid":"id-1ca721ed-d3db-46c1-8ad3-1680c683cace","targetid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","specialization":""},{"id":"rel-flow-hiedrs-0055","type":"FlowRelationship","name":"Class Schedule","documentation":"Content\nThe published timetable showing which courses require laboratory, studio, or specialised equipment at specific times.\n\nTrigger\nThe class schedule is published and resource-intensive courses are identifiable by their room and equipment requirements.\n\nUnlocks\nSchedule Resources and Facilities can allocate laboratories, studios, and equipment to the correct course sections at the correct times.\n\nWithout this\nSchedule Resources and Facilities cannot know which labs are needed when, so practical sessions are left unallocated and equipment may be double-booked or unused.","sourceid":"id-1ca721ed-d3db-46c1-8ad3-1680c683cace","targetid":"id-cbacfae9-ac1b-47fa-9b0f-25a035e0e5c8","specialization":""},{"id":"rel-flow-hiedrs-0019","type":"FlowRelationship","name":"Commission Rate Schedule","documentation":"Content\nCommission Rate Schedule is the approved set of commission rates by product, channel, and segment, issued by Price and Commission Management after governance authorisation.\n\nTrigger\nA commission plan is approved or a rate is revised.\n\nUnlocks\nSales Force Management can configure salesperson incentive calculations, communicate achievable earnings, and adjust behaviour toward high-margin offerings.\n\nWithout this\nIncentives cannot be calculated consistently, leading to disputes, low motivation, and sales effort placed on unprofitable products.","sourceid":"id-a711bf13-8d88-4d21-8410-ab448500566a","targetid":"id-ebfac6ac-707e-497a-b678-abc00810b609","specialization":""},{"id":"rel-flow-hiedrs-0056","type":"FlowRelationship","name":"Conflict Notification","documentation":"Content\nA notification listing a student's overlapping course sections or an instructor's double-booking discovered during scheduling, with the conflicting class identifiers.\n\nTrigger\nA conflict is detected when a student's selected sections or an instructor's assignments have overlapping times.\n\nUnlocks\nAdvise Students can alert the student and adjust the Study Plan or Course Selection Advice to resolve the schedule conflict before registration closes.\n\nWithout this\nAdvise Students remains unaware of conflicts, allowing a student to register for overlapping courses or an instructor to be assigned to two places, causing attendance failure.","sourceid":"id-1ca721ed-d3db-46c1-8ad3-1680c683cace","targetid":"id-d7a1670b-5b1f-4419-a987-19f2b699fecb","specialization":""},{"id":"rel-flow-hiedrs-0118","type":"FlowRelationship","name":"Consent Record","documentation":"Content\nConsent Record moves as a timestamped record of an individual's opt-in consent for recruitment contact, including the channel and purpose, produced by the prospect management activity.\n\nTrigger\nRecruit Prospects captures a prospect's consent checkbox on an inquiry form or event registration.\n\nUnlocks\nManage Data Protection can maintain the central record of lawful bases and verify consent validity if challenged.\n\nWithout this\nThe institution cannot demonstrate that consent was collected, making recruitment outreach unlawful under the Law on Personal Data Protection and GDPR.","sourceid":"id-42e5f948-24cb-4fd9-8dcd-d99ec588dcef","targetid":"id-f7b60e7c-3f68-40f5-9f7d-335d13dd7c1c","specialization":""},{"id":"rel-flow-hiedrs-0009","type":"FlowRelationship","name":"Corrective Action Plan","documentation":"Content\nA remediation plan issued by the compliance function, describing required actions, owner, and timeline to correct a noncompliance found in grant activity.\n\nTrigger\nA Noncompliance Finding is detected and a corrective action plan is issued.\n\nUnlocks\nManage Project can incorporate the corrective actions into the project plan and adjust execution to regain compliance.\n\nWithout this\nIdentified noncompliance is not remediated, exposing the grant to sponsor disallowance or termination.","sourceid":"id-23e7115f-0500-4038-95a8-21e2597ef3b0","targetid":"id-fea4c7b7-058d-4326-a804-3451a3d9276e","specialization":""},{"id":"rel-flow-hiedrs-0027","type":"FlowRelationship","name":"Course Catalogue","documentation":"Content\nCourse Catalogue is the official accredited programme catalogue with ECTS credits, cycles, and programme codes from Plan Curriculum and Courses.\n\nTrigger\nA study programme is accredited or revised and the catalogue is published.\n\nUnlocks\nMulti-Channel Sales can publish the Approved Programme Catalogue to channels and validate each order against accredited programmes.\n\nWithout this\nMulti-Channel Sales cannot distinguish valid accredited programmes, risking sale of unaccredited or outdated offerings.","sourceid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","targetid":"id-8ef1a7e0-4d0f-4e57-bcf7-50501651842d","specialization":""},{"id":"rel-flow-hiedrs-0052","type":"FlowRelationship","name":"Course Catalogue","documentation":"Content\nThe official list of courses from the accredited programme, each with its syllabus, ECTS weight, and learning outcomes, in the approved version.\n\nTrigger\nThe academic council approves the course catalogue for the upcoming term and releases it for scheduling.\n\nUnlocks\nSchedule Classes can build the Course Offerings List, knowing which courses must be scheduled and their contact hour requirements from the accredited curriculum.\n\nWithout this\nSchedule Classes has no authoritative source for which courses to run, and may omit required courses or include courses not accredited, producing an invalid timetable.","sourceid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","targetid":"id-1ca721ed-d3db-46c1-8ad3-1680c683cace","specialization":""},{"id":"flow-dom-manage-academics--sales","type":"FlowRelationship","name":"Course Catalogue","documentation":"","sourceid":"id-b3783a69-5a26-4c8c-b0dc-f13ebb34baf9","targetid":"id-d282e41f-2f23-4160-9a6f-d9401cc14f2a","specialization":""},{"id":"rel-flow-hiedrs-0057","type":"FlowRelationship","name":"Course Grade","documentation":"Content\nThe final grade for a specific course, expressed in the Serbian higher education grading scale, with the ECTS credits awarded, ready for entry into the student's official record.\n\nTrigger\nThe examiner finalises the course grade after all assessments and submits it to the student records office.\n\nUnlocks\nMa
