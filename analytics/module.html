<!--
  module.html — the analytical reporting system.
  Office/Design/sql space/module.html            Marcus Kael, 28 Aug 2026
  Architecture: Office/Design/sql space/PLAN_module_html.md
  Principle:    team_memory/principles/every_report_is_a_table_with_numbers_and_shape.md

  THE RULE (Bora, 27–28 Aug — stated as practitioner experience, not preference)
    Every report is a TABLE that also yields, FROM THE SAME QUERY, one or two
    significant COUNTS and at least one SHAPE (bar or pie), plus a FILTER.
    Counts, shape and table are three renderings of the SAME rows, so a number
    in a tile and a row in the table CANNOT disagree.
    A report is therefore a DECLARATION, not a page — see REPORTS below. Adding
    a report is one entry in that list.

  FOUR STAKEHOLDERS (Bora, 28 Aug — the fourth closed a real gap)
    library governance · architects · management · implementers
    The page built 27 Aug was the LIBRARY GOVERNANCE page; the 26 Aug audience
    analysis had missed the person who owns the library.
    Navigation is exactly TWO levels: pick a stakeholder, then a horizontal tab
    menu of that stakeholder's reports. A third level would make this a site.

  EMBEDDED DATA (Bora, 28 Aug)
    "analysis in publisher should not have a step when the user is asked to
     provide the data."
    When generated for the publisher, build_module.py writes the model's three
    tables into the <script id="model-data"> block below and the page opens
    straight into the reports. The CSV loader remains for standalone use and
    appears only when that block is empty. One codebase, two deployment modes.

  LIBRARIES — vendored locally, MIT only, nothing fetched at runtime (D-146)
    sql.js 1.11.0 · Chart.js 4.4.9 · Tabulator 6.3.1 · marked 15.0.7
    MIT is deliberate: copyleft here would permanently remove the option of
    selling or splitting these pages into editions (D-143).

  MUST BE SERVED. Browsers refuse to instantiate WebAssembly from file://.

  STAGE 1 does NOT generate links from tables to the published diagrams
  (Bora's instruction) — they would not resolve standalone. The contract is
  known and recorded: views/<view-id>.html, images/<view-id>.png,
  elements/elem-<element-id>.html, with target="view" (D-149).
-->

<style>
  :root{
    --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b68; --line:#e3e3e0;
    --accent:#2d5f8a; --soft:#eaf1f7; --warn:#8a5a2d; --warnsoft:#fbf3e9;
    --ok:#2f6b45; --oksoft:#eef5f0;
    --mono:"SF Mono",Consolas,Monaco,"Courier New",monospace;
    --c1:#c8dcec; --c2:#8fb8d8; --c3:#5a8fbd; --c4:#31648f; --c5:#1d4665;
    --grid:#ececea;
  }
  /* LIGHT ONLY, deliberately (Bora, 28 Aug). This page is a report: it is read
     alongside a published model, printed, and screenshotted into decks, all of
     which assume a light ground. A dark variant was removed rather than left
     to follow the reader's OS, because a report that changes colour depending
     on whose machine opens it is not a document. The palette is stated once,
     above, and nothing overrides it. */
  :root{ color-scheme: light; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column}
  header,nav.tabs{flex:0 0 auto}
  /* min-height:0 lets a flex child shrink below its content and actually
     scroll; min-width:0 + width:100% stop it sizing to its widest child on
     the cross axis, which pushed main to 1202px in a 1024px viewport. */
  main{flex:1 1 auto;min-height:0;min-width:0;width:100%}

  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 22px;
         display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  header .mark{width:32px;height:32px;border-radius:7px;background:var(--soft);
        border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
        font-size:16px;flex-shrink:0}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
  header .sub{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:1px}
  header .home{font:inherit;font-size:12.5px;padding:5px 12px;border:1px solid var(--line);
        background:var(--panel);border-radius:5px;cursor:pointer;color:var(--ink)}
  header .home:hover{border-color:var(--accent)}
  #status{margin-left:auto;font:12px var(--mono);color:var(--muted);text-align:right}

  nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);padding:0 22px;
           display:flex;gap:2px;overflow-x:auto}
  nav.tabs button{font:inherit;font-size:12.5px;font-weight:500;padding:9px 14px;border:0;
        border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;
        white-space:nowrap;border-radius:0}
  nav.tabs button:hover:not(:disabled){color:var(--ink);background:var(--bg)}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);background:var(--bg)}
  nav.tabs button:disabled{opacity:.35;cursor:not-allowed}

  /* The page owns its scrolling. A publisher frame is declared
     scrolling="no" (Archi's default, found in every report checked), which
     kills the FRAME's scrollbar -- but an element inside the document can
     still scroll. So <main> is the scroll container, and the page works in a
     frame, standalone, and in a frame whose host we never edit. */
  html,body{height:100%;overflow:hidden}
  main{padding:15px 22px 40px;max-width:1500px;margin:0 auto;
       overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .qline{font-size:13px;color:var(--muted);margin:0 0 12px}
  .qline b{color:var(--ink);font-weight:600}

  /* entry — who are you */
  .entry{max-width:920px;margin:34px auto}
  .entry > h2{margin:0 0 5px;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .entry > p{margin:0 0 22px;color:var(--muted);font-size:13.5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}
  .card-s{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:17px 18px;
        cursor:pointer;transition:.12s;text-align:left;font:inherit;color:var(--ink);display:block;
        width:100%}
  .card-s:hover{border-color:var(--accent);background:var(--soft)}
  .card-s h3{margin:0 0 4px;font-size:15px;font-weight:600}
  .card-s .q{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0 0 11px}
  .card-s .avail{font-size:11.5px;font-weight:600;color:var(--ok)}
  .card-s .avail.part{color:var(--warn)}
  .card-s .avail.none{color:var(--muted)}
  .card-s:disabled{opacity:.55;cursor:not-allowed}
  .card-s:disabled:hover{border-color:var(--line);background:var(--panel)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;
        margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:13px 15px}
  .kpi .k{font-size:11.5px;color:var(--muted);font-weight:500}
  .kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.15}
  .kpi .v small{font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}
  .kpi .foot{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi.warn .v{color:var(--warn)}
  .kpi.ok .v{color:var(--ok)}

  .shapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;
          margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px 16px}
  .card h2{margin:0 0 2px;font-size:13.5px;font-weight:600}
  .card .cap{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .cwrap{position:relative;height:230px}

  /* grid-slot portfolio — fixed circles in ordinal cells, label inside the cell.
     Origin: pedro/capabilities/grid_portfolio/CONCEPT_grid_slot_portfolio.md.
     The radius carries NO meaning: area is perceived non-linearly, so fixing it
     buys a legible label on every item at any density. Third variable = colour. */
  .gridbox{background:var(--panel);border:1px solid var(--line);border-radius:7px;
        padding:14px 16px;margin-bottom:14px;overflow:auto}
  .gridbox h2{margin:0 0 2px;font-size:13.5px;font-weight:600}
  .gridbox .cap{font-size:11.5px;color:var(--muted);margin-bottom:11px}
  .gridbox svg{display:block}
  .gridbox svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .cellrect{fill:var(--bg)}
  .cellrect.alt{fill:var(--panel)}
  .cellrect.void{fill:var(--warnsoft)}
  .gline{stroke:var(--line);stroke-width:1}
  .axlab{fill:var(--muted);font-size:11px}
  .axttl{fill:var(--ink);font-size:12px;font-weight:600}
  .gitem circle{stroke:rgba(0,0,0,.2);stroke-width:1}
  .gitem text{fill:var(--ink);font-size:11px;dominant-baseline:middle;cursor:pointer}
  .gitem:hover circle{stroke:var(--ink);stroke-width:2}
  .gitem:hover text{font-weight:700;text-decoration:underline}
  .cellcount{fill:var(--muted);font-size:10px;font-weight:700;opacity:.6}
  .voidnote{fill:var(--warn);font-size:10.5px;font-style:italic}
  .gridlegend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 10px;
        font-size:12px;color:var(--muted)}
  .gridlegend .sw{display:inline-block;width:11px;height:11px;border-radius:50%;
        margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.18)}

  .filters{background:var(--panel);border:1px solid var(--line);border-radius:7px;
           padding:11px 15px;margin-bottom:12px}
  .filters .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .filters h2{margin:0 8px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
              color:var(--muted);font-weight:700}
  .filters input[type=search], .filters select{font:inherit;font-size:12.5px;padding:6px 9px;
        border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
  .filters input[type=search]{min-width:220px;flex:1;max-width:360px}
  .filters .count{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .filters .count b{color:var(--ink)}
  #tbl{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}

  .drop{border:2px dashed var(--line);border-radius:7px;padding:24px 18px;text-align:center;
        color:var(--muted);font-size:13px;cursor:pointer;transition:.12s;background:var(--panel)}
  .drop:hover,.drop.hot{border-color:var(--accent);background:var(--soft);color:var(--ink)}
  button.b{font:inherit;padding:7px 15px;border:1px solid var(--line);background:var(--panel);
           border-radius:5px;cursor:pointer;color:var(--ink);font-size:13px}
  button.b:hover:not(:disabled){border-color:var(--accent)}
  button.b.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
  button.b:disabled{opacity:.4;cursor:not-allowed}
  .slot{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin:0 12px 0 0}
  .slot .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .slot.has .dot{background:var(--ok)}
  .slot .nm{color:var(--muted)}
  .slot.has .nm{color:var(--ink)}
  .msg{padding:10px 13px;border-radius:0 5px 5px 0;margin-bottom:12px;font-size:13px;display:none}
  .msg.i{background:var(--soft);border-left:3px solid var(--accent)}
  .msg.e{background:var(--warnsoft);border-left:3px solid var(--warn);color:var(--warn);
         font:12.5px var(--mono);white-space:pre-wrap}
  .intro{background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:26px;max-width:640px;margin:26px auto}
  .intro h3{margin:0 0 8px;font-size:16px}
  .intro ol{line-height:1.95;padding-left:20px;color:var(--muted)}
  .intro ol b{color:var(--ink)}
  .intro p{color:var(--muted);font-size:12.5px}
  .empty{padding:34px 20px;text-align:center;color:var(--muted)}
  .empty h3{margin:0 0 6px;font-size:15px;color:var(--ink)}
  code{font:12px var(--mono);background:var(--bg);padding:1px 5px;border-radius:3px}
  .note{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.7}
  .note b{color:var(--ink)}
  .sim{background:var(--warnsoft);color:var(--warn);font-size:11px;padding:1px 7px;
       border-radius:9px;border:1px solid var(--line)}

  /* Tabulator — its stylesheet sets color:#333 on the CELL; theming the row
     alone leaves it, which measured 1.31:1 on the dark panel (27 Aug). */
  .tabulator{background:var(--panel);border:0;font-size:12.5px;color:var(--ink)}
  .tabulator .tabulator-header{background:var(--bg);border-bottom:1px solid var(--line);
        color:var(--ink)}
  .tabulator .tabulator-header .tabulator-col{background:var(--bg);
        border-right:1px solid var(--line);color:var(--ink)}
  .tabulator .tabulator-header .tabulator-col-title{font-weight:600;font-size:12px;
        color:var(--ink)}
  .tabulator .tabulator-header .tabulator-col .tabulator-arrow{border-bottom-color:var(--muted)}
  .tabulator-row{background:var(--panel);border-bottom:1px solid var(--line);color:var(--ink)}
  .tabulator-row.tabulator-row-even{background:var(--panel)}
  .tabulator-row:hover{background:var(--soft) !important}
  .tabulator-row .tabulator-cell{border-right:1px solid var(--line);padding:7px 10px;
        color:var(--ink)}
  .tabulator .tabulator-footer{background:var(--bg);border-top:1px solid var(--line);
        color:var(--muted)}
  .tabulator .tabulator-footer .tabulator-page{background:var(--panel);border:1px solid var(--line);
        color:var(--ink);border-radius:4px}
  .tabulator .tabulator-footer .tabulator-page.active{background:var(--accent);color:#fff}
  .tabulator .tabulator-footer .tabulator-page:disabled{opacity:.45}
  .tabulator .tabulator-footer .tabulator-page-size,
  .tabulator .tabulator-footer .tabulator-paginator label{color:var(--muted)}
  .tabulator .tabulator-footer .tabulator-page-size{background:var(--panel);
        border:1px solid var(--line);color:var(--ink);border-radius:4px}
  .tabulator .tabulator-placeholder{background:var(--panel)}
  .tabulator .tabulator-placeholder .tabulator-placeholder-contents{color:var(--muted)}
  .tabulator .tabulator-tableholder{color:var(--ink)}

  .pill{font-size:11px;padding:1px 8px;border-radius:9px;border:1px solid var(--line);
        background:var(--bg);color:var(--muted);white-space:nowrap}
  .pill.hi{background:var(--soft);color:var(--accent);border-color:var(--accent)}
  .pill.lo{background:var(--warnsoft);color:var(--warn);border-color:var(--warn)}
  .pill.ok{background:var(--oksoft);color:var(--ok);border-color:var(--ok)}
  .lnk{color:var(--accent);cursor:pointer;text-decoration:underline;
       text-decoration-color:var(--line);text-underline-offset:2px}
  .lnk:hover{text-decoration-color:var(--accent)}

  dialog#doc{border:1px solid var(--line);border-radius:9px;padding:0;background:var(--panel);
       color:var(--ink);max-width:760px;width:calc(100% - 40px);max-height:82vh;
       box-shadow:0 18px 48px rgba(0,0,0,.24)}
  dialog#doc::backdrop{background:rgba(0,0,0,.42)}
  #doc .head{display:flex;align-items:flex-start;gap:12px;padding:15px 19px;
       border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);
       border-radius:9px 9px 0 0}
  #doc .head h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
  #doc .head .meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;
       gap:6px;flex-wrap:wrap;align-items:center}
  #doc .x{margin-left:auto;font:inherit;font-size:19px;line-height:1;background:none;
       border:0;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;flex-shrink:0}
  #doc .x:hover{background:var(--bg);color:var(--ink)}
  #doc .body{padding:6px 19px 20px;overflow-y:auto;max-height:calc(82vh - 74px)}
  #doc .body h1,#doc .body h2,#doc .body h3,#doc .body h4{
       font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
       font-weight:700;margin:19px 0 5px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  #doc .body p{margin:0 0 11px;line-height:1.62}
  #doc .body ul,#doc .body ol{margin:0 0 11px;padding-left:22px;line-height:1.62}
  #doc .body code{font:12px var(--mono);background:var(--bg);padding:1px 5px;border-radius:3px}
  #doc .body pre{background:var(--bg);padding:11px 13px;border-radius:5px;overflow-x:auto;
       border:1px solid var(--line)}
  #doc .body blockquote{margin:0 0 11px;padding-left:13px;border-left:3px solid var(--line);
       color:var(--muted)}
  #doc .body table{border-collapse:collapse;width:100%;margin-bottom:11px;font-size:12.5px}
  #doc .body th,#doc .body td{border:1px solid var(--line);padding:6px 9px;text-align:left}
  #doc .body th{background:var(--bg);font-weight:600}
  #doc .body a{color:var(--accent)}
  #doc .none{color:var(--muted);font-style:italic;padding:22px 0}
  #doc .views{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
       padding:11px 19px;border-top:1px solid var(--line);background:var(--bg)}
  #doc .views .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
       color:var(--muted);font-weight:700;margin-right:2px}
  #doc .views a{font:inherit;font-size:12.5px;text-decoration:none;color:var(--accent);
       border:1px solid var(--line);border-radius:5px;padding:5px 11px;background:var(--panel)}
  #doc .views a:hover{border-color:var(--accent);background:var(--soft)}
</style>
</head>

<header>
  <div class="mark">▤</div>
  <div>
    <h1 id="h-title">Model analysis</h1>
    <span class="sub" id="h-sub">choose whose questions to answer</span>

  <button class="home" id="home" style="display:none">&larr; Stakeholders</button>

<script type="application/json" id="model-data">{"model":"HIEDRS","generated":"2026-10-19","source":"exporter_base.db","elements":[{"id":"id-e5bf6235-0851-40cc-9e21-86b9fbcaac81","type":"Capability","name":"Account Management","documentation":"**A customer signs a first contract.** Account Management maintains and grows relationships with existing customers—corporate clients, government bodies, and education agencies—at the account layer, not the individual student record. Its outcome is a current Account Record and a signed Renewal Proposal. When accounts are updated after each interaction, renewal deadlines are met and repeat contract revenue continues. When Service Complaints are resolved, contracts are retained.\n\n**It connects contracts to repeat revenue.** The capability depends on accurate Account Records and reconciled Purchase History. From those, it issues Renewal Proposals when a contract enters its notice period and Cross-Sell Recommendations when purchase history shows eligibility for another accredited programme. A Service Complaint receives attention, and unresolved complaints escalate to legal or academic bodies. Incoming data must comply with the Serbian Law on Personal Data Protection and contractual signature authority at the university or faculty.\n\n**A signed Renewal Proposal keeps contract revenue flowing.** The capability issues a **Renewal Proposal** when a contract enters its notice period. The authorised signatory must sign it before it is accepted. That document is the point where an existing relationship becomes future fee income; without it, renewal deadlines pass unnoticed.\n\n### Key processes\n- Manage Account Relationship\n- Prepare Renewal Proposal\n- Resolve Service Complaint\n- Update Account Plan\n- Review Purchase History\n- Negotiate Contract Amendment\n- Escalate Service Issue","specialization":""},{"id":"id-a4637e89-2929-4077-a22a-d756585cb025","type":"Capability","name":"Acknowledge Donors","documentation":"**A completed gift starts with a thank-you.** When a donation or pledge payment lands, the institution has to confirm it and send recognition that matches the donor's wishes. This capability issues personalized donor acknowledgements and keeps a durable record of each one, so a donor is never thanked twice or overlooked.\n\n**It sits between gift records and the next solicitation.** It works from a gift notification and a pledge payment confirmation. It confirms the fund designation against the gift agreement, retrieves the donor contact record and recognition consent, and then composes a personalized letter. If consent for public recognition is absent, the acknowledgement goes out privately. The result includes a donor recognition statement and an acknowledgement history entry, leaving the donor on record as thanked with the date and channel used. This operates under the Serbian Law on Personal Data Protection and GDPR for cross-border donors.\n\n**The donor acknowledgement letter carries the record.** Each letter is traceable to the gift and issued before the next solicitation cycle. When the gift cannot be matched to a donor or fund, it is returned to pledge and gift management for correction rather than sent incomplete.\n\n### Key processes\n- Record Gift Receipt\n- Issue Donor Acknowledgement\n- Update Donor History\n- Manage Anonymous Donations\n- Handle Returned Mail\n- Generate Recognition List","specialization":""},{"id":"id-703c3278-af18-4e57-8bd0-ef52b23dc077","type":"Capability","name":"Administer Student Standard","documentation":"**Student standard applications arrive.** Staff verify student status and, for need-based help, proof of income. Accommodation applications are checked against the current Dormitory Capacity Report from the student centre; meal subsidies are calculated from funding status; scholarship applications are ranked using the Scholarship Rule.\n\n**Eligibility checks protect limited places.** The Student Record must be accurate; inconsistent records suspend allocation until corrected. Incomplete applications are returned for resubmission. When a student contests a negative outcome, the decision is reassessed.\n\n**Accommodation and Meal Subsidy Decision transmitted.** It tells the student centre who is entitled to subsidised accommodation or meals, and is supported by a Student Standard Record sent for implementation. Only enrolled students who meet the criteria receive these services.\n\n### Key processes\n- Assess Student Standard Eligibility\n- Allocate Subsidised Accommodation\n- Approve Meal Subsidy\n- Award Scholarship\n- Appeal Student Standard Decision","specialization":""},{"id":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","type":"Capability","name":"Admit Students","documentation":"**An application arrives with a transcript.** The application includes a programme choice. The admission process verifies that the chosen study programme holds a valid NAT accreditation, authenticates the applicant's Official Academic Transcript, evaluates the application against set criteria, and ranks applicants within the available places. An applicant receives an Admission Offer, a Conditional Acceptance, or a Rejection Notice. A place must be available under the state-set Enrollment Quota. Federated universities have the faculty sign the decision; integrated universities have the university sign.\n\n**Accreditation and prior education gate every decision.** The chosen Study Programme must have a valid Accreditation Decision, and the applicant's prior education must be verifiable. If the programme lacks accreditation or the transcript is not authenticated, no Admission Decision is issued and no initial Student Record is created. Incomplete or unauthenticated transcripts are returned to the applicant, and missing accreditation is a hard stop.\n\n**The Admission Decision Record keeps outcomes traceable.** For each applicant, the decision is logged, and after acceptance an initial Student Record is created with personal data and programme choice. That record is what enrollment and financial aid later build on.\n\n### Key processes\n- Evaluate Application\n- Verify Prior Education\n- Check Accreditation Status\n- Rank Applicants\n- Issue Admission Decision\n- Create Student Record","specialization":""},{"id":"id-d7a1670b-5b1f-4419-a987-19f2b699fecb","type":"Capability","name":"Advise Students and Provide","documentation":"**A student planning next term needs direction.** Advisors translate the accredited study programme into individual course choices, working from the Student Record, the current Study Programme Curriculum, and the latest Academic Standing Record. The advice keeps each student on a valid path to graduation and within the 60 ECTS yearly workload.\n\n**The work depends on complete, current records.** Before any advising starts, the Student Record must be authenticated by the administrative office; an outdated Study Programme Curriculum stops the session until the latest version arrives. Once the advisor reviews the Academic Standing Record, the student gets Course Selection Advice for the next semester. If a deviation from the standard programme is needed, the advisor prepares a Curriculum Exception Petition.\n\n**The Study Plan carries the outcome.** Issued after the advising session, it is updated each term to show completed credits and remaining requirements, and it is the document the student follows until the next review.\n\n### Key processes\n- Assess Academic Standing\n- Develop Study Plan\n- Conduct Advising Session\n- Approve Course Selection\n- Prepare Curriculum Exception Petition\n- Record Advising Outcome","specialization":""},{"id":"id-59c01b9a-4dd2-4265-bb01-11c8157b4d2b","type":"Capability","name":"Approval and Award","documentation":"**A proposal clears internal review.** The next step is deciding whether the sponsor's terms are acceptable and getting the right person to sign. This is where a selected proposal becomes a signed award, or a rejection if the terms conflict with the Law on Higher Education. No signed agreement means no project starts and no invoice goes out.\n\n**It depends on written sponsor terms and a legal review.** The sponsor's award letter must be in writing and match the proposal; a verbal award is not accepted. The output feeds everything downstream: the award record begins the project, and the signed agreement becomes the basis for billing. In the integrated form the rector signs; in the federated form each faculty dean signs.\n\n**The Executed Grant Agreement locks in the conditions.** It must carry both signatures, a start date, a budget ceiling, and an indirect cost rate. Without that document, the institution has no basis to bill the sponsor.\n\n### Key processes\n- Review Sponsor Terms\n- Negotiate Grant Agreement\n- Obtain Institutional Sign-off\n- Execute Grant Agreement\n- Record Award\n- Reject Unacceptable Proposal","specialization":""},{"id":"id-4a109615-89b7-4d83-9527-666fb431ad35","type":"Capability","name":"Assistance","documentation":"**A student reports a need beyond the classroom.** When a report arrives, the institution logs the category, confirms active enrolment, and assesses any medical or financial documentation. The support covers:\n- learning support\n- disability accommodations\n- financial hardship referrals\n- well-being service coordination\n\nThe aim is to remove barriers outside the curriculum so a student can continue studying.\n\n**This work moves between the student and specialist providers.** It starts with a Student Support Request, a validated Disability Documentation, or a signed Financial Aid Application, and it uses the Student Record only to verify enrolment. Because disability and health information are protected under the Serbian Law on Personal Data Protection, such details are shared only on a lawful basis and through the Data Protection Officer when required.\n\n**The Accommodation Letter makes the adjustment official.** Issued after the disability documentation is validated and the required adjustments are determined, it tells teaching staff exactly what the student is entitled to and puts the institution's legal obligation into practice.\n\n### Key processes\n- Triage Support Request\n- Verify Student Status\n- Assess Accommodation Need\n- Issue Accommodation Letter\n- Refer to Specialist Service\n- Document Assistance Outcome","specialization":""},{"id":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","type":"Capability","name":"Award and Monitor Financial Aid","documentation":"**A student applies for financial aid.** The application arrives with a certified Family Income Statement. The aid process verifies the certified Family Income Statement against a live Student Record, determines whether a state-funded place is available, calculates an aid package from scholarships and subsidies, and disburses scholarships. If the student is assigned a budget place, the process issues a State-Funded Place Confirmation. Financial Aid Awards specify the amount and source.\n\n**The number of budget places is fixed upstream.** The ministry sets state-funded places through the Enrollment Quota, so awarding does not exceed those places. Each aid decision also depends on an Enrollment Confirmation that matches the aid period; a mismatch pauses disbursement until reconciled. When a student loses a state-funded place or fails satisfactory academic progress, no aid is lawfully paid and the student moves to self-financing billing.\n\n**The Satisfactory Academic Progress Record keeps review honest.** This semester-specific record is checked after each examination period. If it is not accurate, aid status is re-evaluated before the next payment; if progress fails, Financial Aid Revocation follows. Without that record, scholarships and subsidies are not lawfully paid.\n\n### Key processes\n- Evaluate Financial Aid Application\n- Determine State-Funded Place\n- Calculate Aid Package\n- Disburse Scholarship\n- Monitor Academic Progress\n- Revoke Aid Award","specialization":""},{"id":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","type":"Capability","name":"Bill Customer or Payor","documentation":"**Enrollment confirmation triggers the bill.** For each enrolled student, the billing process determines funding status, calculates tuition charges from the Tuition Fee Schedule, applies any Scholarship Award offset, and issues a Tuition Invoice. Payments are received, allocated to the student's account, and refunds or overdue notices follow when needed. State-funded students are billed only for fees not covered by the state; self-financing students are billed the full programme tuition.\n\n**A bill needs a valid enrollment.** The Enrollment Confirmation must be complete and valid for the billing term, and it must be consistent with the Student Record. If it is missing or mismatched, no Tuition Invoice is produced and payments are not allocated. An expired enrollment is returned to enrollment processing before any charge is calculated.\n\n**The Payment Receipt guards against misallocation.** It carries the student's identification and the amount paid. A payment that is not matched to a student is held in suspense, not allocated, until it is identified.\n\n### Key processes\n- Calculate Tuition Charges\n- Issue Student Invoice\n- Process Tuition Payment\n- Allocate Payment to Charges\n- Issue Refund\n- Send Payment Reminder","specialization":""},{"id":"id-1db93bd4-1dfe-459a-8324-c55dee07ec4f","type":"Capability","name":"Bill Sponsor","documentation":"**An approved expenditure report lands.** It becomes a sponsor invoice only after the costs are checked and the cost share is documented. This capability turns approved grant spending and completed milestones into cash and tracks every payment. If an invoice is rejected because costs are unallowable, the project account runs dry and staff and suppliers go unpaid from grant funds.\n\n**Every invoice follows the grant agreement's budget categories.** It pulls from approved expenditure reports, milestone certificates and cost share certifications, and it produces sponsor invoices, payment requests and cash receipts. Serbian public finance control requires every grant fund to be traced to specific invoices, so the linkage back to budget lines is not optional.\n\n**The Sponsor Invoice carries three identifying marks.**\n\n- A unique invoice number\n- The sponsor reference\n- The budget line\n\nThese three marks let the sponsor and the university finance office trace the payment.\n\n### Key processes\n- Verify Expenditure Allowability\n- Prepare Sponsor Invoice\n- Submit Payment Request\n- Reconcile Payment\n- Handle Sponsor Rejection\n- Issue Credit Note","specialization":""},{"id":"id-6d5adb53-67bb-47a3-86a7-6157091b49aa","type":"Capability","name":"Customer Portfolio Management","documentation":"**A new account is created.** Customer Portfolio Management analyses, segments, and prioritises the institution's customer accounts. It uses account and transaction data to focus sales effort on the most valuable relationships and reduce revenue risk. The outcome is a current Customer Portfolio Analysis that directs allocation of sales resources. When this works, high-value accounts receive sufficient attention and low-value accounts do not consume effort.\n\n**It depends on consistent classification and reconciled history.** Sales History must be complete for the most recent three fiscal periods and reconciled with Tuition Payment Records. An Account Record must have a valid customer type. Incoming Credit Records must come from an authorised credit bureau. From that data, the capability produces a quarterly Customer Portfolio Analysis, an Account Prioritisation List, a Risk Assessment for each high-value account, and a Cross-Sell Target List for account managers. Serbian higher education institutions do not pool all customers into one undifferentiated portfolio; the segment definition distinguishes state-funded and self-financing places.\n\n**A planning cycle produces a ranked list.** The **Account Prioritisation List** ranks accounts each planning cycle. It directs sales effort to the most valuable relationships and away from low-value accounts, protecting revenue by making sure high-value accounts are not overlooked.\n\n### Key processes\n- Analyse Customer Profitability\n- Segment Accounts\n- Model Churn Risk\n- Prioritise Accounts\n- Update Portfolio Analysis\n- Set Cross-Sell Targets\n- Adjust Credit Limits","specialization":""},{"id":"id-b08a3dbb-d42a-4bcc-b7c2-eab26c498651","type":"Capability","name":"Define Marketing Strategy","documentation":"**A fresh enrolment quota lands.** The marketing team turns that quota, the institutional strategic plan, and market intelligence into one coherent approach for study programmes. It sets enrolment targets by programme and funding type, allocates the marketing budget across media channels, selects the channel mix for each target segment, and approves the brand message for the cycle. When this works, every downstream campaign has a clear direction tied to places that actually exist.\n\n**The strategy connects planning to campaigns.** It pulls the previous Campaign Performance Report back into the cycle so lessons from the last campaign shape the next one. It is approved only after an internal review against NAT accreditation status and the Law on Higher Education advertising rules. The strategy is re-baselined against every annual Enrolment Quota Decision and any change in NAT accreditation, because state-funded places are fixed and programmes without accreditation cannot be promoted.\n\n**Decisions become one document.** The **Marketing Strategy Document** brings together the agreed enrolment targets, channel mix and budget allocation. It is issued only after the internal review, so campaign teams start from an approved base.\n\n### Key processes\n- Assess Programme Demand\n- Set Enrolment Targets\n- Allocate Marketing Budget\n- Define Target Segments\n- Select Marketing Channels\n- Approve Brand Message\n- Review Previous Campaign Performance\n- Adjust Strategy for Accreditation Changes","specialization":""},{"id":"id-ebfc2ab0-2c6f-42e4-b1d7-a387d571b009","type":"Capability","name":"Diagnose/Resolve Issues","documentation":"**A reported malfunction triggers a diagnosis.** When an Issue Report arrives from a student, faculty member, or administrative staff member, the cause is identified and a remedy applied to restore the affected service or process. The work lives in the operational layer of the institution and runs on the principle that a blocked task gets unblocked, not just logged. If the report lacks enough detail, it goes back for clarification before work proceeds.\n\n**Diagnosis draws on more than the report.** It correlates symptoms with Diagnostic Logs from IT systems, Maintenance Records from facilities, and Student Records when enrollment or grades are involved. A resolution is verified against the original symptoms and then closed with a Closure Notification. Where first-level support cannot resolve the issue, an Escalation Ticket goes to a specialist. Because the work touches personal data, it follows the Serbian Law on Personal Data Protection, limiting who sees details and what the record exposes.\n\n**A Resolution Record fixes accountability.** Each closed issue produces a Resolution Record that captures the root cause, the actions taken, and the time to resolution. It is traceable to the original Issue Report and auditable by the institutional data protection officer. When an external body such as the National Accreditation Body requires evidence that a student complaint was resolved, the record is available within the time set by the institution's complaint procedure.\n\n### Key processes\n- Log Issue Report\n- Triage Issue\n- Diagnose Root Cause\n- Resolve Issue\n- Escalate Problem\n- Document Resolution\n- Close Issue","specialization":""},{"id":"id-8b80a6ea-0dfa-4673-9eab-027449e3bf84","type":"Capability","name":"Effectiveness","documentation":"**After each course and exam period ends.** The institution collects anonymous course evaluations, grade distributions, and graduate employment survey responses, then compares them against ESG 2015 and its own benchmarks. This produces the evidence base that internal quality assurance and external accreditation require. Without it, the institution cannot justify continuing a programme.\n\n**It turns raw feedback into a formal review cycle.** Course Evaluation Survey Responses arrive in the final two weeks of a course; Grade Distribution Reports must come from the official Student Record and include all enrolled students; Graduate Employment Survey responses require a consent form. These inputs feed the report and, when results fall below thresholds, a Quality Improvement Plan.\n\n**The Academic Program Effectiveness Report is the standing output.** Issued annually and whenever a programme undergoes external review, it carries the findings and recommendations that the National Accreditation Body reads when deciding on renewal.\n\n### Key processes\n- Administer Course Evaluation\n- Analyse Grade Distribution\n- Conduct Graduate Survey\n- Assess Learning Outcomes\n- Compile Effectiveness Report\n- Propose Quality Improvement","specialization":""},{"id":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","type":"Capability","name":"Enroll in Classes","documentation":"**A student submits a course selection.** The enrollment process validates prerequisites, checks seat availability, applies the ECTS credit load, registers the student in the chosen classes, and confirms enrollment. When a course is full, the student is placed on a waitlist. Drop/add changes are processed, and incoming mobility students have their enrollment recorded against their Erasmus Learning Agreement.\n\n**Enrollment must respect workload and prerequisites.** The design allows 60 ECTS per academic year. A missing or outdated Prerequisite Check Result blocks registration for that course until it is re-advised. An incomplete course selection is returned. If a course lacks seats or prerequisites are unmet, the student is not registered and no Enrollment Confirmation is produced, which holds up billing and financial aid adjustments.\n\n**The Enrollment Confirmation signals downstream work.** It is issued after registration and confirms that the student is in the class. Downstream billing and financial aid adjustments use it as the signal to proceed.\n\n### Key processes\n- Validate Course Selection\n- Check Seat Availability\n- Register Student in Class\n- Process Waitlist\n- Record Course Change\n- Confirm Enrollment","specialization":""},{"id":"id-d8e4c197-826c-4d16-8f57-a29cd7b40c14","type":"Capability","name":"Evaluate Academic Program","documentation":"**Before a programme is re-accredited or revised.** The institution checks the programme documentation, maps the curriculum against the accreditation standards, and verifies each instructor's CV. This evaluation produces the formal report that supports accreditation, re-accreditation, and programme revision decisions.\n\n**It depends on authoritative versions.** Study Programme Documentation must be the current accredited version with all amendments recorded; Accreditation Standards must be the latest published NAT and ESG texts; Teaching Staff CVs must be dated and signed. The evaluation follows only those published criteria, with no political, financial, or internal preference substituting for them.\n\n**The Program Evaluation Report closes the review.** Issued after the internal review is completed, it records strengths and weaknesses, and it is the document that tells the institution whether the programme can go forward to accreditation renewal or needs revision.\n\n### Key processes\n- Review Programme Documentation\n- Map Curriculum to Standards\n- Assess Staff Qualifications\n- Conduct Self-Evaluation\n- Issue Program Evaluation Report\n- Recommend Program Revision","specialization":""},{"id":"id-8fcac125-67c1-46c5-b3a6-0cb03f136833","type":"Capability","name":"Evaluate Student Performance","documentation":"**After each exam and assignment period.** Marked scripts and assignments become official grades. The institution computes the course grade from all assessment components, records it in the Student Record, and handles any grade change request against the original evidence. This is the authoritative source for grades and ECTS credits, so progression and graduation rest on it.\n\n**It guards the trail from assessment to achievement.** Examination Scripts must be anonymised before marking; Assignment Submissions carry a timestamp; a Grade Change Request must be signed by both the examiner and the program director. These checks protect the integrity of the Grade Report and the financial aid decisions that read it.\n\n**The Transcript of Records makes achievement portable.** Issued on student request and at graduation, it is digitally signed and dated, and it is the document that carries the final record of grades and ECTS credits to employers and other institutions.\n\n### Key processes\n- Mark Examination Script\n- Grade Assignment\n- Compute Course Grade\n- Record Grade\n- Handle Grade Appeal\n- Issue Transcript","specialization":""},{"id":"id-6abc9eb9-f507-4dcf-8200-f9e870ec19a3","type":"Capability","name":"Execute Fundraising Initiatives","documentation":"**A fundraising campaign begins when the plan is approved.** The capability plans and runs campaigns and events that turn prospect interest into signed commitments. It distributes approved communication collateral, hosts fundraising events, and records donor attendance. Responses are tracked in a solicitation outcome log, with follow-up on pledged gift agreements to secure signatures.\n\n**It depends on prepared prospect lists and lawful outreach.** A campaign plan sets measurable goals, budget, timeline, and approved message before launch. Prospect lists carry consent flags aligned with the Serbian Law on Personal Data Protection; prospects without a lawful basis are excluded from the distribution. Campaign materials that lack approved budget or consent flags are rejected. The work sits inside the integrated or federated university structure, so event authority and gift agreement signing happen at the legal entity holding fundraising capacity.\n\n**The pledged gift agreement turns interest into commitment.** It records the donor's promise to give and is followed up until signed. Only a complete agreement signed by the proper legal entity moves on to pledge management. That keeps campaign revenue from stalling on unsigned paper.\n\n### Key processes\n- Launch Annual Giving Campaign\n- Host Fundraising Event\n- Distribute Solicitation Appeal\n- Track Campaign Responses\n- Follow Up on Pledged Gift Agreements\n- Close Campaign and Report","specialization":""},{"id":"id-c442ac23-7d84-40ae-83f0-05cbdd824769","type":"Capability","name":"Execute Programs","documentation":"**Campaigns go live on schedule.** When a campaign plan reaches its start date or a scheduled event is due, the team turns approved campaign plans into actual promotional activity. It produces content, runs paid advertising, organises open day and information events, distributes programme brochures and digital assets, and captures the interest of prospective students. Every activity is tracked against the Approved Budget, and evidence is logged as it happens.\n\n**Consent and accreditation gate every step.** The work consumes the Approved Campaign Brief, Promotional Material, Approved Budget, Prospect Contact List, Event Schedule, Media Placement Contract, and Brand Asset. A Campaign Brief that lists a programme without a valid NAT accreditation is rejected. A Prospect Contact List entry without documented consent for marketing contact is removed before execution. This protects the institution by keeping personal data processing in line with the Serbian Law on Personal Data Protection and, for cross-border campaigns or joint programmes, the EU GDPR.\n\n**Lead Record logs real interest.** Each prospective student inquiry becomes a Lead Record, issued only after the activity has occurred and evidence is logged. If no Prospect Contact List is available due to a data protection block, or the Approved Budget is exhausted before the main recruitment period, no materials are distributed and no Lead Records are generated. The Lead Record is the result that shows a campaign turned a contact into a potential applicant.\n\n### Key processes\n- Execute Advertising Campaign\n- Organise Open Day Event\n- Publish Social Media Content\n- Distribute Programme Brochures\n- Capture Prospective Student Leads\n- Track Campaign Expenses\n- Coordinate Media Placements\n- Report Event Outcomes","specialization":""},{"id":"id-7867ed7a-a6c0-499b-a13e-41619962e307","type":"Capability","name":"Issue Diplomas and Diploma Supplements","documentation":"**Final-year records undergo completion checks.** Staff verify that all required ECTS credits appear in the Transcript of Records and, for master's and doctoral programmes, that the Thesis Defense Record is signed. Once academic staff confirm the study programme requirements are met, the Diploma is issued with the cycle and programme name, and a Diploma Supplement is produced for every graduate.\n\n**The diploma depends on accredited data.** The Transcript of Records must be complete and traceable to accredited courses; incomplete transcripts are returned for correction. When discrepancies exist in the Student Record, issuance is suspended until they are resolved. Each graduate is then recorded in the Graduation Register Entry within the Student Record.\n\n**Diploma Supplement follows European template.** It carries the Bologna cycle and all ECTS credits, so the graduate has what is needed for further study or professional recognition. A diploma is valid only if the study programme held accreditation at the time of awarding.\n\n### Key processes\n- Confirm Graduation Eligibility\n- Issue Diploma\n- Issue Diploma Supplement\n- Record Graduation\n- Handle Duplicate Diploma","specialization":""},{"id":"id-a609d67d-c8e5-42b1-86fb-23647dc01b52","type":"Capability","name":"Lead and Opportunity Management","documentation":"**A web form or phone call brings an inquiry.** Lead and Opportunity Management converts that inquiry into a qualified opportunity and tracks it until it is won or lost. It operates before any contract exists. The outcome is a pipeline of Opportunity Records ready to hand to account managers or salespeople. When this works, new Enrollment Contracts and Sales Agreements have a steady source of qualified prospects.\n\n**It depends on valid contact and consent.** A Prospect Inquiry must contain a valid contact mechanism. A Referral must indicate the referral source and consent to contact. An Opportunity Record must trace back to a prior Lead Record. For leads involving foreign qualifications or cross-border mobility, recognition procedures and GDPR-compliant consent are handled before any sales contact. The capability produces Qualified Leads, Opportunity Records, Proposal Requests, and Won/Lost Decisions as the pipeline moves forward.\n\n**A qualified opportunity moves to a proposal.** When an opportunity reaches the proposal stage, the capability issues a **Proposal Request**. That document is the handoff from sales qualification to the next step of assembling an offer. Without it, the pipeline does not advance to a signed Enrollment Contract or Sales Agreement.\n\n### Key processes\n- Qualify Prospect Inquiry\n- Score Lead\n- Assign Salesperson\n- Convert Lead to Opportunity\n- Update Opportunity Stage\n- Close Opportunity\n- Merge Duplicate Lead\n- Reopen Opportunity","specialization":""},{"id":"id-d6e5d220-7427-459d-b8f4-8fae0c27c848","type":"Capability","name":"Maintain Campus Community Directory","documentation":"**A member changes a phone number.** The directory process verifies consent status, publishes contact details, updates entries, restricts access when needed, and processes opt-out requests. Every published entry is personal data, and processing requires a lawful basis and opt-in consent under the Serbian Law on Personal Data Protection and GDPR.\n\n**Student and Staff Records supply details.** Those records provide contact details only when a valid consent flag exists. An outdated consent status blocks publication. A Directory Update Request must be authenticated; an unauthenticated update is rejected to prevent impersonation. If the underlying record is inaccurate, stale contact details are removed and the directory does not publish or update that entry.\n\n**A Campus Directory Entry needs consent.** It is published only after consent is recorded. When a member withdraws consent, an Opt-Out Confirmation is issued and access to the entry is restricted. An Access Restriction Log records that restriction.\n\n### Key processes\n- Collect Directory Consent\n- Publish Contact Details\n- Update Directory Entry\n- Restrict Directory Access\n- Process Opt-Out Request","specialization":""},{"id":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","type":"Capability","name":"Maintain Student Records","documentation":"**A signed admission decision opens a record.** When a final, signed admission decision arrives, the institution creates a master Student Record and keeps it current through each personal data change, enrollment status, and course grade that follows. That record is the authority behind every official transcript and status confirmation, so its accuracy matters before anything else moves.\n\n**Grades and clearance flow into the record.** Course grades arrive after assessment and must carry the course code and ECTS value. Graduation clearance arrives only after degree requirements are verified. Three checks govern what enters the record:\n- Admission Decision must be final and signed.\n- Personal Data Change Request must carry proof of identity.\n- Course Grade must include the course code and ECTS value.\nA grade missing its ECTS value stops a transcript from being issued until the grade is corrected.\n\n**A request for mobility issues the transcript.** The **Transcript of Records** is issued on request or for mobility from the master record. When a Course Grade fails to match an existing Student Record, the transcript is not produced until the match is made.\n\n### Key processes\n- Create Student Record\n- Update Personal Data\n- Record Academic Progress\n- Issue Transcript of Records\n- Archive Student Record\n- Process Data Subject Request","specialization":""},{"id":"id-a6bbc833-d30e-460f-9df3-0ebe783e8f43","type":"Capability","name":"Manage Accreditation and Quality Assurance","documentation":"**Accreditation must stay current.** The institution and each study programme hold accreditation with the National Accreditation Body (NAT). This work prepares and submits accreditation applications, files an Annual Self-Evaluation Report, and monitors accreditation expiry. When external evaluation findings identify non-conformities, a Corrective Action Plan is drafted and corrective actions are reassessed. Keeping accreditation valid is a legal precondition for enrolment and recognised degree issuance.\n\n**It draws on official NAT requirements.** Accreditation Requirements must be the official NAT text; outdated versions are not used. Self-evaluation inputs come from course evaluation summaries, grade distribution reports, and staff development records. These feed Institution and Study Programme Accreditation Applications, the Annual Self-Evaluation Report, and renewal applications before each certificate expires. Self-evaluation aligns with ESG 2015 Part 1 and external findings with Part 2.\n\n**The Annual Self-Evaluation Report is filed.** It is submitted internally and to NAT, assembled from course evaluation summaries, grade distribution reports, and staff development records. That report is how the institution shows it still meets the standards.\n\n### Key processes\n- Assemble Accreditation Application\n- Conduct Self-Evaluation\n- Respond to External Evaluation\n- Monitor Accreditation Expiry\n- Implement Corrective Actions\n- Maintain Internal QA Records","specialization":""},{"id":"id-96bbedb3-ee3c-46fc-8623-e16a8fa4e7d2","type":"Capability","name":"Manage Contributors","documentation":"**A gift, registration, or consent update arrives.** A donor gives, someone registers for an event, or a contact changes how they want to be reached. That is the moment contributor records need attention. The work here keeps donor, prospect, and alumni data accurate and tied to the correct legal entity, with consent and lawful basis recorded for each contact channel. Outreach later depends on that foundation.\n\n**Records feed outreach and solicitation.** Incoming prospect data, giving history, event attendance, and consent choices all need to resolve into one accurate profile before outreach. This work resolves those records into one profile and hands solicitation current contributor profiles and segmentation lists. The database stays queryable, and every profile carries a data protection classification before it is released.\n\n**Donor retention score reflects recent giving.** Giving history is analyzed to update that score, so segmentation follows current engagement rather than an old record. Outdated consent or a wrong legal entity blocks or misdirects outreach and risks non-compliance with the Serbian Law on Personal Data Protection; this updating protects against that.\n\n### Key processes\n- Capture Prospect Data\n- Validate Contributor Identity\n- Merge Duplicate Records\n- Record Consent Preferences\n- Update Donor Retention Score\n- Maintain Segmentation List","specialization":""},{"id":"id-f7b60e7c-3f68-40f5-9f7d-335d13dd7c1c","type":"Capability","name":"Manage Data Protection","documentation":"**A data request or breach sets the work in motion.** Students, staff, and research participants exercise rights over their personal data. Manage Data Protection logs the request, checks the lawful basis, and answers within statutory deadlines. A designated data protection officer oversees the work. The point is to keep processing lawful and to be able to show it is lawful.\n\n**It is the control point before data moves or changes.** Every processing operation is registered in the Record of Processing Activities. External processors are covered by Controller-Processor Agreements before data leaves the institution. Cross-border transfers require an adequacy decision or standard contractual clauses. When this works, the institution demonstrates lawful processing and the Commissioner for Information of Public Importance and Personal Data Protection receives notifications only when legally required.\n\n**High-risk processing is assessed first.** A **Data Protection Impact Assessment** documents the risk and the safeguard before the processing goes ahead. It is the one artefact that turns a legal obligation into a documented decision.\n\n### Key processes\n- Maintain Records of Processing\n- Handle Data Subject Request\n- Notify Data Breach\n- Conduct DPIA\n- Authorise Cross-Border Transfer","specialization":""},{"id":"id-a398a43a-7375-47d1-af1b-49bf78188b6c","type":"Capability","name":"Manage Endowments","documentation":"**An endowed gift comes with binding instructions.** When a donor establishes an endowment, the principal must be preserved and the income used only as the donor allows. This capability records the charter and principal, monitors investment performance, and calculates what can be distributed under the spending policy and underwater rules.\n\n**It depends on clear charters and accurate investment data.** An endowment charter states donor restrictions, spending rule, and legal owner (university or faculty); if any element is missing, the charter returns to gift processing before a fund is established. Investment performance statements must reconcile to the custodian before income is calculated. Donor restrictions are legally binding on the correct legal entity in the integrated or federated structure, so each fund is held and reported under that entity.\n\n**The endowment fund annual report carries compliance.** It is issued at period close to donors and internal stakeholders, showing the balance sheet and documenting that distributions respected donor intent. That report is traceable to the charter for external audit.\n\n### Key processes\n- Establish Endowment Fund\n- Record Endowment Principal\n- Monitor Investment Performance\n- Calculate Distributable Income\n- Review Donor Restrictions\n- Issue Endowment Annual Report","specialization":""},{"id":"id-1bdefe7d-266e-4b95-8f83-c2539d0148ab","type":"Capability","name":"Manage Erasmus+ Mobility","documentation":"**Annual mobility applications arrive.** Staff evaluate them against quotas, issue a Mobility Selection Decision, and coordinate the Learning Agreement sign-off by the student, sending institution, and host institution. After the stay, the host transcript is compared against the learning agreement so credits earned abroad are recognised in ECTS and recorded in the student record.\n\n**Mobility depends on two signed documents.** Every mobility requires a valid Inter-Institutional Agreement and a Learning Agreement. Credits earned abroad are recognised only if they match the agreed study plan; without a modified learning agreement, students lose credit. In federated universities, signatory authority for agreements rests with the faculty while integrated universities sign centrally.\n\n**The Learning Agreement anchors the recognition.** It must be complete with ECTS credits and signed by all three parties. An official Host Institution Transcript of Records is required, and an unofficial transcript triggers a request for the official copy.\n\n### Key processes\n- Conclude Inter-Institutional Agreement\n- Select Mobility Participants\n- Approve Learning Agreement\n- Recognise ECTS Credits Abroad\n- Report Mobility Outcomes","specialization":""},{"id":"id-b334c94a-a2ff-449e-869e-70a0960b4aca","type":"Capability","name":"Manage Financial Relationships","documentation":"**Tuition starts with a payor.** A state-funded student's primary financial relationship is with the state through the Enrollment Quota; a self-financing student must provide a payor or self-pay authorization before billing or collection begins. Without that authorization, the account stays unpaid.\n\n**Sponsor agreements and invoices meet in one record.** The Financial Relationship Record links a payor to a student. A signed Sponsor Agreement identifies the student before any third-party payment is accepted, and a Tuition Invoice is associated with that payor. No payment settles until it is matched to the invoice it pays.\n\n**A payment record ties money to an invoice.** The **Payment Allocation Record** traces each payment to the specific Tuition Invoice it settles. A payment without a match is held until the relationship is confirmed, so a student account does not show a false balance.\n\n### Key processes\n- Set Up Payor Relationship\n- Record Payment Obligation\n- Apply Payment\n- Reconcile Student Account\n- Report Outstanding Balance","specialization":""},{"id":"id-54df2c7e-67f4-4959-8243-c1c192a5cf63","type":"Capability","name":"Manage Pledges and Gifts","documentation":"**A signed pledge starts a payment schedule.** When a donor commits, the institution records the pledge amount, schedule, and fund designation, then keeps track until every payment arrives. This capability schedules pledge payments, sends reminders, reconciles bank confirmations, and issues a receipt once the gift is verified.\n\n**It ties every payment to the right fund and legal entity.** Each pledge commitment form must be signed by an authorized officer and include donor identity, amount, schedule, fund designation, and legal entity. Incomplete forms are returned for correction. Bank confirmations are matched to open pledge items within the reporting period; unreconciled items are escalated before revenue is recognized. The work follows the institution's accounting standards and records each pledge under the university or faculty entity entitled to receive it.\n\n**The pledge receivable record keeps the aging clear.** It shows outstanding pledges with their payment status and flags overdue items. That record supports write-off recommendations and the annual giving report, so collected gifts stay reconciled and donors receive proof of giving.\n\n### Key processes\n- Record Pledge Commitment\n- Schedule Pledge Payments\n- Reconcile Gift Receipts\n- Send Payment Reminders\n- Issue Gift Receipts\n- Age Pledge Receivables","specialization":""},{"id":"id-fea4c7b7-058d-4326-a804-3451a3d9276e","type":"Capability","name":"Manage Project","documentation":"**A signed grant agreement starts the work.** The project gets a plan, a budget line by line, and named owners for each work package, then the team tracks milestones, manages change, and reviews deliverables. When a budget line deviates, a reallocation request goes to the sponsor instead of letting the project drift. The sponsor withholds payment if work moves away from the approved plan without an approved change request.\n\n**The academic calendar shapes every schedule.** The project depends on a signed agreement with a clear statement of work, a budget approved at grant line level, and work packages with responsible owners. It feeds progress reports, deliverables, change requests and the final report into the rest of the institution. Teaching duties and the academic year set the staffing boundary, not the sponsor's deadlines alone.\n\n**The progress report carries three obligations.** The **Project Progress Report** must state truthful progress, explain variances, and lay out the next period. If it hides a variance, the sponsor suspends payments.\n\n### Key processes\n- Assign Project Roles\n- Track Milestones\n- Monitor Budget Variances\n- Submit Progress Report\n- Manage Project Change\n- Review Deliverable\n- Close Project","specialization":""},{"id":"id-58101092-095e-42fc-a263-ddc537d93a84","type":"Capability","name":"Manage State Funding and Enrollment Quotas","documentation":"**The ministry publishes state-funded quotas.** Staff distribute that Enrollment Quota across accredited study programmes, rank applicants on admission criteria, and assign each admitted student either state-funded or self-financing status. The funding claimed from the ministry is calculated from the enrolled state-funded students and submitted in a Funding Claim Report.\n\n**Accurate records protect both.** Student Records must be accurate and traceable to admission data; discrepancies are returned for correction before funding claims are calculated. An unofficial quota figure is rejected and the official ministry text is requested. State-funded places are fixed by the ministry-set quota, so reports must match enrolled numbers.\n\n**Funding Claim Report reaches ministry.** It carries the enrolled state-funded student numbers and is submitted only after the Budget Allocation Notification confirms funding. When the notification is missing, the report is not sent, which prevents a claim on an unconfirmed budget place.\n\n### Key processes\n- Allocate Enrollment Quotas\n- Assign Student Funding Status\n- Claim State Funding\n- Report Enrollment Numbers\n- Reconcile Quotas","specialization":""},{"id":"id-99e8ec1c-bd58-4c5a-b20b-ac6b885c1253","type":"Capability","name":"Market Research and Analysis","documentation":"**Research begins with a commissioned study.** When a research project is commissioned or new enrolment data is released, the team collects survey responses, analyses enrolment trends by programme and funding type, benchmarks competitor programmes on ECTS structure and accreditation, and forecasts demand for each accredited study programme. The work gathers and interprets data about prospective students, labour market demand, and competitor programmes to inform marketing decisions.\n\n**Consent is a hard precondition.** Every survey response and focus group transcript must come from participants who gave explicit consent. Incomplete or non-consented responses are discarded before analysis; a focus group transcript without a signed consent form is quarantined and not included. This keeps personal data processing in line with the Serbian Law on Personal Data Protection and the EU GDPR for cross-border data flows, under the oversight of a data protection officer.\n\n**Market Research Report carries the evidence.** The cleaned, validated, and analysed data produces the Market Research Report, along with Demand Forecast and Customer Segment Profile. The report is issued only after the raw data has been cleaned, validated, and analysed. It is the piece that later strategy uses to set enrolment targets and allocate marketing budget. If no consent is obtained from survey respondents, the collected data is unusable and no Market Research Report is issued, leaving strategy without evidence.\n\n### Key processes\n- Conduct Prospective Student Survey\n- Analyse Enrolment Trends\n- Benchmark Competitor Programmes\n- Forecast Applicant Demand\n- Evaluate Brand Perception\n- Segment Prospective Students\n- Produce Market Research Report\n- Run Focus Group","specialization":""},{"id":"id-4d75a20e-4723-4e0a-b0f8-c439ccd4037f","type":"Capability","name":"Measure Program Effectiveness","documentation":"**A campaign ends.** The team tracks each lead from first contact through application to enrolment, calculates return on marketing investment, and compares actual performance against the enrolment targets. It separates state-funded from self-financing students because those groups carry different revenue implications. The result tells budget holders which channels earned their money before the next cycle's decisions are made.\n\n**Analysis depends on linked data.** It receives campaign data with identifiers, lead records with source campaign and consent flag, and enrolment conversion data with marketing source codes. It feeds the budget office, which accepts the Campaign Performance Report only when every cost line is allocated. Late conversion data delays the report but does not stop it; the report is issued and marked as late.\n\n**The report lands with the budget office.** The **Campaign Performance Report** records the ROI calculation, conversion funnel analysis, and optimisation recommendation. If a cost line is missing, the budget office returns it; only a complete report moves forward.\n\n### Key processes\n- Track Campaign Conversion\n- Calculate Marketing ROI\n- Attribute Enrolments to Campaign\n- Compare Performance to Targets\n- Analyse Conversion Funnel\n- Produce Campaign Performance Report\n- Recommend Campaign Optimisation\n- Review Cost per Enrolment","specialization":""},{"id":"id-23e7115f-0500-4038-95a8-21e2597ef3b0","type":"Capability","name":"Monitor Compliance","documentation":"**An expense record arrives for checking.** Compliance work verifies that grant spending, activities and reporting meet the grant agreement, sponsor rules, and Serbian and EU regulations. It exists to catch problems before a sponsor audit does. When it works, the institution keeps its standing with funders and the ministry.\n\n**It works across several rulebooks at once.** The same activity is subject to sponsor terms, the Law on Higher Education, the Law on Personal Data Protection, and for EU-funded projects the General Data Protection Regulation. This capability takes expense records, activity reports and checklists, and it produces compliance reports, audit responses and corrective action plans.\n\n**The Compliance Report has one deadline.** It must be complete and filed by the sponsor deadline. A late report is itself a noncompliance.\n\n### Key processes\n- Check Expense Allowability\n- Verify Ethics Approval\n- Track Reporting Deadlines\n- Prepare Compliance Report\n- Respond to Audit Findings\n- Escalate Noncompliance","specialization":""},{"id":"id-8ef1a7e0-4d0f-4e57-bcf7-50501651842d","type":"Capability","name":"Multi-Channel Sales","documentation":"**A customer order arrives from a corporate client or a self-financing student.** Multi-Channel Sales sells accredited programmes and services through direct sales, online portals, education agents, and government procurement platforms. It maintains one consistent offer across those channels. The outcome is a validated Sales Order Record. Each order is fulfilled without conflict. When this works, students do not receive conflicting confirmations and the institution honours each placement.\n\n**It depends on the current catalogue and price list.** The Approved Programme Catalogue must be current with accreditation status for each programme and cycle. The Price List must match the approved tuition fee schedule. A Channel Partner Agreement must state commission terms. Every channel sells only currently accredited programmes within the ministry-fixed enrolment quota. The capability issues Sales Order Records, Booking Confirmations, Channel Commissions, or Order Rejections according to order validation.\n\n**A reserved seat gets confirmed.** When a Customer Order passes validation and a seat or training session is available, the capability issues a **Booking Confirmation**. That document confirms a student's place in a specific cohort, protecting against overselling. It is the point where a valid order becomes a confirmed placement.\n\n### Key processes\n- Publish Programme Catalogue\n- Process Online Order\n- Process Agent Order\n- Validate Order Against Quota\n- Issue Channel Commission\n- Reject Invalid Order\n- Reserve Cohort Seat","specialization":""},{"id":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","type":"Capability","name":"Plan Curriculum and Courses","documentation":"**A proposal starts the work.** When a new study programme is conceived or an existing one needs substantial revision, the institution drafts a Study Programme Proposal with a rationale and intended learning outcomes. Each course is mapped to ECTS credits at 60 per academic year, and course syllabi set out teaching methods and assessment criteria. The design must follow the three Bologna cycles and NAT accreditation requirements. Meeting those requirements is what keeps enrolment and recognised degree issuance open.\n\n**It depends on current inputs.** The work uses the latest Accreditation Requirements from NAT, a labour market needs analysis no older than five years, and faculty expertise profiles to map teaching staff to proposed courses. From it come the Accredited Study Programme, the Course Catalogue, and a Syllabus Template for each course. These become the basis that enrolment and teaching draw on.\n\n**The Course Catalogue is published.** This is the official list of courses with ECTS credits and learning outcomes. It is the named record that tells students and staff what a programme actually contains.\n\n### Key processes\n- Design Study Programme\n- Allocate ECTS Credits\n- Define Learning Outcomes\n- Develop Syllabus\n- Prepare Accreditation Submission\n- Respond to Accreditation Feedback","specialization":""},{"id":"id-85305cf8-0cba-49a6-a668-a99f37128a68","type":"Capability","name":"Plan Programs","documentation":"**Planning starts from the academic year.** When the annual planning cycle starts or a programme launch is requested, the team develops the campaign calendar, plans open day and information events, schedules content production and publication, and allocates staff and budget to campaigns. If the Academic Calendar is not yet fixed for the next year, no campaign calendar is built and no Event Schedule is confirmed.\n\n**Plan follows deadlines and accreditation.** The work starts from the Marketing Strategy Document, Market Research Report, Marketing Budget Allocation, Academic Calendar, Event Venue Availability, and the Accredited Study Programme Catalogue. The plan aligns with the Serbian academic calendar and the official application deadlines set by the ministry and the institution. The plan does not schedule promotion for a programme before NAT accreditation is granted.\n\n**Campaign Plan sequences the work.** The Campaign Plan is issued after review against the academic calendar and budget. It is the artefact that sets deadlines for material production, coordinates event logistics with venues and speakers, and obtains plan approvals from the institutional governance body. A Plan Approval Request is judged by the governance body on compliance with the Advertising Code and data protection rules. When the plan is approved, each study programme has a timed sequence of promotional activities.\n\n### Key processes\n- Develop Campaign Calendar\n- Plan Open Day Events\n- Schedule Content\n- Allocate Campaign Resources\n- Obtain Plan Approvals\n- Coordinate Event Logistics\n- Set Campaign Deadlines\n- Align Plan with Academic Calendar","specialization":""},{"id":"id-f02c8a55-396b-4810-ab8a-cea744018b10","type":"Capability","name":"Plan Recruiting Initiatives","documentation":"**Planning starts with the seats available.** Before the recruiting season, institutional leadership sets a recruitment goal, and planners set targets and a budget against programme capacity and state enrollment quotas. Targets cannot exceed state-approved Enrollment Quota or accredited programme capacity.\n\n**The plan depends on complete past-cycle data.** Program capacity must be current and programme-specific; a stale figure is rejected and re-obtained before target setting. Past Enrollment Report must be complete from the previous cycle before budget allocation. After events, a Tracking Report records results and feeds adjustment of the Recruitment Plan.\n\n**After events, the report adjusts the plan.** The **Tracking Report** is issued after recruiting events and shows what the outreach produced. Planners use it to adjust targets and the budget, so the next cycle starts from evidence rather than assumption.\n\n### Key processes\n- Analyze Enrollment Data\n- Set Recruitment Targets\n- Allocate Recruitment Budget\n- Schedule Recruiting Event\n- Coordinate with Secondary Schools","specialization":""},{"id":"id-a711bf13-8d88-4d21-8410-ab448500566a","type":"Capability","name":"Price and Commission Management","documentation":"**A fee schedule arrives after governance approval.** Price and Commission Management sets and maintains tuition fees, contract service prices, discounts, and sales commissions across all channels. The outcome is a current Price List and Commission Rate Schedule that all sales activities use. When the Price List is updated before the application window opens, sales staff quote current fees and channel partners continue selling.\n\n**It connects cost, accreditation, and commission plans.** The capability calculates the cost per ECTS credit and verifies each Approved Tuition Fee Schedule against NAT accreditation for the relevant cycle and programme. Fees distinguish state-funded and self-financing places; budget-funded places carry no charge. A Commission Rate Schedule must be authorised by finance before it is configured. From these inputs, the capability produces Price Lists, Discount Authorizations, Incentive Statements, and Price Revisions.\n\n**A current schedule protects quoting.** The **Price List** is issued for each recruitment cycle and sales staff use it to quote fees. If it is not updated before the application window opens, quotes are outdated and clients refuse to sign. The Price List ties every programme fee to its NAT accreditation and ECTS credit workload.\n\n### Key processes\n- Set Programme Fee\n- Approve Discount\n- Maintain Price List\n- Configure Commission Rate\n- Audit Commission Payment\n- Revise Fee\n- Reject Unauthorised Discount","specialization":""},{"id":"id-05994d0d-610b-45e2-b8c2-a60663547d24","type":"Capability","name":"Profitability Analysis","documentation":"**After the financial records close.** Marketing spend is checked against enrolment and revenue by programme and funding type. The analysis separates state-funded places, where income is set by the ministry, from self-financing places, where income varies with recruitment. This keeps one funding type from hiding the other's performance in the report.\n\n**It depends on clean attribution.** Enrolment Data must record the funding type for every student; records without it are rejected. Marketing Cost Data must trace to specific campaigns or programmes; costs that cannot be traced are excluded. The Student Funding Mix must match the official quota decision before the analysis is accepted.\n\n**The Profitability Report reaches the committee.** It reports programme profitability against quotas and is judged on adherence to the cost accounting policy.\n\n### Key processes\n- Calculate Cost per Enrolment\n- Analyse Programme Margin\n- Compare State-Funded to Self-Financing Returns\n- Model Enrolment Scenarios\n- Evaluate Marketing ROI by Segment\n- Allocate Marketing Costs to Programmes\n- Produce Profitability Report\n- Report Programme Profitability","specialization":""},{"id":"id-a1b2e963-145c-42d9-a3b0-fdaff60f0fc3","type":"Capability","name":"Proposal and Application","documentation":"**A funding call opens.** The team screens it, assembles the research plan and budget, gets internal sign-off, and submits before the deadline. This is where an idea becomes a proposal that meets the sponsor's requirements. If the call is misread or internal endorsement arrives late, no application goes in and the effort for that cycle is wasted.\n\n**Internal sign-offs take time.** The dean, the university research office, and sometimes the rector must approve before submission. The work depends on a current call, final sponsor guidelines, a research plan that names the pri
