 authoritative assessment criteria, causing inconsistent grading and potential disputes over course grades.","sourceid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","targetid":"id-8fcac125-67c1-46c5-b3a6-0cb03f136833","specialization":""},{"id":"rel-flow-hiedrs-0099","type":"FlowRelationship","name":"Target Prospect List","documentation":"Content\nTarget Prospect List of prioritised prospective student segments and contacts to be approached during the recruiting cycle, aligned with programme capacity and quotas.\n\nTrigger\nRecruitment targets set and approved.\n\nUnlocks\nRecruit Prospects can focus outreach on the identified prospects and avoid unqualified contacts, improving conversion to qualified leads.\n\nWithout this\nProspect engagement is untargeted, wasting effort and risking contact with people outside the intended segment.","sourceid":"id-f02c8a55-396b-4810-ab8a-cea744018b10","targetid":"id-42e5f948-24cb-4fd9-8dcd-d99ec588dcef","specialization":""},{"id":"rel-flow-hiedrs-0021","type":"FlowRelationship","name":"Territory Assignment","documentation":"Content\nTerritory Assignment names the salesperson or account manager responsible for each territory or customer segment, with coverage rules and handover notes.\n\nTrigger\nA salesperson is hired, a territory is revised, or an underperformer is reassigned.\n\nUnlocks\nAccount Management can route each account to an owner, ensure renewal deadlines are covered, and provide a named contact for the customer.\n\nWithout this\nAccounts are unowned, renewal dates are missed, and customer complaints lack a responsible salesperson.","sourceid":"id-ebfac6ac-707e-497a-b678-abc00810b609","targetid":"id-e5bf6235-0851-40cc-9e21-86b9fbcaac81","specialization":""},{"id":"rel-flow-hiedrs-0014","type":"FlowRelationship","name":"Territory Target","documentation":"Content\nTerritory Target contains revenue and enrolment targets for each sales territory or segment, derived from the approved Sales Plan and constrained by ministry-fixed quotas.\n\nTrigger\nSales Planning and Forecasting finalises the Sales Plan for the recruitment cycle.\n\nUnlocks\nSales Force Management can assign quantitative targets to salespeople, monitor performance, and later calculate incentives against actual results.\n\nWithout this\nThe sales force operates without measurable goals, making performance evaluation and incentive payment arbitrary and undermining revenue planning.","sourceid":"id-52f6b145-944f-43d6-8dff-7f43ef37bc51","targetid":"id-ebfac6ac-707e-497a-b678-abc00810b609","specialization":""},{"id":"rel-flow-hiedrs-0111","type":"FlowRelationship","name":"Transcript of Records","documentation":"Content\nTranscript of Records moves as an official, digital-signed transcript of all graded courses and ECTS credits earned by the candidate, complete for the study programme.\n\nTrigger\nEvaluate Student Performance finalises the student's grades and credits at the end of the final year.\n\nUnlocks\nIssue Diplomas and Diploma Supplements can verify that all degree requirements are met and confirm the total ECTS load before awarding the diploma.\n\nWithout this\nThe diploma process cannot confirm academic completion, so the diploma would be delayed or issued without verified credits.","sourceid":"id-8fcac125-67c1-46c5-b3a6-0cb03f136833","targetid":"id-7867ed7a-a6c0-499b-a13e-41619962e307","specialization":""},{"id":"rel-flow-hiedrs-0090","type":"FlowRelationship","name":"Tuition Invoice","documentation":"Content\nTuition Invoice generated for an enrolled student, with charges, fees, study programme, funding status and due date.\n\nTrigger\nCharges calculated and invoice issued for a billing term.\n\nUnlocks\nManage Financial Relationships can set up or update the payment obligation and link the invoice to the payor or sponsor.\n\nWithout this\nThe financial relationship has no concrete obligation to collect against, so payor authorisation and payment allocation cannot proceed.","sourceid":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","targetid":"id-b334c94a-a2ff-449e-869e-70a0960b4aca","specialization":""},{"id":"rel-flow-hiedrs-0022","type":"FlowRelationship","name":"Won/Lost Decision","documentation":"Content\nWon/Lost Decision records the outcome of a closed opportunity, including win/loss reason, product, source campaign, and responsible salesperson.\n\nTrigger\nAn opportunity is closed as won or lost.\n\nUnlocks\nSales Planning and Forecasting can compare actual wins and losses against the forecast, identify patterns, and adjust future revenue and demand assumptions.\n\nWithout this\nForecasting relies on unattributed assumptions and repeats errors in pipeline expectations, weakening quota allocation and revenue plans.","sourceid":"id-a609d67d-c8e5-42b1-86fb-23647dc01b52","targetid":"id-52f6b145-944f-43d6-8dff-7f43ef37bc51","specialization":""},{"id":"rel-mot-hiedrs-0000","type":"InfluenceRelationship","name":"","documentation":"","sourceid":"dr-state-budget-quota-limits-volume","targetid":"sh-students","specialization":""},{"id":"rel-mot-hiedrs-0001","type":"InfluenceRelationship","name":"","documentation":"","sourceid":"dr-margin-gap","targetid":"sh-students","specialization":""},{"id":"rel-mot-hiedrs-0002","type":"InfluenceRelationship","name":"","documentation":"","sourceid":"dr-margin-gap","targetid":"sh-ministry-higher-education","specialization":""},{"id":"rel-mot-hiedrs-0003","type":"InfluenceRelationship","name":"","documentation":"","sourceid":"dr-margin-gap","targetid":"sh-staff","specialization":""},{"id":"rel-mot-hiedrs-0004","type":"InfluenceRelationship","name":"","documentation":"","sourceid":"dr-margin-gap","targetid":"sh-facility-providers","specialization":""},{"id":"rel-mot-hiedrs-0005","type":"InfluenceRelationship","name":"","documentation":"","sourceid":"dr-accreditation-gate","targetid":"sh-students","specialization":""},{"id":"rel-mot-hiedrs-0006","type":"InfluenceRelationship","name":"","documentation":"","sourceid":"dr-accreditation-gate","targetid": e":"yes"},{"conceptid":"flow-dom-sales--manage-students","propkey":"derived","propvalue":"yes"},{"conceptid":"HIEDRS","propkey":"home_view_min_confidence","propvalue":"all"},{"conceptid":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","propkey":"industry_constraint","propvalue":"A study programme cannot enrol students or issue recognised degrees unless it holds a valid Accreditation Certificate from the National Accreditation Body, renewed periodically, and the institution is accredited for that programme."},{"conceptid":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","propkey":"industry_economics","propvalue":"Revenue is earned from state funding allocated for budget places fixed by enrolment quotas, tuition fees paid by self-financing students, research grants and projects including Erasmus+ and other external funding. Dominant cost lines are academic and non-academic staff salaries, facility operation, and student standard subsidies for accommodation, meals and scholarships administered through student centres. The units counted and billed are the enrolled student by funding status, the ECTS credit, and the budget place. Margin is determined by the gap between the cost of delivering a study place and the state funding or tuition per place, with quota limits constraining volume."},{"conceptid":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","propkey":"industry_exchanges","propvalue":"Operators buy teaching, research and administrative inputs from staff, publishers, equipment suppliers and facility providers. They sell education to students, research results and graduates to employers, and capacity on state-funded places to the ministry responsible for higher education. The National Accreditation Body (NAT) accredits institutions and study programmes and issues Accreditation Certificates and Study Programme Accreditations as preconditions for enrolling students and issuing recognised degrees. The ministry responsible for higher education supervises institutions and allocates budget funding. The Commissioner for Information of Public Importance and Personal Data Protection oversees personal data processing under the Law on Personal Data Protection. With Erasmus+ credit mobility, institutions exchange Learning Agreements and Inter-Institutional Agreements with partner institutions, and Recognition Decisions for qualifications obtained abroad cross institutional boundaries."},{"conceptid":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","propkey":"industry_forces","propvalue":"Serbian quality assurance is read against the Standards and Guidelines for Quality Assurance in the European Higher Education Area (ESG 2015), which strengthens internal self-evaluation and external evaluation feeding NAT accreditation decisions. Erasmus+ credit mobility requires recognition of credits earned abroad using ECTS and the Diploma Supplement, pushing comparability of learning outcomes. The Serbian Law on Personal Data Protection, modelled on the EU General Data Protection Regulation, applies to student records, staff records and research participant data, with cross-border mobility and joint programmes bringing GDPR directly into play. The coexistence of integrated and federated university legal forms shifts where signing authority, accountability and records sit between university and faculty level."},{"conceptid":"id-c60c95fc-180b-4784-9b6f-08c912f70dce","propkey":"industry_identity","propvalue":"Higher Education in Serbia operates under the Law on Higher Education (Zakon o visokom obrazovanju) within the European Higher Education Area. It delivers academic studies and applied studies across three cycles: bachelor, master and doctoral. The output is a graduate holding a recognised degree, accompanied by a Diploma Supplement and a transcript of ECTS credits, and research results from universities and non-university institutions of higher education. The buyers are students, who are either state-funded on budget places or self-financing, employers who hire graduates, and the state, which purchases education, research and public services through ministry funding."},{"conceptid":"rel-flow-hiedrs-0000","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0001","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0002","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0003","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0004","propkey":"review","propvalue":"corrected"},{"conceptid":"rel-flow-hiedrs-0005","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0006","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0007","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0008","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0009","propkey":"review","propvalue":"added"},{"conceptid":"rel-flow-hiedrs-0010","propkey":"review","propvalue":"added"},{"conceptid":"rel-flow-hiedrs-0011","propkey":"review","propvalue":"added"},{"conceptid":"rel-flow-hiedrs-0012","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0013","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0014","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0015","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0016","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0017","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0018","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0019","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0020","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0021","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0022","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0023","propkey":"review","propvalue":"kept"},{"conceptid":"rel-flow-hiedrs-0024","propkey":"review","propvalue":"kept"},{"conceptid":"rel-fl "tgt_domain","propvalue":"Manage Students"},{"conceptid":"rel-flow-hiedrs-0128","propkey":"tgt_domain","propvalue":"Support"},{"conceptid":"rel-flow-hiedrs-0129","propkey":"tgt_domain","propvalue":"Manage Students"},{"conceptid":"rel-vstrig-hiedrs-0000","propkey":"value_stream","propvalue":"Campaign-to-Profitability"},{"conceptid":"rel-vstrig-hiedrs-0001","propkey":"value_stream","propvalue":"Campaign-to-Profitability"},{"conceptid":"rel-vstrig-hiedrs-0002","propkey":"value_stream","propvalue":"Campaign-to-Profitability"},{"conceptid":"rel-vstrig-hiedrs-0003","propkey":"value_stream","propvalue":"Campaign-to-Profitability"},{"conceptid":"rel-vstrig-hiedrs-0004","propkey":"value_stream","propvalue":"Campaign-to-Profitability"},{"conceptid":"rel-vstrig-hiedrs-0005","propkey":"value_stream","propvalue":"Campaign-to-Profitability"},{"conceptid":"rel-vstrig-hiedrs-0006","propkey":"value_stream","propvalue":"Prospect-to-Enrollment"},{"conceptid":"rel-vstrig-hiedrs-0007","propkey":"value_stream","propvalue":"Prospect-to-Enrollment"},{"conceptid":"rel-vstrig-hiedrs-0008","propkey":"value_stream","propvalue":"Prospect-to-Enrollment"},{"conceptid":"rel-vstrig-hiedrs-0009","propkey":"value_stream","propvalue":"Prospect-to-Enrollment"},{"conceptid":"rel-vstrig-hiedrs-0010","propkey":"value_stream","propvalue":"Enrollment-to-Graduation"},{"conceptid":"rel-vstrig-hiedrs-0011","propkey":"value_stream","propvalue":"Enrollment-to-Graduation"},{"conceptid":"rel-vstrig-hiedrs-0012","propkey":"value_stream","propvalue":"Enrollment-to-Graduation"},{"conceptid":"rel-vstrig-hiedrs-0013","propkey":"value_stream","propvalue":"Curriculum-to-Class-Schedule"},{"conceptid":"rel-vstrig-hiedrs-0014","propkey":"value_stream","propvalue":"Curriculum-to-Class-Schedule"},{"conceptid":"rel-vstrig-hiedrs-0015","propkey":"value_stream","propvalue":"Programme-Proposal-to-Accreditation"},{"conceptid":"rel-vstrig-hiedrs-0016","propkey":"value_stream","propvalue":"Programme-Proposal-to-Accreditation"},{"con <script src="lib/marked/marked.min.js"></script>
<script>
/* ============================ helpers ============================ */
var $ = function(i){ return document.getElementById(i); };
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
         .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function pct(a,b){ return b ? Math.round(a * 1000 / b) / 10 : 0; }
function pill(v,t){ return '<span class="pill' + (t?" "+t:"") + '">' + esc(v) + "</span>"; }
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function note(m){ var n=$("note"); n.innerHTML=m||""; n.style.display=m?"block":"none"; }
function fail(m){ var n=$("err"); n.textContent=m; n.style.display="block"; }
function ok(){ $("err").style.display="none"; }

/* A clickable name — opens the concept's narrative. */
function nameCell(cell){
  var v = cell.getValue();
  if(!v) return "";
  return '<span class="lnk" data-doc="' + esc(v) + '">' + esc(v) + "</span>";
}
function scaleCell(cell){
  var v = cell.getValue();
  if(v === null || v === undefined || v === "") return "—";
  var n = parseFloat(v);
  return pill(v, n >= 4 ? "hi" : (n <= 2 ? "lo" : ""));
}
function mutedCell(cell){
  return '<span style="color:var(--muted)">' + esc(cell.getValue()) + "</span>";
}

/* ======================= THE FOUR STAKEHOLDERS ===================== */
var STAKEHOLDERS = [
  { id:"governance", label:"Library governance",
    q:"Is this library sound, complete and honest?" },
  { id:"architect",  label:"Architects",
    q:"What is the shape, and where do I start correcting?" },
  { id:"management", label:"Management",
    q:"What does it cost, what is it worth, where is the risk?" },
  { id:"implementer",label:"Implementers",
    q:"What am I being asked to do, and what breaks if I move?" }
];

/* ============================ REPORTS =============================
 * One entry = one report = ONE SQL statement rendered three ways.
 * Adding a report is one entry here — no new page, no new file.
 *   needs.property   greys the report out, naming what is missing
 * ================================================================== */
var REPORTS = [

/* ---------------------- LIBRARY GOVERNANCE ---------------------- */
{
  id:"inventory", stakeholder:"governance", label:"What is in it",
  question:"What does this library actually contain, and is any of it stranded?",
  sql:"SELECT e.type AS Type, e.name AS Name," +
      " CASE WHEN TRIM(COALESCE(e.documentation,''))='' THEN 'no' ELSE 'yes' END AS Documented," +
      " LENGTH(TRIM(COALESCE(e.documentation,''))) AS DocChars," +
      " (SELECT COUNT(*) FROM relationships r WHERE r.sourceid=e.id OR r.targetid=e.id) AS Connections," +
      " (SELECT COUNT(*) FROM properties p WHERE p.conceptid=e.id) AS Properties" +
      " FROM elements e ORDER BY e.type, e.name",
  kpis:function(rows){
    var doc=rows.filter(function(r){return r.Documented==="yes";}).length;
    var iso=rows.filter(function(r){return r.Connections===0;}).length;
    var ty={}; rows.forEach(function(r){ ty[r.Type]=1; });
    return [
      {k:"Elements", v:rows.length, sub:Object.keys(ty).length+" types"},
      {k:"Documented", v:pct(doc,rows.length)+"%", sub:doc+" of "+rows.length,
       tone: doc===rows.length?"ok":(doc*2<rows.length?"warn":"")},
      {k:"Unconnected", v:iso, sub:iso?"in no relationship":"every element is connected",
       tone: iso?"warn":"ok"},
      /* a property id is an element id OR a relation id — this counts elements
         only, and says so (D-128) */
      {k:"Element properties", v:rows.reduce(function(a,r){return a+r.Properties;},0),
       sub:"attribute values on elements only"}
    ];
  },
  shapes:function(rows){
    var by={},dd={};
    rows.forEach(function(r){ by[r.Type]=(by[r.Type]||0)+1;
      if(r.Documented==="yes") dd[r.Type]=(dd[r.Type]||0)+1; });
    var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a];});
    return [
      {title:"Element types", cap:"what the library is made of", type:"doughnut",
       labels:ks, data:ks.map(function(k){return by[k];})},
      {title:"Documentation coverage", cap:"percent documented, by type", type:"bar",
       labels:ks, data:ks.map(function(k){return pct(dd[k]||0,by[k]);}), max:100, unit:"%"}
    ];
  },
  facets:["Type","Documented"],
  columns:[
    {title:"Type", field:"Type", width:150},
    {title:"Name", field:"Name", minWidth:210, formatter:nameCell},
    {title:"Documented", field:"Documented", width:120, hozAlign:"center",
     formatter:function(c){ return pill(c.getValue(), c.getValue()==="yes"?"ok":"lo"); }},
    {title:"Doc chars", field:"DocChars", width:105, hozAlign:"right"},
    {title:"Connections", field:"Connections", width:120, hozAlign:"right"},
    {title:"Properties", field:"Properties", width:110, hozAlign:"right"}
  ],
  note:"One query. The tiles count it, the shapes group it, the table is the rows themselves — "+
       "so a number above can never disagree with the rows below."
},
{
  id:"gaps", stakeholder:"governance", label:"Gaps and thin spots",
  question:"Where is this library incomplete, and how badly?",
  sql:"SELECT e.type AS Type, e.name AS Name," +
      " LENGTH(TRIM(COALESCE(e.documentation,''))) AS DocChars," +
      " CASE WHEN TRIM(COALESCE(e.documentation,''))='' THEN 'undocumented'" +
      "      WHEN LENGTH(e.documentation) < 200 THEN 'thin'" +
      "      ELSE 'full' END AS Depth," +
      " (SELECT COUNT(*) FROM relationships r WHERE r.sourceid=e.id OR r.targetid=e.id) AS Connections," +
      " CASE WHEN (SELECT COUNT(*) FROM properties p WHERE p.conceptid=e.id)=0" +
      "      THEN 'none' ELSE 'some' END AS Attributes" +
      " FROM elements e ORDER BY DocChars ASC, e.name",
  kpis:function(rows){
    var un=rows.filter(function(r){return r.Depth==="undocumented";}).length;
    var th=rows.filter(function(r){return r.Depth==="thin";}).length;
    var na=rows.filter(function(r){return r.Attributes==="none";}).length;
    var iso=rows.filter(function(r){return r.Connections===0;}).length;
    return [
      {k:"Undocumented", v:un, sub:pct(un,rows.length)+"% of the library",
       tone:un?"warn":"ok"},
      {k:"Thin", v:th, sub:"under 200 characters", tone:th?"warn":"ok"},
      {k:"No attributes", v:na, sub:pct(na,rows.length)+"% carry no property",
       tone:na?"warn":"ok"},
      {k:"Stranded", v:iso, sub:"no relationship at all", tone:iso?"warn":"ok"}
    ];
  },
  shapes:function(rows){
    var d={}, ord=["undocumented","thin","full"];
    rows.forEach(function(r){ d[r.Depth]=(d[r.Depth]||0)+1; });
    var ks=ord.filter(function(k){return d[k];});
    var byType={}, weak={};
    rows.forEach(function(r){ byType[r.Type]=(byType[r.Type]||0)+1;
      if(r.Depth!=="full") weak[r.Type]=(weak[r.Type]||0)+1; });
    var ts=Object.keys(byType).sort(function(a,b){
      return (weak[b]||0)/byType[b]-(weak[a]||0)/byType[a]; }).slice(0,8);
    return [
      {title:"Narrative depth", cap:"how much is actually written", type:"doughnut",
       labels:ks, data:ks.map(function(k){return d[k];})},
      {title:"Where the gaps are", cap:"percent thin or undocumented, by type", type:"bar",
       labels:ts, data:ts.map(function(k){return pct(weak[k]||0,byType[k]);}), max:100, unit:"%"}
    ];
  },
  facets:["Depth","Type"],
  columns:[
    {title:"Depth", field:"Depth", width:130, hozAlign:"center",
     formatter:function(c){ var v=c.getValue();
       return pill(v, v==="full"?"ok":(v==="undocumented"?"lo":"")); }},
    {title:"Type", field:"Type", width:150},
    {title:"Name", field:"Name", minWidth:210, formatter:nameCell},
    {title:"Doc chars", field:"DocChars", width:110, hozAlign:"right"},
    {title:"Connections", field:"Connections", width:120, hozAlign:"right"},
    {title:"Attributes", field:"Attributes", width:110, hozAlign:"center",
     formatter:function(c){ return pill(c.getValue(), c.getValue()==="none"?"lo":""); }}
  ],
  note:"Sorted thinnest first, so the top of this table <b>is the work queue</b>. "+
       "An element with no relationship and no attribute is in the library but not in the model."
},
{
  id:"provenance", stakeholder:"governance", label:"Provenance",
  question:"Where did this content come from, and how much of it is simulated?",
  sql:"SELECT e.name AS Name, e.type AS Type," +
      " COALESCE(MAX(CASE WHEN p.propkey='GeneratedBy' THEN p.propvalue END),'—') AS GeneratedBy," +
      " COALESCE(MAX(CASE WHEN p.propkey='data_origin' THEN p.propvalue END),'—') AS Origin," +
      " COALESCE(MAX(CASE WHEN p.propkey='attr_basis' THEN p.propvalue END),'—') AS Basis" +
      " FROM elements e LEFT JOIN properties p ON p.conceptid=e.id" +
      " GROUP BY e.id, e.name, e.type ORDER BY Origin DESC, e.name",
  kpis:function(rows){
    var sim=rows.filter(function(r){return r.Origin==="simulated";}).length;
    var gen=rows.filter(function(r){return r.GeneratedBy!=="—";}).length;
    var hand=rows.filter(function(r){return r.Basis==="hand-set";}).length;
    return [
      {k:"Elements", v:rows.length, sub:"in the library"},
      {k:"Simulated values", v:sim, sub:sim?pct(sim,rows.length)+"% carry simulated attributes"
        :"none", tone:sim?"warn":"ok"},
      {k:"Traced to a generator", v:gen, sub:pct(gen,rows.length)+"% name what made them"},
      {k:"Hand-set", v:hand, sub:hand?"reasoned rather than banded":"none recorded", tone:hand?"ok":""}
    ];
  },
  shapes:function(rows){
    var g={}, b={};
    rows.forEach(function(r){ g[r.GeneratedBy]=(g[r.GeneratedBy]||0)+1;
      b[r.Basis]=(b[r.Basis]||0)+1; });
    var gs=Object.keys(g).sort(function(a,b2){return g[b2]-g[a];}).slice(0,8);
    var bs=Object.keys(b).sort();
    return [
      {title:"Attribute basis", cap:"reasoned, banded, or absent", type:"doughnut",
       labels:bs, data:bs.map(function(k){return b[k];})},
      {title:"What generated it", cap:"by generator", type:"bar",
       labels:gs, data:gs.map(function(k){return g[k];})}
    ];
  },
  facets:["Origin","Basis"],
  columns:[
    {title:"Name", field:"Name", minWidth:200, formatter:nameCell},
    {title:"Type", field:"Type", width:140},
    {title:"Origin", field:"Origin", width:120, hozAlign:"center",
     formatter:function(c){ var v=c.getValue();
       return v==="simulated" ? pill(v,"lo") : pill(v); }},
    {title:"Basis", field:"Basis", width:120, hozAlign:"center",
     formatter:function(c){ var v=c.getValue();
       return pill(v, v==="hand-set"?"ok":""); }},
    {title:"Generated by", field:"GeneratedBy", minWidth:230, formatter:mutedCell}
  ],
  note:"⚠ <b>Simulated means reasoned, not measured.</b> A library that cannot say where its "+
       "numbers came from cannot be defended when challenged — this report is that answer."
},
{
  id:"integrity", stakeholder:"governance", label:"Integrity",
  question:"Does every relationship actually resolve to something?",
  sql:"SELECT r.type AS Relation, COALESCE(NULLIF(r.name,''),'—') AS Name," +
      " COALESCE(s.name,'‹missing›') AS Source, COALESCE(t.name,'‹missing›') AS Target," +
      " CASE WHEN s.id IS NULL OR t.id IS NULL THEN 'dangling' ELSE 'ok' END AS Integrity," +
      " CASE WHEN TRIM(COALESCE(r.documentation,''))='' THEN 'no' ELSE 'yes' END AS Documented" +
      " FROM relationships r" +
      " LEFT JOIN elements s ON s.id=r.sourceid LEFT JOIN elements t ON t.id=r.targetid" +
      " ORDER BY Integrity DESC, r.type",
  kpis:function(rows){
    var bad=rows.filter(function(r){return r.Integrity==="dangling";}).length;
    var doc=rows.filter(function(r){return r.Documented==="yes";}).length;
    var named=rows.filter(function(r){return r.Name!=="—";}).length;
    var ty={}; rows.forEach(function(r){ ty[r.Relation]=1; });
    return [
      {k:"Relationships", v:rows.length, sub:Object.keys(ty).length+" types in use"},
      {k:"Dangling", v:bad, sub:bad?"point at a missing element":"every end resolves",
       tone:bad?"warn":"ok"},
      {k:"Documented", v:pct(doc,rows.length)+"%", sub:doc+" carry a narrative",
       tone: doc===rows.length?"ok":""},
      /* Most ArchiMate relationships are legitimately unnamed — structural ones
         carry no verb. Reporting that as a fault would be our convention
         imposed on the standard, so state the fact without a verdict. */
      {k:"Named", v:named, sub:"of "+rows.length+" — structural relationships "+
        "carry no name by convention"}
    ];
  },
  shapes:function(rows){
    var by={}, dc={};
    rows.forEach(function(r){ by[r.Relation]=(by[r.Relation]||0)+1;
      if(r.Documented==="yes") dc[r.Relation]=(dc[r.Relation]||0)+1; });
    var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a];});
    return [
      {title:"Relationship types", cap:"the vocabulary in use", type:"doughnut",
       labels:ks, data:ks.map(function(k){return by[k];})},
      {title:"Documented, by type", cap:"percent carrying a narrative", type:"bar",
       labels:ks, data:ks.map(function(k){return pct(dc[k]||0,by[k]);}), max:100, unit:"%"}
    ];
  },
  facets:["Relation","Integrity"],
  columns:[
    {title:"Integrity", field:"Integrity", width:110, hozAlign:"center",
     formatter:function(c){ var v=c.getValue();
       return v==="ok" ? pill("ok","ok") : pill(v,"lo"); }},
    {title:"Relation", field:"Relation", width:175},
    {title:"Source", field:"Source", minWidth:170, formatter:nameCell},
    {title:"Name", field:"Name", minWidth:180, formatter:nameCell},
    {title:"Target", field:"Target", minWidth:170, formatter:nameCell},
    {title:"Doc", field:"Documented", width:80, hozAlign:"center",
     formatter:function(c){ return pill(c.getValue(), c.getValue()==="yes"?"ok":"lo"); }}
  ],
  note:"A dangling end is a broken model, not a cosmetic problem — filter <b>Integrity</b> to "+
       "<code>dangling</code> and every row is a defect."
},

/* ---------------------------- ARCHITECTS ------------------------- */
{
  id:"metamodel", stakeholder:"architect", label:"The metamodel in use",
  question:"What patterns does this model actually use — not what the standard permits?",
  sql:"SELECT r.type AS Relation, s.type AS FromType, t.type AS ToType," +
      " s.type || ' → ' || t.type AS Pattern," +
      " s.name AS Source, t.name AS Target" +
      " FROM relationships r" +
      " JOIN elements s ON s.id=r.sourceid JOIN elements t ON t.id=r.targetid" +
      " ORDER BY r.type, s.name",
  kpis:function(rows){
    var p={}, rt={};
    rows.forEach(function(r){ p[r.Pattern]=(p[r.Pattern]||0)+1; rt[r.Relation]=1; });
    var ks=Object.keys(p);
    var rare=ks.filter(function(k){return p[k]<=2;}).length;
    var top=ks.sort(function(a,b){return p[b]-p[a];})[0];
    return [
      {k:"Patterns in use", v:ks.length, sub:Object.keys(rt).length+" relationship types"},
      {k:"Dominant pattern", v:pct(p[top],rows.length)+"%", sub:top},
      {k:"Used once or twice", v:rare, sub:rare?"usually a mistake, worth checking":"none",
       tone:rare?"warn":"ok"}
    ];
  },
  shapes:function(rows){
    var p={}, rt={};
    rows.forEach(function(r){ p[r.Pattern]=(p[r.Pattern]||0)+1;
      rt[r.Relation]=(rt[r.Relation]||0)+1; });
    var ps=Object.keys(p).sort(function(a,b){return p[b]-p[a];}).slice(0,9);
    var rs=Object.keys(rt).sort(function(a,b){return rt[b]-rt[a];});
    return [
      {title:"Relationship types", cap:"the vocabulary in use", type:"doughnut",
       labels:rs, data:rs.map(function(k){return rt[k];})},
      {title:"From → to patterns", cap:"what the model actually does", type:"bar",
       labels:ps, data:ps.map(function(k){return p[k];})}
    ];
  },
  facets:["Relation","Pattern"],
  columns:[
    {title:"Relation", field:"Relation", width:175},
    {title:"Source", field:"Source", minWidth:180, formatter:nameCell},
    {title:"Target", field:"Target", minWidth:180, formatter:nameCell},
    {title:"Pattern", field:"Pattern", minWidth:230, formatter:mutedCell}
  ],
  note:"The metamodel <b>in use</b> is not always the one a standard describes. "+
       "A pattern appearing once or twice is usually an error, not a design choice."
},
{
  id:"confidence", stakeholder:"architect", label:"Confidence",
  question:"Where is the model unsure of itself, and did it say why?",
  needs:{property:"confidence"},
  sql:"SELECT COALESCE(cf.propvalue,'—') AS Confidence, r.type AS Relation," +
      " s.name AS Source, COALESCE(NULLIF(r.name,''),'—') AS Flow, t.name AS Target," +
      " COALESCE(rw.propvalue,'—') AS Review, COALESCE(cr.propvalue,'') AS Reason" +
      " FROM relationships r" +
      " LEFT JOIN elements s ON s.id=r.sourceid LEFT JOIN elements t ON t.id=r.targetid" +
      " JOIN properties cf ON cf.conceptid=r.id AND cf.propkey='confidence'" +
      " LEFT JOIN properties rw ON rw.conceptid=r.id AND rw.propkey='review'" +
      " LEFT JOIN properties cr ON cr.conceptid=r.id AND cr.propkey='confidence_reason'" +
      " ORDER BY CASE cf.propvalue WHEN 'low' THEN 0 WHEN 'medium' THEN 1 ELSE 2 END, s.name",
  kpis:function(rows){
    var lo=rows.filter(function(r){return r.Confidence==="low";}).length;
    var hi=rows.filter(function(r){return r.Confidence==="high";}).length;
    var why=rows.filter(function(r){return r.Reason;}).length;
    return [
      {k:"Scored relationships", v:rows.length, sub:"carry a confidence value"},
      {k:"Low confidence", v:lo, sub:pct(lo,rows.length)+"% — check these first",
       tone:lo?"warn":"ok"},
      {k:"High confidence", v:hi, sub:pct(hi,rows.length)+"% of the total", tone:"ok"},
      {k:"Gave a reason", v:pct(why,rows.length)+"%", sub:why+" state their reasoning",
       tone: why===rows.length?"ok":"warn"}
    ];
  },
  shapes:function(rows){
    var ord=["low","medium","high"], by={}, src={};
    rows.forEach(function(r){ by[r.Confidence]=(by[r.Confidence]||0)+1;
      if(r.Confidence==="low") src[r.Source]=(src[r.Source]||0)+1; });
    var ks=ord.filter(function(k){return by[k];});
    var top=Object.keys(src).sort(function(a,b){return src[b]-src[a];}).slice(0,8);
    var out=[{title:"Confidence", cap:"how sure the model is of its own connections",
              type:"doughnut", labels:ks, data:ks.map(function(k){return by[k];})}];
    if(top.length) out.push({title:"Where the doubt is",
      cap:"elements with the most low-confidence relationships", type:"bar",
      labels:top, data:top.map(function(k){return src[k];})});
    return out;
  },
  facets:["Confidence","Relation"],
  columns:[
    {title:"Confidence", field:"Confidence", width:120, hozAlign:"center",
     formatter:function(c){ var v=c.getValue();
       return pill(v, v==="high"?"ok":(v==="low"?"lo":"")); }},
    {title:"Source", field:"Source", minWidth:165, formatter:nameCell},
    {title:"Flow", field:"Flow", minWidth:180, formatter:nameCell},
    {title:"Target", field:"Target", minWidth:165, formatter:nameCell},
    {title:"Review", field:"Review", width:100},
    {title:"Reason", field:"Reason", minWidth:250, formatter:mutedCell}
  ],
  note:"Confidence is the model telling you where to look. <b>Filter to low and the table is "+
       "your review queue</b> — the reason column says why the generator was unsure."
},
{
  id:"connectivity", stakeholder:"architect", label:"Connectivity",
  question:"Which elements carry the model, and which are barely attached?",
  sql:"SELECT e.name AS Name, e.type AS Type," +
      " (SELECT COUNT(*) FROM relationships r WHERE r.sourceid=e.id) AS Out," +
      " (SELECT COUNT(*) FROM relationships r WHERE r.targetid=e.id) AS In_," +
      " (SELECT COUNT(*) FROM relationships r WHERE r.sourceid=e.id OR r.targetid=e.id) AS Degree," +
      " CASE WHEN (SELECT COUNT(*) FROM relationships r WHERE r.sourceid=e.id OR r.targetid=e.id)=0" +
      "      THEN 'isolated'" +
      "      WHEN (SELECT COUNT(*) FROM relationships r WHERE r.sourceid=e.id OR r.targetid=e.id)<3" +
      "      THEN 'peripheral' ELSE 'connected' END AS Position" +
      " FROM elements e ORDER BY Degree DESC, e.name",
  kpis:function(rows){
    var iso=rows.filter(function(r){return r.Position==="isolated";}).length;
    var per=rows.filter(function(r){return r.Position==="peripheral";}).length;
    var tot=rows.reduce(function(a,r){return a+r.Degree;},0);
    var top=rows[0];
    return [
      {k:"Average connections", v:rows.length?(Math.round(tot/rows.length*10)/10):0,
       sub:"per element"},
      {k:"Most connected", v:top?top.Degree:0, sub:top?top.Name:"—"},
      {k:"Peripheral", v:per, sub:"fewer than three connections", tone:per?"warn":"ok"},
      {k:"Isolated", v:iso, sub:iso?"not in the model at all":"none", tone:iso?"warn":"ok"}
    ];
  },
  shapes:function(rows){
    var pos={}, ord=["isolated","peripheral","connected"];
    rows.forEach(function(r){ pos[r.Position]=(pos[r.Position]||0)+1; });
    var ks=ord.filter(function(k){return pos[k];});
    var top=rows.slice(0,8);
    return [
      {title:"How attached", cap:"position in the graph", type:"doughnut",
       labels:ks, data:ks.map(function(k){return pos[k];})},
      {title:"Most connected", cap:"the eight highest-degree elements", type:"bar",
       labels:top.map(function(r){return r.Name;}),
       data:top.map(function(r){return r.Degree;})}
    ];
  },
  facets:["Position","Type"],
  columns:[
    {title:"Name", field:"Name", minWidth:210, formatter:nameCell},
    {title:"Type", field:"Type", width:150},
    {title:"Position", field:"Position", width:125, hozAlign:"center",
     formatter:function(c){ var v=c.getValue();
       return pill(v, v==="connected"?"ok":(v==="isolated"?"lo":"")); }},
    {title:"Out", field:"Out", width:80, hozAlign:"right"},
    {title:"In", field:"In_", width:80, hozAlign:"right"},
    {title:"Degree", field:"Degree", width:100, hozAlign:"right"}
  ],
  note:"Degree is a blunt measure, but the extremes are informative: the top of this table is "+
       "<b>what the model is really about</b>, and the bottom is what nobody connected."
},

/* Added 18 Sep 2026 (Bora, from the UCISA statistics run). `connectivity` above
   reads ONE element at a time; this reads each LAYER as a graph in its own right.
   The distinction is the point: UCISA's domains measured density 1.0000 (a complete
   graph — every domain exchanges with every other, both ways) while its processes
   measured 0.0099. Both are true, neither is visible in a per-element table, and the
   first is the standing argument for the unbuilt `dominant=yes` work: at density 1.0
   an overview diagram has no visual hierarchy to draw.
   Levels are read from the element TYPE, so this works on any model without
   configuration and without a property the model may not carry. */
{
  id:"layers", stakeholder:"architect", label:"Layer connectivity",
  question:"How densely is each layer wired, and where does the model actually exchange?",
  // Domain ownership is DERIVED from the structure, not read from a property.
  // `src_domain` exists on some models and not others (UCISA carries none), and
  // a LEFT JOIN that misses simply reported every flow as crossing a boundary --
  // 100% where the true figure was 10%. A wrong number stated confidently is
  // worse than an absent one, so this walks the two relationships the model is
  // guaranteed to have: a capability is Composed into its domain, a process
  // Realizes its capability (D-034, source=process).
  sql:"WITH owner(id,d) AS (" +
      " SELECT r.targetid, r.sourceid FROM relationships r" +
      "  WHERE r.type='CompositionRelationship'" +
      " UNION" +
      " SELECT r.sourceid, c.sourceid FROM relationships r" +
      "  JOIN relationships c ON c.targetid = r.targetid" +
      "                      AND c.type='CompositionRelationship'" +
      "  WHERE r.type='RealizationRelationship'" +
      " UNION SELECT e.id, e.id FROM elements e WHERE e.type='Grouping')" +
      " SELECT se.type AS Layer, COUNT(*) AS Flows," +
      " COUNT(DISTINCT se.id) AS Sources, COUNT(DISTINCT te.id) AS Targets," +
      " (SELECT COUNT(*) FROM elements x WHERE x.type=se.type) AS Elements," +
      " CASE WHEN sdom.d IS NULL OR tdom.d IS NULL THEN 'domain unknown'" +
      "      WHEN sdom.d = tdom.d THEN 'within one domain'" +
      "      ELSE 'crosses domains' END AS Reach" +
      " FROM relationships r" +
      " JOIN elements se ON se.id = r.sourceid" +
      " JOIN elements te ON te.id = r.targetid" +
      " LEFT JOIN owner sdom ON sdom.id = se.id" +
      " LEFT JOIN owner tdom ON tdom.id = te.id" +
      " WHERE r.type = 'FlowRelationship' AND se.type = te.type" +
      " GROUP BY se.type, Reach ORDER BY Flows DESC",
  kpis:function(rows){
    // Density = flows / possible ordered pairs, per layer. n*(n-1) because a flow
    // is directed and an element does not flow to itself.
    var byLayer={};
    rows.forEach(function(r){
      var L=byLayer[r.Layer]||(byLayer[r.Layer]={flows:0,n:r.Elements});
      L.flows+=r.Flows;
    });
    var out=[], names=Object.keys(byLayer);
    names.sort(function(a,b){ return byLayer[a].n - byLayer[b].n; });
    names.forEach(function(k){
      var L=byLayer[k], poss=L.n*(L.n-1), d=poss?L.flows/poss:0;
      out.push({k:k, v:(Math.round(d*10000)/10000).toFixed(4),
                sub:L.flows+" flows across "+L.n+" elements",
                tone:d>=0.999?"warn":"ok"});
    });
    var cross=rows.filter(function(r){return r.Reach==="crosses domains";})
                  .reduce(function(a,r){return a+r.Flows;},0);
    var all=rows.reduce(function(a,r){return a+r.Flows;},0);
    out.push({k:"Crosses a domain", v:all?Math.round(100*cross/all)+"%":"—",
              sub:cross+" of "+all+" flows", tone:(all&&cross/all<0.15)?"warn":"ok"});
    return out;
  },
  shapes:function(rows){
    var byLayer={}, reach={};
    rows.forEach(function(r){
      byLayer[r.Layer]=(byLayer[r.Layer]||0)+r.Flows;
      reach[r.Reach]=(reach[r.Reach]||0)+r.Flows;
    });
    var lk=Object.keys(byLayer), rk=Object.keys(reach);
    return [
      {title:"Flows by layer", cap:"where the exchanges are modelled", type:"bar",
       labels:lk, data:lk.map(function(k){return byLayer[k];})},
      {title:"Reach", cap:"inside a domain, or across one", type:"doughnut",
       labels:rk, data:rk.map(function(k){return reach[k];})}
    ];
  },
  facets:["Layer","Reach"],
  columns:[
    {title:"Layer", field:"Layer", minWidth:170},
    {title:"Reach", field:"Reach", width:170,
     formatter:function(c){ var v=c.getValue();
       return pill(v, v==="crosses domains"?"ok":""); }},
    {title:"Flows", field:"Flows", width:100, hozAlign:"right"},
    {title:"Elements", field:"Elements", width:110, hozAlign:"right"},
    {title:"Sources", field:"Sources", width:100, hozAlign:"right"},
    {title:"Targets", field:"Targets", width:100, hozAlign:"right"}
  ],
  note:"Density is flows divided by the ordered pairs that COULD exist, so it is "+
       "comparable across layers of very different size. <b>A density approaching "+
       "1.0 means every element exchanges with every other</b> — true, and undrawable: "+
       "an overview at that density has no shape to show. A low cross-domain share "+
       "means the model describes largely self-contained parts rather than one "+
       "connected operation; whether that is right is a modelling judgement, not a defect. "+
       "Domain ownership is derived from Composition and Realization, so the split holds on "+
       "any model with that structure; anything unattached is counted honestly as "+
       "<i>domain unknown</i> rather than silently called a crossing."
},
{
  id:"domains", stakeholder:"architect", label:"Domains",
  question:"How is the model divided, and do the divisions hold?",
  needs:{property:"src_domain"},
  sql:"SELECT COALESCE(sd.propvalue,'—') AS FromDomain, COALESCE(td.propvalue,'—') AS ToDomain," +
      " CASE WHEN sd.propvalue = td.propvalue THEN 'internal' ELSE 'crosses' END AS Boundary," +
      " s.name AS Source, COALESCE(NULLIF(r.name,''),'—') AS Flow, t.name AS Target," +
      " COALESCE(cf.propvalue,'—') AS Confidence" +
      " FROM relationships r" +
      " JOIN properties sd ON sd.conceptid=r.id AND sd.propkey='src_domain'" +
      " LEFT JOIN properties td ON td.conceptid=r.id AND td.propkey='tgt_domain'" +
      " LEFT JOIN elements s ON s.id=r.sourceid LEFT JOIN elements t ON t.id=r.targetid" +
      " LEFT JOIN properties cf ON cf.conceptid=r.id AND cf.propkey='confidence'" +
      " ORDER BY Boundary DESC, FromDomain, ToDomain",
  kpis:function(rows){
    var cross=rows.filter(function(r){return r.Boundary==="crosses";}).length;
    var d={}; rows.forEach(function(r){ d[r.FromDomain]=1; d[r.ToDomain]=1; });
    var pairs={}; rows.filter(function(r){return r.Boundary==="crosses";})
      .forEach(function(r){ pairs[r.FromDomain+" → "+r.ToDomain]=1; });
    return [
      {k:"Domains", v:Object.keys(d).length, sub:"named in the flows"},
      {k:"Cross-domain flows", v:cross, sub:pct(cross,rows.length)+"% leave their domain",
       tone: cross*2>rows.length?"warn":""},
      {k:"Boundary pairs", v:Object.keys(pairs).length,
       sub:"distinct domain-to-domain routes"}
    ];
  },
  shapes:function(rows){
    var by={}, pairs={};
    rows.forEach(function(r){ by[r.FromDomain]=(by[r.FromDomain]||0)+1;
      if(r.Boundary==="crosses") pairs[r.FromDomain+" → "+r.ToDomain]=
        (pairs[r.FromDomain+" → "+r.ToDomain]||0)+1; });
    var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a];});
    var ps=Object.keys(pairs).sort(function(a,b){return pairs[b]-pairs[a];}).slice(0,8);
    var out=[{title:"Flows by domain", cap:"where the traffic originates", type:"doughnut",
              labels:ks, data:ks.map(function(k){return by[k];})}];
    if(ps.length) out.push({title:"Busiest boundaries",
      cap:"the domain-to-domain routes that carry most", type:"bar",
      labels:ps, data:ps.map(function(k){return pairs[k];})});
    return out;
  },
  facets:["FromDomain","Boundary"],
  columns:[
    {title:"Boundary", field:"Boundary", width:110, hozAlign:"center",
     formatter:function(c){ var v=c.getValue();
       return pill(v, v==="crosses"?"":"ok"); }},
    {title:"From domain", field:"FromDomain", width:175},
    {title:"To domain", field:"ToDomain", width:175},
    {title:"Source", field:"Source", minWidth:160, formatter:nameCell},
    {title:"Flow", field:"Flow", minWidth:175, formatter:nameCell},
    {title:"Target", field:"Target", minWidth:160, formatter:nameCell},
    {title:"Confidence", field:"Confidence", width:110, hozAlign:"center",
     formatter:function(c){ var v=c.getValue();
       return pill(v, v==="high"?"ok":(v==="low"?"lo":"")); }}
  ],
  note:"A boundary that carries a great deal of traffic is either the real seam of the "+
       "business, or a division drawn in the wrong place."
},

/* --------------------------- MANAGEMENT -------------------------- */
{
  id:"cost", stakeholder:"management", label:"Cost and value",
  question:"What does this cost, and is the money sitting where the value is?",
  needs:{property:"business_fit"},
  sql:"SELECT e.name AS Name," +
      " MAX(CASE WHEN p.propkey='business_fit'     THEN p.propvalue END) AS BusinessFit," +
      " MAX(CASE WHEN p.propkey='technical_fit'    THEN p.propvalue END) AS TechnicalFit," +
      " MAX(CASE WHEN p.propkey='maturity_current' THEN p.propvalue END) AS Maturity," +
      " CAST(MAX(CASE WHEN p.propkey='opex_current' THEN p.propvalue END) AS INTEGER) AS Cost," +
      " MAX(CASE WHEN p.propkey='attr_basis'       THEN p.propvalue END) AS Basis" +
      " FROM elements e JOIN properties p ON p.conceptid=e.id" +
      " GROUP BY e.id, e.name HAVING BusinessFit IS NOT NULL" +
      " ORDER BY Cost DESC",
  kpis:function(rows){
    var spend=rows.reduce(function(a,r){return a+num(r.Cost);},0);
    var weak=rows.filter(function(r){return num(r.BusinessFit)<=2;});
    var ws=weak.reduce(function(a,r){return a+num(r.Cost);},0);
    var strong=rows.filter(function(r){return num(r.BusinessFit)>=4;});
    var ss=strong.reduce(function(a,r){return a+num(r.Cost);},0);
    return [
      {k:"Annual cost", v:(Math.round(spend/1000)/1000).toFixed(2), raw:"m",
       sub:rows.length+" scored capabilities"},
      {k:"On weak fit", v:(Math.round(ws/1000)/1000).toFixed(2), raw:"m",
       sub:weak.length+" at fit ≤ 2 — "+pct(ws,spend)+"% of spend", tone:"warn"},
      {k:"On strong fit", v:(Math.round(ss/1000)/1000).toFixed(2), raw:"m",
       sub:strong.length+" at fit ≥ 4 — "+pct(ss,spend)+"% of spend", tone:"ok"},
      {k:"Average cost", v:rows.length?(Math.round(spend/rows.length/1000)+"k"):"0",
       sub:"per capability"}
    ];
  },
  shapes:function(rows){
    var cost={}, cnt={};
    rows.forEach(function(r){ var k="fit "+(r.BusinessFit||"—");
      cost[k]=(cost[k]||0)+num(r.Cost); cnt[k]=(cnt[k]||0)+1; });
    var ks=Object.keys(cost).sort();
    var top=rows.slice(0,8);
    return [
      {title:"Cost by business fit", cap:"where the money sits against value", type:"bar",
       labels:ks, data:ks.map(function(k){return Math.round(cost[k]/1000);}), unit:"k"},
      {title:"Most expensive", cap:"the eight largest annual costs", type:"bar",
       labels:top.map(function(r){return r.Name;}),
       data:top.map(function(r){return Math.round(num(r.Cost)/1000);}), unit:"k"}
    ];
  },
  facets:["BusinessFit","Basis"],
  columns:[
    {title:"Name", field:"Name", minWidth:210, formatter:nameCell},
    {title:"Business fit", field:"BusinessFit", width:120, hozAlign:"center", formatter:scaleCell},
    {title:"Technical fit", field:"TechnicalFit", width:120, hozAlign:"center", formatter:scaleCell},
    {title:"Maturity", field:"Maturity", width:100, hozAlign:"center"},
    {title:"Annual cost", field:"Cost", width:130, hozAlign:"right", sorter:"number",
     formatter:function(c){ var v=parseFloat(c.getValue());
       return isNaN(v)?"—":v.toLocaleString(); }},
    {title:"Basis", field:"Basis", width:115, hozAlign:"center",
     formatter:function(c){ var v=c.getValue();
       return v?pill(v, v==="hand-set"?"ok":""):"—"; }}
  ],
  note:"⚠ These values are <b>simulated</b> — reasoned, not measured. The pattern to look for is "+
       "<b>cost sitting on low business fit</b>: money spent on something the business does not value."
},
{
  id:"investment", stakeholder:"management", label:"Where to invest",
  question:"Which capabilities should improve, and what would it cost to move them?",
  needs:{property:"maturity_projected"},
  sql:"SELECT e.name AS Name," +
      " MAX(CASE WHEN p.propkey='maturity_current'   THEN p.propvalue END) AS Now," +
      " MAX(CASE WHEN p.propkey='maturity_projected' THEN p.propvalue END) AS Target," +
      " CAST(MAX(CASE WHEN p.propkey='maturity_projected' THEN p.propvalue END) AS INTEGER)" +
      "  - CAST(MAX(CASE WHEN p.propkey='maturity_current' THEN p.propvalue END) AS INTEGER) AS Gap," +
      " CAST(MAX(CASE WHEN p.propkey='opex_current' THEN p.propvalue END) AS INTEGER) AS CostNow," +
      " CAST(MAX(CASE WHEN p.propkey='opex_projected' THEN p.propvalue END) AS INTEGER)" +
      "  - CAST(MAX(CASE WHEN p.propkey='opex_current' THEN p.propvalue END) AS INTEGER) AS Delta," +
      " MAX(CASE WHEN p.propkey='business_fit' THEN p.propvalue END) AS BusinessFit" +
      " FROM elements e JOIN properties p ON p.conceptid=e.id" +
      " GROUP BY e.id, e.name HAVING Now IS NOT NULL AND Target IS NOT NULL" +
      " ORDER BY Gap DESC, Delta DESC",
  kpis:function(rows){
    var moving=rows.filter(function(r){return num(r.Gap)>0;});
    var extra=moving.reduce(function(a,r){return a+num(r.Delta);},0);
    var worth=moving.filter(function(r){return num(r.BusinessFit)>=4;}).length;
    return [
      {k:"Planned to improve", v:moving.length, sub:"of "+rows.length+" with a target"},
      /* extra may be NEGATIVE: the projection can cost LESS than today.
         Labelling that "additional spend: -0.24m" reads as a cost. Say which
         it is. */
      {k: extra<0?"Projected saving":"Additional spend",
       v:(Math.round(Math.abs(extra)/1000)/1000).toFixed(2), raw:"m",
       sub: extra<0 ? "the plan costs less than today"
                    : "to reach the projected maturity",
       tone: extra<0?"ok":"warn"},
      {k:"On high-value capabilities", v:worth,
       sub:worth?"of the improving set, fit ≥ 4":"none — check the plan",
       tone:worth?"ok":"warn"},
      {k:"Standing still", v:rows.length-moving.length, sub:"no maturity change planned"}
    ];
  },
  shapes:function(rows){
    var g={}; rows.forEach(function(r){ var k="+"+num(r.Gap); g[k]=(g[k]||0)+1; });
    var ks=Object.keys(g).sort();
    var top=rows.filter(function(r){return num(r.Delta)>0;})
                .sort(function(a,b){return num(b.Delta)-num(a.Delta);}).slice(0,8);
    var out=[{title:"Maturity gap", cap:"how far each is planned to move", type:"doughnut",
              labels:ks, data:ks.map(function(k){return g[k];})}];
    if(top.length) out.push({title:"Largest increases",
      cap:"additional annual cost, thousands", type:"bar",
      labels:top.map(function(r){return r.Name;}),
      data:top.map(function(r){return Math.round(num(r.Delta)/1000);}), unit:"k"});
    return out;
  },
  facets:["Gap","BusinessFit"],
  columns:[
    {title:"Name", field:"Name", minWidth:210, formatter:nameCell},
    {title:"Maturity now", field:"Now", width:120, hozAlign:"center"},
    {title:"Target", field:"Target", width:95, hozAlign:"center"},
    {title:"Gap", field:"Gap", width:80, hozAlign:"center",
     formatter:function(c){ var v=num(c.getValue());
       return v>0 ? pill("+"+v,"hi") : pill("0"); }},
    {title:"Business fit", field:"BusinessFit", width:120, hozAlign:"center", formatter:scaleCell},
    {title:"Cost now", field:"CostNow", width:120, hozAlign:"right", sorter:"number",
     formatter:function(c){ var v=parseFloat(c.getValue());
       return isNaN(v)?"—":v.toLocaleString(); }},
    {title:"Change", field:"Delta", width:115, hozAlign:"right", sorter:"number",
     formatter:function(c){ var v=parseFloat(c.getValue());
       if(isNaN(v)) return "—";
       return '<span style="color:'+(v>0?"var(--warn)":"var(--muted)")+'">'+
              (v>0?"+":"")+v.toLocaleString()+"</span>"; }}
  ],
  note:"⚠ Simulated values. <b>Spend increasing on a low-fit capability is the question to ask</b> — "+
       "it may be right, but it should be deliberate."
},

{
  id:"portfolio", stakeholder:"management", label:"Portfolio",
  question:"Where does every capability sit against value and technical health?",
  needs:{property:"business_fit"},
  sql:"SELECT e.name AS Name," +
      " MAX(CASE WHEN p.propkey='business_fit'     THEN p.propvalue END) AS BusinessFit," +
      " MAX(CASE WHEN p.propkey='technical_fit'    THEN p.propvalue END) AS TechnicalFit," +
      " MAX(CASE WHEN p.propkey='maturity_current' THEN p.propvalue END) AS Maturity," +
      " CAST(MAX(CASE WHEN p.propkey='opex_current' THEN p.propvalue END) AS INTEGER) AS Cost," +
      /* The POSITION, not a verdict. A named quadrant would require thresholds,
         and thresholds are ours, not the data's -- see the note below. */
      " MAX(CASE WHEN p.propkey='business_fit'  THEN p.propvalue END) || ' / ' ||" +
      " MAX(CASE WHEN p.propkey='technical_fit' THEN p.propvalue END) AS Position" +
      " FROM elements e JOIN properties p ON p.conceptid=e.id" +
      " GROUP BY e.id, e.name HAVING BusinessFit IS NOT NULL AND TechnicalFit IS NOT NULL" +
      " ORDER BY CAST(BusinessFit AS INTEGER) DESC, CAST(TechnicalFit AS INTEGER) DESC, Name",
  kpis:function(rows){
    /* Counts of what is actually there, and the observed range of each scale --
       no threshold is applied, because the scales are not ours to interpret. */
    var bf=rows.map(function(r){ return num(r.BusinessFit); });
    var tf=rows.map(function(r){ return num(r.TechnicalFit); });
    function med(a){ var x=a.slice().sort(function(p,q){return p-q;});
      var m=Math.floor(x.length/2);
      return x.length%2 ? x[m] : (x[m-1]+x[m])/2; }
    var spend=rows.reduce(function(a,r){ return a+num(r.Cost); },0);
    var cells={};
    rows.forEach(function(r){ cells[r.Position]=(cells[r.Position]||0)+1; });
    var ks=Object.keys(cells);
    var top=ks.sort(function(a,b){ return cells[b]-cells[a]; })[0];
    return [
      {k:"Placed", v:rows.length, sub:"carry both fit scores"},
      {k:"Business fit", v:Math.min.apply(null,bf)+"\u2013"+Math.max.apply(null,bf),
       sub:"observed range, median "+med(bf)},
      {k:"Technical fit", v:Math.min.apply(null,tf)+"\u2013"+Math.max.apply(null,tf),
       sub:"observed range, median "+med(tf)},
      {k:"Most common position", v:top,
       sub:cells[top]+" capabilities \u2014 "+pct(cells[top],rows.length)+"% of the portfolio"}
    ];

  shapes:function(rows){

      {title:"Cost by business fit", cap:"thousands per year \u2014 where the money sits",

var MAP={
  elements:{ id:["id"], type:["type"], name:["name"],
             documentation:["documentation","doc"], specialization:["specialization"] },
  relationships:{ id:["id"], type:["type"], name:["name"],
             documentation:["documentation","doc"],
             sourceid:["source","sourceid","source_id","src"],
             targetid:["target","targetid","target_id","tgt"],
             specialization:["specialization"] },
  properties:{ conceptid:["id","object_id","conceptid","concept_id","element_id"],
             propkey:["key","propkey","property","name"], propvalue:["value","propvalue"] }
};
function classify(fname, header){
  var n=fname.toLowerCase();
  if(/element/.test(n)) return "elements";
  if(/relation|relations|rels?/.test(n)) return "relationships";
  if(/propert/.test(n)) return "properties";
  var h=header.map(function(x){return x.toLowerCase().trim();});
  if(h.indexOf("source")>=0||h.indexOf("sourceid")>=0) return "relationships";
  if(h.indexOf("key")>=0&&h.indexOf("value")>=0) return "properties";
  if(h.indexOf("documentation")>=0||h.indexOf("type")>=0) return "elements";
  return null;
}
/* RFC4180: quoted fields, doubled quotes, embedded newlines and commas. */
function parseCSV(text){
  text=text.replace(/^﻿/,"").replace(/^[\r\n]+/,"");
  var out=[],row=[],cur="",q=false,i=0;
  while(i<text.length){
    var ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i+=2;continue;} q=false;i++;continue; }
      cur+=ch;i++;continue;
    }
    if(ch==='"'){ q=true;i++;continue; }
    if(ch===','){ row.push(cur);cur="";i++;continue; }
    if(ch==='\r'){ i++;continue; }
    if(ch==='\n'){ row.push(cur);out.push(row);row=[];cur="";i++;continue; }
    cur+=ch;i++;
  }
  if(cur.length||row.length){ row.push(cur); out.push(row); }
  return out;
}

function wireLoader(){
  var drop=$("drop"); if(!drop) return;
  drop.onclick=function(){ $("file").click(); };
  $("file").onchange=function(){ readFiles(this.files); };
  drop.addEventListener("dragover",function(e){ e.preventDefault(); this.classList.add("hot"); });
  drop.addEventListener("dragleave",function(){ this.classList.remove("hot"); });
  document.addEventListener("dragover",function(e){ e.preventDefault(); });
  document.addEventListener("drop",function(e){
    e.preventDefault(); if(drop) drop.classList.remove("hot");
    if(e.dataTransfer.files.length) readFiles(e.dataTransfer.files);
  });
  $("load").onclick=function(){ buildFromCSV(); };
  $("sample").onclick=function(){
    $("status").textContent="loading sample…";
    Promise.all([
      fetch("sample/elements.csv").then(function(r){return r.text();}),
      fetch("sample/relations.csv").then(function(r){return r.text();}),
      fetch("sample/properties.csv").then(function(r){return r.text();})
    ]).then(function(t){
      stage("elements.csv",t[0]); stage("relations.csv",t[1]); stage("properties.csv",t[2]);
      buildFromCSV();
    }).catch(function(e){ fail("No sample bundled with this copy.\n"+(e.message||e)); });
  };
}
function stage(fname,text){
  var g=parseCSV(text);
  if(!g.length){ fail("Empty file: "+fname); return; }
  var header=g[0].map(function(h){return h.replace(/^\s+|\s+$/g,"");});
  var kind=classify(fname,header);
  if(!kind){
    fail("Could not tell what "+fname+" is.\n\nHeader: "+header.join(", ")+
         "\n\nExpected an Archi CSV export — elements, relations or properties.");
    return;
  }
  staged[kind]={header:header, rows:g.slice(1)};
  var slot={elements:"s-el",relationships:"s-re",properties:"s-pr"}[kind];
  if($(slot)){
    $(slot).className="slot has";
    $(slot).querySelector(".nm").textContent=fname+" ("+(g.length-1)+")";
  }
  if($("load")) $("load").disabled=!staged.elements;
  ok();
}
function readFiles(list){
  Array.prototype.forEach.call(list,function(f){
    var r=new FileReader();
    r.onload=function(){ stage(f.name,r.result); };
    r.readAsText(f);
  });
}
function pick(header,aliases){
  var low=header.map(function(h){return h.toLowerCase().replace(/[\s_]/g,"");});
  for(var a=0;a<aliases.length;a++){
    var i=low.indexOf(aliases[a].toLowerCase().replace(/[\s_]/g,""));
    if(i>=0) return i;
  }
  return -1;
}

/* ============================ build ============================== */
function createTables(){
  db.run("CREATE TABLE elements (id TEXT, type TEXT, name TEXT, documentation TEXT,"+
         " specialization TEXT);"+
         "CREATE TABLE relationships (id TEXT, type TEXT, name TEXT, documentation TEXT,"+
         " sourceid TEXT, targetid TEXT, specialization TEXT);"+
         "CREATE TABLE properties (conceptid TEXT, propkey TEXT, propvalue TEXT);");
}
function indexTables(){
  db.run("CREATE INDEX ix_p ON properties(propkey);"+
         "CREATE INDEX ix_pc ON properties(conceptid);"+
         "CREATE INDEX ix_e ON elements(id);"+
         "CREATE INDEX ix_rs ON relationships(sourceid);"+
         "CREATE INDEX ix_rt ON relationships(targetid);");
}
function insertRows(tbl, cols, list){
  var stmt=db.prepare("INSERT INTO "+tbl+" ("+cols.join(",")+") VALUES ("+
    cols.map(function(){return "?";}).join(",")+")");
  list.forEach(function(o){
    stmt.run(cols.map(function(c){ return o[c]===undefined||o[c]===null ? "" : o[c]; }));
  });
  stmt.free();
  return list.length;
}
function buildFromJSON(d){
  try{
    if(db) db.close();
    db=new SQL.Database(); createTables();
    var ne=insertRows("elements",
      ["id","type","name","documentation","specialization"], d.elements||[]);
    var nr=insertRows("relationships",
      ["id","type","name","documentation","sourceid","targetid","specialization"],
      d.relationships||[]);
    var np=insertRows("properties",
      ["conceptid","propkey","propvalue"], d.properties||[]);
    indexTables();
    if(d.model) $("h-sub").textContent=d.model;
    $("status").textContent=ne+" elements · "+nr+" relationships · "+np+" properties";
    ok(); showEntry();
  }catch(e){ fail("Embedded data failed to load.\n"+(e.message||e)); showLoader(); }
}
function buildFromCSV(){
  try{
    if(db) db.close();
    db=new SQL.Database(); createTables();
    function ins(tbl,spec,src){
      if(!src) return 0;
      var names=[],idx=[];
      for(var c in spec){ names.push(c); idx.push(pick(src.header,spec[c])); }
      var stmt=db.prepare("INSERT INTO "+tbl+" ("+names.join(",")+") VALUES ("+
        names.map(function(){return "?";}).join(",")+")");
      src.rows.forEach(function(r){
        if(r.length===1&&r[0]==="") return;
        stmt.run(idx.map(function(i){ return i<0?"":(r[i]===undefined?"":r[i]); }));
      });
      stmt.free();
      return src.rows.length;
    }
    var ne=ins("elements",MAP.elements,staged.elements);
    var nr=ins("relationships",MAP.relationships,staged.relationships);
    var np=ins("properties",MAP.properties,staged.properties);
    indexTables();
    $("status").textContent=ne+" elements · "+nr+" relationships · "+np+" properties";
    ok(); showEntry();
  }catch(e){ fail("Load failed.\n"+(e.message||e)); }
}

/* ====================== availability / gating ==================== */
function hasProp(k){
  try{ return db.exec("SELECT 1 FROM properties WHERE propkey="+JSON.stringify(k)+
                      " LIMIT 1").length>0; }
  catch(e){ return false; }
}
function missingFor(rep){
  if(rep.needs && rep.needs.property && !hasProp(rep.needs.property))
    return rep.needs.property;
  return null;
}
function reportsFor(sid){
  return REPORTS.filter(function(r){ return r.stakeholder===sid; });
}

      ? reps.length+" report"+(reps.length===1?"":"s")+" ready"
      : live+" of "+reps.length+" available on this model";
