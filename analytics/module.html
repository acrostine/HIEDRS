intain Student Records can record academic progress, calculate accumulated ECTS credits, and update the Student Record for transcripts and graduation checks.\n\nWithout this\nMaintain Student Records cannot update the student's academic history, leaving transcripts incomplete and preventing accurate ECTS accumulation or graduation clearance.","sourceid":"id-8fcac125-67c1-46c5-b3a6-0cb03f136833","targetid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","specialization":""},{"id":"rel-flow-hiedrs-0063","type":"FlowRelationship","name":"Course Selection Advice","documentation":"Content\nThe advisor-approved set of course codes and ECTS credits for the student's next term, aligned with the Study Plan and prerequisites.\n\nTrigger\nThe advising session concludes and the student agrees to the recommended course selection.\n\nUnlocks\nEnroll in Classes can turn the advice into a formal Course Selection, validate prerequisites, and register the student into the approved sections.\n\nWithout this\nEnroll in Classes receives unvalidated course requests, causing registration into courses that violate prerequisites or exceed the 60 ECTS workload, requiring later corrections.","sourceid":"id-d7a1670b-5b1f-4419-a987-19f2b699fecb","targetid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","specialization":""},{"id":"rel-flow-hiedrs-0115","type":"FlowRelationship","name":"Cross-Border Transfer Authorisation","documentation":"Content\nCross-Border Transfer Authorisation moves as a data protection officer's approval for sending student mobility records, learning agreements, and personal data to partner institutions in the EU or beyond under GDPR safeguards.\n\nTrigger\nAn Erasmus+ mobility period is approved and personal data must move to a partner institution.\n\nUnlocks\nManage Erasmus+ Mobility can legally exchange learning agreements, transcripts, and personal data with partner institutions for the mobility duration.\n\nWithout this\nMobility management cannot share student data abroad, so learning agreements and host institution transcripts cannot be processed, blocking the mobility.","sourceid":"id-f7b60e7c-3f68-40f5-9f7d-335d13dd7c1c","targetid":"id-1bdefe7d-266e-4b95-8f83-c2539d0148ab","specialization":""},{"id":"rel-flow-hiedrs-0029","type":"FlowRelationship","name":"Cross-Sell Target List","documentation":"Content\nCross-Sell Target List identifies existing accounts with high potential for additional programmes or services, produced by Customer Portfolio Management.\n\nTrigger\nA quarterly portfolio analysis or segment definition refresh is completed.\n\nUnlocks\nAccount Management can focus cross-sell recommendations and renewal discussions on accounts most likely to buy more.\n\nWithout this\nCross-sell opportunities remain hidden, leaving expansion revenue uncaptured and account managers without prioritised targets.","sourceid":"id-6d5adb53-67bb-47a3-86a7-6157091b49aa","targetid":"id-e5bf6235-0851-40cc-9e21-86b9fbcaac81","specialization":""},{"id":"rel-flow-hiedrs-0064","type":"FlowRelationship","name":"Curriculum Exception Petition","documentation":"Content\nA formal petition for an individual student to deviate from the accredited curriculum, stating the requested substitution or waiver and the academic justification.\n\nTrigger\nA student requests a deviation and the advisor determines that a formal exception is warranted.\n\nUnlocks\nPlan Curriculum and Courses can assess whether the exception reveals a curriculum gap and, if repeated, propose a structural change to the accredited programme.\n\nWithout this\nPlan Curriculum and Courses never learns that students repeatedly need exceptions, leaving underlying curriculum defects unaddressed and forcing ongoing ad hoc approvals.","sourceid":"id-d7a1670b-5b1f-4419-a987-19f2b699fecb","targetid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","specialization":""},{"id":"rel-flow-hiedrs-0128","type":"FlowRelationship","name":"Data Breach Report","documentation":"Content\nData Breach Report moves as a structured notification from the service desk or resolver containing affected systems, data categories, scope, and an initial severity assessment.\n\nTrigger\nDiagnose/Resolve Issues detects a security incident or unauthorised disclosure involving personal data.\n\nUnlocks\nManage Data Protection can assess breach severity, determine whether notification to the Commissioner for Information of Public Importance and Personal Data Protection is required, and coordinate response.\n\nWithout this\nBreaches would go unreported, exposing the institution to regulatory sanctions and data subjects to harm.","sourceid":"id-ebfc2ab0-2c6f-42e4-b1d7-a387d571b009","targetid":"id-f7b60e7c-3f68-40f5-9f7d-335d13dd7c1c","specialization":""},{"id":"rel-flow-hiedrs-0032","type":"FlowRelationship","name":"Data Protection Guidance","documentation":"Content\nData Protection Guidance moves as a written Advisory Response citing the Serbian Law on Personal Data Protection and the EU GDPR. It identifies the lawful basis, response deadline, redaction limits, and the data protection officer's role for the pending Data Subject Access Request.\n\nTrigger\nA student, staff member, or external party submits a Data Subject Access Request to Maintain Student Records and the office asks for interpretation or a new request reveals an unresolved point.\n\nUnlocks\nMaintain Student Records can process the Data Subject Access Request lawfully, decide what to disclose or redact, and issue the Data Correction Confirmation or a lawful refusal.\n\nWithout this\nThe record office either ignores the request, over-discloses personal data, or misses the legal deadline, exposing the institution to enforcement action and to a personal data breach.","sourceid":"id-8abb076b-05fc-4e17-8f75-51b43cf80016","targetid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","specialization":""},{"id":"flow-dom-support--manage-students","type":"FlowRelationship","name":"Data Protection Guidance","documentation":"","sourceid":"id-ae0ab1dc-95a9-4226-8013-05a65cb447de","targetid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","specialization":""},{"id":"rel-flow-hiedrs-0114","type":"FlowRelationship","name":"Data Protection Impact Assessment","documentation":"Content\nThe Data Protection Impact Assessment moves as a documented evaluation of the risks of sending foreign qualification documents to ENIC-NARIC or another external verifier, signed by the data protection officer.\n\nTrigger\nManage Data Protection conducts a DPIA when Recognize Foreign Qualifications indicates verification will involve cross-border personal data transfer.\n\nUnlocks\nRecognize Foreign Qualifications can proceed with the verification knowing the transfer is lawful and risk-mitigated.\n\nWithout this\nThe capability would be unable to send documents abroad safely, blocking authentication of foreign qualifications.","sourceid":"id-f7b60e7c-3f68-40f5-9f7d-335d13dd7c1c","targetid":"id-9475e03b-21b2-44ad-a009-25c3be831b1e","specialization":""},{"id":"rel-flow-hiedrs-0129","type":"FlowRelationship","name":"Data Subject Response","documentation":"Content\nData Subject Response moves as the formal decision from the data protection officer granting or denying a data subject's request, including required rectification, erasure, or restriction.\n\nTrigger\nManage Data Protection completes the assessment of a Data Subject Access Request and issues the response.\n\nUnlocks\nMaintain Student Records can lawfully correct, archive, or restrict personal data in the Student Record in line with the data protection officer's determination.\n\nWithout this\nA lawful data subject request would not be applied to the Student Record, leaving the institution non-compliant with the Serbian Law on Personal Data Protection and GDPR.","sourceid":"id-f7b60e7c-3f68-40f5-9f7d-335d13dd7c1c","targetid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","specialization":""},{"id":"rel-flow-hiedrs-0082","type":"FlowRelationship","name":"Declined Prospect Log","documentation":"Content\nA log of prospects who declined a solicitation, were unresponsive, or requested no further contact, produced after solicitation outcomes are recorded.\n\nTrigger\nProspects are marked declined or unresponsive during the solicitation cycle and the log is passed for record update.\n\nUnlocks\nManage Contributors can update contributor records to suppress future solicitation or mark communication restrictions for those prospects.\n\nWithout this\nManage Contributors leaves declined prospects in active segments, causing repeated unwanted outreach and data protection risk.","sourceid":"id-4ea30967-ff0b-4c5d-9d5e-1523da7907d9","targetid":"id-96bbedb3-ee3c-46fc-8623-e16a8fa4e7d2","specialization":""},{"id":"rel-flow-hiedrs-0030","type":"FlowRelationship","name":"Discount Approval Request","documentation":"Content\nDiscount Approval Request is a formal request from an account manager for a price concession, including buyer, programme, requested discount, and justification.\n\nTrigger\nA renewal or sales negotiation requires a price concession outside standard terms.\n\nUnlocks\nPrice and Commission Management can evaluate the request against pricing policy, approve or reject it, and issue a Discount Authorization if approved.\n\nWithout this\nAccount managers lack a governed path for price concessions, forcing either lost deals or unauthorised discounts.","sourceid":"id-e5bf6235-0851-40cc-9e21-86b9fbcaac81","targetid":"id-a711bf13-8d88-4d21-8410-ab448500566a","specialization":""},{"id":"rel-flow-hiedrs-0020","type":"FlowRelationship","name":"Discount Authorization","documentation":"Content\nDiscount Authorization is an approved authority for a specific discount, including buyer, programme, conditions, maximum percentage, and required signoff.\n\nTrigger\nA discount request is approved after the required institutional signoff.\n\nUnlocks\nAccount Management can include the discount in contract renewal negotiations and offer a lawful, governed price concession.\n\nWithout this\nAccount managers either lose the deal by refusing a discount or make unauthorised concessions that erode margin and violate pricing policy.","sourceid":"id-a711bf13-8d88-4d21-8410-ab448500566a","targetid":"id-e5bf6235-0851-40cc-9e21-86b9fbcaac81","specialization":""},{"id":"rel-flow-hiedrs-0080","type":"FlowRelationship","name":"Donor Attendance Record","documentation":"Content\nA record of attendees at a fundraising event, including their donor identity and level of interaction, produced after the event closes.\n\nTrigger\nThe fundraising event concludes and attendance data is compiled.\n\nUnlocks\nManage Contributors can update contributor profiles with event engagement and incorporate this signal into donor retention scoring and future segmentation.\n\nWithout this\nManage Contributors lacks a current engagement signal, so donor records remain incomplete and subsequent outreach ignores recent event participants.","sourceid":"id-6abc9eb9-f507-4dcf-8200-f9e870ec19a3","targetid":"id-96bbedb3-ee3c-46fc-8623-e16a8fa4e7d2","specialization":""},{"id":"rel-flow-hiedrs-0079","type":"FlowRelationship","name":"Donor Contact Record","documentation":"Content\nThe donor contact record including current contact details and recognition consent, extracted from the maintained contributor profile.\n\nTrigger\nA donor acknowledgement is due for a completed gift and the contact details must be verified.\n\nUnlocks\nAcknowledge Donors can retrieve the correct contact record and consent status to compose a personalized acknowledgement matching donor intent.\n\nWithout this\nAcknowledge Donors acknowledges with outdated contact data or without proper recognition consent, causing privacy complaints and impersonal thanks.","sourceid":"id-96bbedb3-ee3c-46fc-8623-e16a8fa4e7d2","targetid":"id-a4637e89-2929-4077-a22a-d756585cb025","specialization":""},{"id":"rel-flow-hiedrs-0070","type":"FlowRelationship","name":"ECTS Credit Allocation","documentation":"Content\nThe table mapping each course to its ECTS credit weight and the total 60 ECTS per year, derived from the accredited study programme.\n\nTrigger\nThe accredited programme is published and course selection begins for the term.\n\nUnlocks\nEnroll in Classes can apply the ECTS credit load when registering a student and reject selections that exceed or fall below the permitted workload.\n\nWithout this\nEnroll in Classes cannot enforce the 60 ECTS workload, so students may register for an invalid credit load that threatens progression and accreditation compliance.","sourceid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","targetid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","specialization":""},{"id":"rel-flow-hiedrs-0065","type":"FlowRelationship","name":"Emergency Financial Support Decision","documentation":"Content\nA decision awarding or denying emergency financial support to a student, including the amount and source of funds, made after evaluating the Financial Aid Application.\n\nTrigger\nA student in acute financial hardship submits an application and the assistance office completes its evaluation.\n\nUnlocks\nAward and Monitor Financial Aid can incorporate the emergency support into the student's overall aid package and disburse the funds without double-counting.\n\nWithout this\nAward and Monitor Financial Aid either ignores a student's emergency need or pays it separately from unverified sources, breaking the single view of aid and risking overpayment.","sourceid":"id-4a109615-89b7-4d83-9527-666fb431ad35","targetid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","specialization":""},{"id":"rel-flow-hiedrs-0085","type":"FlowRelationship","name":"Endowment Fund Annual Report","documentation":"Content\nThe endowment fund annual report showing principal balance, income distribution, and compliance with donor restrictions for each endowed fund, produced at period close.\n\nTrigger\nThe endowment reporting period closes and the annual report is issued to donors and internal stakeholders.\n\nUnlocks\nManage Contributors can update donor engagement records with evidence of endowment stewardship and adjust donor retention scores for endowment donors.\n\nWithout this\nManage Contributors lacks stewardship proof, misclassifies endowment donors as disengaged, and retention scores for long-term relationships are wrong.","sourceid":"id-a398a43a-7375-47d1-af1b-49bf78188b6c","targetid":"id-96bbedb3-ee3c-46fc-8623-e16a8fa4e7d2","specialization":""},{"id":"rel-flow-hiedrs-0050","type":"FlowRelationship","name":"Engagement Metric Set","documentation":"Content\nEngagement Metric Set produced by campaign execution contains clicks, opens, event attendance, video views and social interactions attributable to a prospect or campaign.\n\nTrigger\nCampaign activity occurs and engagement metrics are logged.\n\nUnlocks\nSegment Customers can use observed engagement signals as Behavioural Data to update segment membership, lead scores and conversion predictions.\n\nWithout this\nSegmentation relies only on declared data and cannot adapt to observed prospect engagement.","sourceid":"id-c442ac23-7d84-40ae-83f0-05cbdd824769","targetid":"id-6f1e97f2-f962-4853-b211-ad1f254d6ecc","specialization":""},{"id":"rel-flow-hiedrs-0091","type":"FlowRelationship","name":"Enrollment Confirmation","documentation":"Content\nEnrollment Confirmation for a student registered in specific courses for the term, including ECTS credit load and study programme.\n\nTrigger\nStudent course registration is completed and confirmed.\n\nUnlocks\nBill Customer or Payor can determine fee status and calculate charges based on confirmed enrolment.\n\nWithout this\nBilling has no basis for charges, so the student cannot be invoiced and payments cannot be allocated.","sourceid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","targetid":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","specialization":""},{"id":"rel-flow-hiedrs-0092","type":"FlowRelationship","name":"Enrollment Confirmation","documentation":"Content\nEnrollment Confirmation showing the student is registered for the term and the confirmed credit load.\n\nTrigger\nCourse registration completed.\n\nUnlocks\nAward and Monitor Financial Aid can verify enrolment before disbursing scholarships or state-funded support, and can adjust aid based on actual credit load.\n\nWithout this\nAid disbursement is paused or made blind, risking payment to non-enrolled students or incorrect aid amounts.","sourceid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","targetid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","specialization":""},{"id":"rel-flow-hiedrs-0093","type":"FlowRelationship","name":"Enrollment Confirmation","documentation":"Content\nEnrollment Confirmation with course registrations, credit load and term details.\n\nTrigger\nRegistration finalised.\n\nUnlocks\nMaintain Student Records can update the master Student Record with current enrolment status and ECTS progress.\n\nWithout this\nThe student record shows the student as admitted but not enrolled, so academic progress and status confirmations are incomplete.","sourceid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","targetid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","specialization":""},{"id":"rel-flow-hiedrs-0105","type":"FlowRelationship","name":"Enrollment Confirmation","documentation":"Content\nEnrollment Confirmation showing registered courses and confirmed ECTS credit load for the term, used to set or update payment obligations in the financial relationship.\n\nTrigger\nStudent course registration is completed and confirmed.\n\nUnlocks\nManage Financial Relationships can verify that the obligation corresponds to an enrolled term and avoid recording charges for a student not actively registered.\n\nWithout this\nFinancial relationship obligations may be created without confirmed enrolment, leading to incorrect payor contracts.","sourceid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","targetid":"id-b334c94a-a2ff-449e-869e-70a0960b4aca","specialization":""},{"id":"rel-flow-hiedrs-0012","type":"FlowRelationship","name":"Enrolment Target Plan","documentation":"Content\nThe Enrolment Target Plan leaves Define Marketing Strategy as an approved, programme-level set of intake targets by funding type for the recruitment cycle, aligned to state-funded quotas and self-financing capacity.\n\nTrigger\nMarketing strategy is approved or an enrolment quota decision is published.\n\nUnlocks\nSales Planning and Forecasting can allocate sold quota by programme and channel, set sales targets and align revenue forecasts with the institution's enrolment goals.\n\nWithout this\nSales planning would have no marketing-derived intake goals, forcing it to forecast solely from historical sales and miss strategic shifts.","sourceid":"id-b08a3dbb-d42a-4bcc-b7c2-eab26c498651","targetid":"id-52f6b145-944f-43d6-8dff-7f43ef37bc51","specialization":""},{"id":"flow-dom-marketing--sales","type":"FlowRelationship","name":"Enrolment Target Plan","documentation":"","sourceid":"id-bd24036d-055c-476f-8c7c-ada1e2d8ebac","targetid":"id-d282e41f-2f23-4160-9a6f-d9401cc14f2a","specialization":""},{"id":"rel-flow-hiedrs-0044","type":"FlowRelationship","name":"Event Schedule","documentation":"Content\nEvent Schedule leaves Plan Programs as a confirmed schedule of open day and information events, with dates, venues, and programme focus, aligned with the academic calendar and approved plan.\n\nTrigger\nA planned campaign reaches its execution phase and events are due.\n\nUnlocks\nExecute Programs can organise open day and information events, coordinate logistics, publish social content and distribute materials on time.\n\nWithout this\nExecution would have no confirmed event dates or venues; promotional events would be uncoordinated and prospective student engagement would be missed.","sourceid":"id-85305cf8-0cba-49a6-a668-a99f37128a68","targetid":"id-c442ac23-7d84-40ae-83f0-05cbdd824769","specialization":""},{"id":"rel-flow-hiedrs-0048","type":"FlowRelationship","name":"Event Schedule","documentation":"Content\nEvent Schedule for recruiting events, with dates, venues, target segments and assigned staff, produced from the recruitment plan.\n\nTrigger\nRecruitment plan approved and event logistics coordinated.\n\nUnlocks\nExecute Programs can run the scheduled recruiting events as part of the promotional campaign and capture prospective student leads.\n\nWithout this\nMarketing execution lacks confirmed events, so open days and information sessions cannot be delivered or promoted.","sourceid":"id-f02c8a55-396b-4810-ab8a-cea744018b10","targetid":"id-c442ac23-7d84-40ae-83f0-05cbdd824769","specialization":""},{"id":"flow-dom-manage-students--marketing","type":"FlowRelationship","name":"Event Schedule","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-bd24036d-055c-476f-8c7c-ada1e2d8ebac","specialization":""},{"id":"rel-flow-hiedrs-0107","type":"FlowRelationship","name":"Evidence File for Accreditation","documentation":"Content\nThe Evidence File for Accreditation moves from Effectiveness as a structured package of course evaluation summaries, grade distribution reports, and graduate employment findings tied to ESG 2015 Part 1.\n\nTrigger\nEffectiveness finishes its annual effectiveness analysis or a programme review cycle closes.\n\nUnlocks\nManage Accreditation can attach verified internal quality-assurance evidence to the annual self-evaluation and accreditation renewal submissions.\n\nWithout this\nManage Accreditation would assemble a self-evaluation without raw performance data, leaving it unable to demonstrate the quality cycle NAT and ESG 2015 require.","sourceid":"id-8b80a6ea-0dfa-4673-9eab-027449e3bf84","targetid":"id-a6bbc833-d30e-460f-9df3-0ebe783e8f43","specialization":""},{"id":"rel-flow-hiedrs-0001","type":"FlowRelationship","name":"Executed Grant Agreement","documentation":"Content\nThe signed grant agreement with start date, budget ceiling, statement of work, deliverable milestones, payment schedule, and indirect cost rate, in force once both sponsor and institutional signatory have signed.\n\nTrigger\nBoth the sponsor and the authorized institutional signatory sign the grant agreement.\n\nUnlocks\nManage Project can assign project roles, begin work against the budget and milestones, and establish the project record.\n\nWithout this\nThe project manager cannot authorize any grant-funded activity, no budget lines are available, and no milestone schedule exists to track delivery.","sourceid":"id-59c01b9a-4dd2-4265-bb01-11c8157b4d2b","targetid":"id-fea4c7b7-058d-4326-a804-3451a3d9276e","specialization":""},{"id":"rel-flow-hiedrs-0002","type":"FlowRelationship","name":"Executed Grant Agreement","documentation":"Content\nThe signed grant agreement with budget categories, payment conditions, and sponsor reference details, delivered to the billing office.\n\nTrigger\nThe grant agreement is executed and the billing unit is notified to set up invoicing.\n\nUnlocks\nBill Sponsor can verify allowable costs against the agreement's budget lines, calculate sponsor share, and issue invoices that match sponsor payment terms.\n\nWithout this\nThe billing unit lacks the legal basis to allocate costs or issue invoices, so no sponsor payment can be requested.","sourceid":"id-59c01b9a-4dd2-4265-bb01-11c8157b4d2b","targetid":"id-1db93bd4-1dfe-459a-8324-c55dee07ec4f","specialization":""},{"id":"rel-flow-hiedrs-0003","type":"FlowRelationship","name":"Executed Grant Agreement","documentation":"Content\nThe signed grant agreement in force, including sponsor terms, reporting deadlines, ethics approvals, and data protection clauses.\n\nTrigger\nExecution of the grant agreement triggers distribution to the compliance function for baseline records.\n\nUnlocks\nMonitor Compliance can test every expense, activity report, and data protection record against the specific sponsor terms and applicable law.\n\nWithout this\nThe compliance function has no standard to detect violations, so noncompliance may go unnoticed until a sponsor audit.","sourceid":"id-59c01b9a-4dd2-4265-bb01-11c8157b4d2b","targetid":"id-23e7115f-0500-4038-95a8-21e2597ef3b0","specialization":""},{"id":"rel-flow-hiedrs-0039","type":"FlowRelationship","name":"Expense Record","documentation":"Content\nExpense Record produced by campaign execution captures each campaign cost against a budget line and campaign identifier, ready for profitability allocation.\n\nTrigger\nA campaign period closes or marketing activity incurs expenses.\n\nUnlocks\nProfitability Analysis can aggregate Expense Records into Marketing Cost Data and calculate cost per enrolled student and programme margin by allocating marketing costs to programmes.\n\nWithout this\nProfitability cannot accurately allocate marketing spend; programme margin and ROI calculations are incomplete and may understate or overstate profitability.","sourceid":"id-c442ac23-7d84-40ae-83f0-05cbdd824769","targetid":"id-05994d0d-610b-45e2-b8c2-a60663547d24","specialization":""},{"id":"rel-flow-hiedrs-0074","type":"FlowRelationship","name":"Gift Notification","documentation":"Content\nA notification of a verified gift payment, carrying donor identity, amount, fund designation, legal entity and gift receipt reference, issued when a bank payment is reconciled to a pledge.\n\nTrigger\nA bank confirmation is reconciled to an open pledge item and the gift notification is issued.\n\nUnlocks\nAcknowledge Donors can match the gift notification to the pledge payment confirmation and produce a personalised acknowledgement letter.\n\nWithout this\nAcknowledge Donors lacks proof of the completed gift, cannot issue timely acknowledgement, and donor trust declines.","sourceid":"id-54df2c7e-67f4-4959-8243-c1c192a5cf63","targetid":"id-a4637e89-2929-4077-a22a-d756585cb025","specialization":""},{"id":"rel-flow-hiedrs-0059","type":"FlowRelationship","name":"Grade Report","documentation":"Content\nThe aggregated set of course grades and pass rates for a study programme, extracted from the official Student Record after the examination period.\n\nTrigger\nThe examination period ends and grade reports are generated for all enrolled students.\n\nUnlocks\nEffectiveness can analyse grade distribution to detect anomalies in pass rates and link learning outcomes to actual student achievement.\n\nWithout this\nEffectiveness has no quantitative evidence of learning outcomes, making the Academic Program Effectiveness Report anecdotal and unable to justify quality improvement.","sourceid":"id-8fcac125-67c1-46c5-b3a6-0cb03f136833","targetid":"id-8b80a6ea-0dfa-4673-9eab-027449e3bf84","specialization":""},{"id":"rel-flow-hiedrs-0127","type":"FlowRelationship","name":"Graduation Register Entry","documentation":"Content\nGraduation Register Entry moves as the official record that a diploma and supplement were issued, including the date, programme, cycle, and graduate identity.\n\nTrigger\nIssue Diplomas records graduation after verifying all requirements and issuing the credential.\n\nUnlocks\nMaintain Student Records can update the student's final status and archive the completion of studies in the master record.\n\nWithout this\nThe master record would never reflect graduation, leaving the student as an active or incomplete record and corrupting downstream statistics.","sourceid":"id-7867ed7a-a6c0-499b-a13e-41619962e307","targetid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","specialization":""},{"id":"rel-flow-hiedrs-0004","type":"FlowRelationship","name":"Grant Award Record","documentation":"Content\nThe official award record identifying the grant, sponsor, budget ceiling, cost share requirements, and institutional ownership under the correct legal entity.\n\nTrigger\nThe award is recorded upon execution of the grant agreement.\n\nUnlocks\nReceive Funding can match incoming sponsor payments to the correct award and ensure public and sponsor funds remain separately allocated.\n\nWithout this\nIncoming payments cannot be attributed to a grant, and funds may be posted to the wrong budget or violate public finance traceability.","sourceid":"id-59c01b9a-4dd2-4265-bb01-11c8157b4d2b","targetid":"id-51cd6874-501c-40ec-b797-8d46bc6d2240","specialization":""},{"id":"rel-flow-hiedrs-0100","type":"FlowRelationship","name":"Housing Contract","documentation":"Content\nHousing Contract signed by the student and housing office, stating assignment, period, fees and meal plan if applicable.\n\nTrigger\nRoom assigned and contract issued.\n\nUnlocks\nBill Customer or Payor can add housing and meal charges to the student's account and include them in the next invoice.\n\nWithout this\nHousing charges are not billed, revenue is lost and the student account is incomplete.","sourceid":"id-3c048211-0449-40be-a766-678a749f7390","targetid":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","specialization":""},{"id":"rel-flow-hiedrs-0076","type":"FlowRelationship","name":"Initial Gift Principal","documentation":"Content\nA verified endowment gift receipt carrying the initial principal amount and the donor's fund restriction, produced when a gift is designated to establish an endowed fund.\n\nTrigger\nA donor's endowment gift payment is reconciled and found to match a signed endowment charter or gift agreement.\n\nUnlocks\nManage Endowments can record the initial principal and establish the endowment fund in compliance with donor restrictions.\n\nWithout this\nManage Endowments cannot establish the endowment, the fund does not exist, and donor restrictions cannot be honored until the gift is re-processed.","sourceid":"id-54df2c7e-67f4-4959-8243-c1c192a5cf63","targetid":"id-a398a43a-7375-47d1-af1b-49bf78188b6c","specialization":""},{"id":"rel-flow-hiedrs-0031","type":"FlowRelationship","name":"Knowledge Articles","documentation":"Content\nKnowledge Articles are updated by Diagnose/Resolve Issues after a root cause is established and a tested fix is documented. Each article leaves containing the symptom, affected service, resolution steps, and any restriction on personal data imposed by the Serbian Law on Personal Data Protection.\n\nTrigger\nA new problem is resolved or a recurring Issue Report reveals a solution not already present in the knowledge base.\n\nUnlocks\nProvide Information and Advice can search and retrieve the current article to answer an incoming inquiry with a verified answer instead of improvising guidance.\n\nWithout this\nFrontline staff answer from stale or absent information, misdirect students and staff, and escalate ordinary questions that the resolved article would have closed.","sourceid":"id-ebfc2ab0-2c6f-42e4-b1d7-a387d571b009","targetid":"id-8abb076b-05fc-4e17-8f75-51b43cf80016","specialization":""},{"id":"rel-flow-hiedrs-0028","type":"FlowRelationship","name":"Lead Record","documentation":"Content\nLead Record captures a prospective student's contact data, consent status, programme interest, and source campaign from Execute Programs.\n\nTrigger\nA marketing campaign or event produces a new prospective student inquiry.\n\nUnlocks\nLead and Opportunity Management can qualify, score, and convert the lead into an Opportunity Record or reject incomplete contact data.\n\nWithout this\nNo new leads enter the sales pipeline, so no opportunities are created and future enrollment contracts stall.","sourceid":"id-c442ac23-7d84-40ae-83f0-05cbdd824769","targetid":"id-a609d67d-c8e5-42b1-86fb-23647dc01b52","specialization":""},{"id":"rel-flow-hiedrs-0038","type":"FlowRelationship","name":"Lead Record","documentation":"Content\nLead Record produced by campaign execution contains prospective student identity, source campaign, contact consent, inquiry details and timestamp. It leaves Execute Programs in a valid, consent-flagged state.\n\nTrigger\nA prospective student submits an inquiry or attends an event and is logged by Execute Programs.\n\nUnlocks\nMeasure Program Effectiveness can track conversion from lead to application to enrolment, attribute enrolments to specific campaigns, and compute conversion funnel and ROI.\n\nWithout this\nMeasure cannot link campaign activity to enrolment outcomes; attribution and ROI are impossible, leaving budget decisions blind.","sourceid":"id-c442ac23-7d84-40ae-83f0-05cbdd824769","targetid":"id-4d75a20e-4723-4e0a-b0f8-c439ccd4037f","specialization":""},{"id":"rel-flow-hiedrs-0046","type":"FlowRelationship","name":"Lead Scoring Model","documentation":"Content\nLead Scoring Model produced by Segment Customers contains rules and weights for prioritizing prospective student leads based on behaviour, demographics and programme interest, validated against enrolment outcomes.\n\nTrigger\nA new recruitment cycle begins and leads require prioritization.\n\nUnlocks\nExecute Programs can decide which prospects to target first, focus events and advertisements on high-scoring leads, and allocate follow-up effort efficiently.\n\nWithout this\nExecute would contact all leads indiscriminately, lowering conversion and wasting budget.","sourceid":"id-6f1e97f2-f962-4853-b211-ad1f254d6ecc","targetid":"id-c442ac23-7d84-40ae-83f0-05cbdd824769","specialization":""},{"id":"rel-flow-hiedrs-0034","type":"FlowRelationship","name":"Maintenance Escalation","documentation":"Content\nAn escalation from the resource scheduling function reporting that a laboratory, studio, or equipment item is faulty and cannot be reserved for a scheduled course session.\n\nTrigger\nA scheduled resource becomes unavailable due to malfunction or safety failure, preventing its use.\n\nUnlocks\nDiagnose/Resolve Issues can log the escalation as an Issue Report, diagnose the underlying fault, and dispatch a maintenance remedy to restore the resource.\n\nWithout this\nDiagnose/Resolve Issues remains unaware of the equipment failure, so the resource stays out of service and practical teaching is cancelled without a repair workflow.","sourceid":"id-cbacfae9-ac1b-47fa-9b0f-25a035e0e5c8","targetid":"id-ebfc2ab0-2c6f-42e4-b1d7-a387d571b009","specialization":""},{"id":"flow-dom-manage-academics--support","type":"FlowRelationship","name":"Maintenance Escalation","documentation":"","sourceid":"id-b3783a69-5a26-4c8c-b0dc-f13ebb34baf9","targetid":"id-ae0ab1dc-95a9-4226-8013-05a65cb447de","specialization":""},{"id":"rel-flow-hiedrs-0036","type":"FlowRelationship","name":"Maintenance Work Order","documentation":"Content\nMaintenance Work Order moves from housing and auxiliary services to issue resolution when a room, residence facility, or auxiliary service area has a defect that requires diagnosis. It carries the requester, location, symptom, and initial housing service assessment.\n\nTrigger\nA student or staff member reports a fault through housing services, or a scheduled inspection finds a defect.\n\nUnlocks\nDiagnose/Resolve Issues can use the work order as a Maintenance Record or convert it into an Issue Report, then dispatch the appropriate remedy.\n\nWithout this\nFacility defects reported to housing remain outside the issue-resolution queue, causing duplicated effort and unresolved defects in accommodation and auxiliary spaces.","sourceid":"id-3c048211-0449-40be-a766-678a749f7390","targetid":"id-ebfc2ab0-2c6f-42e4-b1d7-a387d571b009","specialization":""},{"id":"rel-flow-hiedrs-0026","type":"FlowRelationship","name":"Market Research Report","documentation":"Content\nMarket Research Report contains demand forecasts, competitor benchmarks, segment profiles, and enrolment trend analysis from Market Research and Analysis, including programme-level applicant demand projections.\n\nTrigger\nA research project is completed or new enrolment data is analysed.\n\nUnlocks\nSales Planning and Forecasting can estimate market demand, set sales targets, and allocate quota using current market evidence rather than only historical sales.\n\nWithout this\nSales planning lacks external market demand evidence, making revenue forecasts and quota allocation vulnerable to enrolment shifts.","sourceid":"id-99e8ec1c-bd58-4c5a-b20b-ac6b885c1253","targetid":"id-52f6b145-944f-43d6-8dff-7f43ef37bc51","specialization":""},{"id":"rel-flow-hiedrs-0041","type":"FlowRelationship","name":"Market Research Report","documentation":"Content\nThe final Market Research Report leaves analysis in final form, containing survey responses, enrolment trend analysis, competitor benchmarks, demand forecasts and brand perception findings, cleaned and validated.\n\nTrigger\nA research project concludes and the report is issued.\n\nUnlocks\nDefine Marketing Strategy can assess demand for each accredited programme, define target segments, set enrolment targets and allocate budget based on evidence.\n\nWithout this\nDefine would set strategy blind, without data on demand, competitors or perception, risking misallocated budget and missed quota.","sourceid":"id-99e8ec1c-bd58-4c5a-b20b-ac6b885c1253","targetid":"id-b08a3dbb-d42a-4bcc-b7c2-eab26c498651","specialization":""},{"id":"rel-flow-hiedrs-0042","type":"FlowRelationship","name":"Market Research Report","documentation":"Content\nThe current Market Research Report is supplied to Plan Programs in its validated form, with programme demand, target segments and enrolment trend evidence.\n\nTrigger\nPlan Programs begins annual planning or a campaign plan is requested.\n\nUnlocks\nPlan Programs can align campaign calendar, event schedule and content with evidence on segments, demand and enrolment trends.\n\nWithout this\nPlan Programs would schedule activities without knowing where demand is, leading to poorly timed or targeted campaigns.","sourceid":"id-99e8ec1c-bd58-4c5a-b20b-ac6b885c1253","targetid":"id-85305cf8-0cba-49a6-a668-a99f37128a68","specialization":""},{"id":"rel-flow-hiedrs-0040","type":"FlowRelationship","name":"Marketing Campaign Result","documentation":"Content\nAggregated Marketing Campaign Result produced from advertisements, open days, social media and brochures consists of engagement metrics, leads and event outcomes, with source campaign identifiers.\n\nTrigger\nAt the end of a campaign or when a lead batch is collected.\n\nUnlocks\nRecruit Prospects can capture prospect inquiries, create qualified leads, and send subsequent recruitment communication because the result identifies prospects and interest source.\n\nWithout this\nRecruit Prospects lacks incoming inquiries to nurture; it would have no raw prospects and would fail to build a pipeline.","sourceid":"id-c442ac23-7d84-40ae-83f0-05cbdd824769","targetid":"id-42e5f948-24cb-4fd9-8dcd-d99ec588dcef","specialization":""},{"id":"flow-dom-marketing--manage-students","type":"FlowRelationship","name":"Marketing Campaign Result","documentation":"","sourceid":"id-bd24036d-055c-476f-8c7c-ada1e2d8ebac","targetid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","specialization":""},{"id":"rel-flow-hiedrs-0037","type":"FlowRelationship","name":"Marketing Strategy Document","documentation":"Content\nThe approved Marketing Strategy Document moves from strategic definition to operational planning in final form, setting programme demand assessment, target segments, channel mix, budget allocation and enrolment targets.\n\nTrigger\nThe annual planning cycle begins or a new intake cycle is declared.\n\nUnlocks\nPlan Programs can develop the campaign calendar, schedule content, allocate resources and obtain plan approvals for specific programmes because the strategy gives direction and constraints.\n\nWithout this\nPlan Programs would plan campaigns without enrolment targets, segment focus or budget limits, producing disconnected promotional activities.","sourceid":"id-b08a3dbb-d42a-4bcc-b7c2-eab26c498651","targetid":"id-85305cf8-0cba-49a6-a668-a99f37128a68","specialization":""},{"id":"rel-flow-hiedrs-0005","type":"FlowRelationship","name":"Milestone Completion Certificate","documentation":"Content\nA certificate stating the milestone number from the grant agreement, confirmation the deliverable was accepted, and the date of completion, signed by the project manager.\n\nTrigger\nA project milestone is completed, reviewed, and accepted by the project manager.\n\nUnlocks\nBill Sponsor can prepare and submit a milestone-based Payment Request to the sponsor for payment.\n\nWithout this\nThe billing unit cannot request milestone payments, so cash for the project is delayed and the sponsor may not recognize progress.","sourceid":"id-fea4c7b7-058d-4326-a804-3451a3d9276e","targetid":"id-1db93bd4-1dfe-459a-8324-c55dee07ec4f","specialization":""},{"id":"rel-flow-hiedrs-0023","type":"FlowRelationship","name":"Opportunity Record","documentation":"Content\nOpportunity Record is the won deal record containing buyer identity, programme or service, agreed terms, and transition details from Lead and Opportunity Management.\n\nTrigger\nAn opportunity is closed as won and handed to account management.\n\nUnlocks\nAccount Management can create a new Account Record, initiate onboarding, and begin post-sale relationship management for the customer.\n\nWithout this\nNewly acquired customers have no account record, so billing, renewals, and service support are delayed or duplicated.","sourceid":"id-a609d67d-c8e5-42b1-86fb-23647dc01b52","targetid":"id-e5bf6235-0851-40cc-9e21-86b9fbcaac81","specialization":""},{"id":"rel-flow-hiedrs-0102","type":"FlowRelationship","name":"Payor Authorization","documentation":"Content\nPayor Authorization identifying who is authorised to pay for a self-financing student and the financial relationship details.\n\nTrigger\nFinancial relationship set up or payor confirmed for a student.\n\nUnlocks\nBill Customer or Payor can direct the invoice to the correct payor and apply payment obligations under the authorised relationship.\n\nWithout this\nBilling cannot issue an invoice to the right party, leading to unpaid charges or disputes.","sourceid":"id-b334c94a-a2ff-449e-869e-70a0960b4aca","targetid":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","specialization":""},{"id":"rel-flow-hiedrs-0073","type":"FlowRelationship","name":"Pledged Gift Agreement","documentation":"Content\nA signed pledge agreement produced by a completed fundraising campaign or event, including donor identity, amount, payment schedule, fund designation, and signatory from the correct legal entity.\n\nTrigger\nA donor signs the pledge after solicitation, or a pledge committed during an event is finalized.\n\nUnlocks\nManage Pledges and Gifts can record the pledge commitment, establish a Pledge Receivable Record, and schedule payment reminders.\n\nWithout this\nManage Pledges and Gifts has no legally binding commitment to record, revenue is unrecognized, no payments are scheduled, and the donor has no follow-up.","sourceid":"id-6abc9eb9-f507-4dcf-8200-f9e870ec19a3","targetid":"id-54df2c7e-67f4-4959-8243-c1c192a5cf63","specialization":""},{"id":"rel-flow-hiedrs-0081","type":"FlowRelationship","name":"Pledged Gift Agreement","documentation":"Content\nThe signed pledge agreement with donor identity, fund designation, and gift purpose, produced when a campaign or event secures a pledge.\n\nTrigger\nA pledge agreement is finalized before the gift payment arrives and acknowledgement later needs the gift terms.\n\nUnlocks\nAcknowledge Donors can confirm the fund designation against the gift agreement when a gift receipt is later matched to the pledge.\n\nWithout this\nAcknowledge Donors cannot verify the fund designation and issues an acknowledgement with the wrong fund, damaging donor trust and auditability.","sourceid":"id-6abc9eb9-f507-4dcf-8200-f9e870ec19a3","targetid":"id-a4637e89-2929-4077-a22a-d756585cb025","specialization":""},{"id":"rel-flow-hiedrs-0013","type":"FlowRelationship","name":"Price List","documentation":"Content\nThe current approved Price List for each accredited study programme and service, showing self-financing tuition and the distinction from state-funded places. It is fully authorised and versioned when it leaves Price and Commission Management.\n\nTrigger\nA fee governance decision is approved or a recruitment cycle begins.\n\nUnlocks\nMulti-Channel Sales can publish the Price List to each channel, validate incoming customer orders against correct fees, and compute channel commissions for completed sales.\n\nWithout this\nMulti-Channel Sales quotes outdated or conflicting fees, causing customer refusals, pricing disputes, and invalid sales orders.","sourceid":"id-a711bf13-8d88-4d21-8410-ab448500566a","targetid":"id-8ef1a7e0-4d0f-4e57-bcf7-50501651842d","specialization":""},{"id":"rel-flow-hiedrs-0025","type":"FlowRelationship","name":"Price List","documentation":"Content\nPrice List is the approved tuition fee schedule for self-financing and contract services, including fee per ECTS, programme, and payment terms, issued by Price and Commission Management.\n\nTrigger\nFees are approved or revised before the billing cycle begins.\n\nUnlocks\nBill Customer or Payor can calculate tuition charges, apply the correct funding-status distinction, and issue accurate invoices.\n\nWithout this\nBilling uses outdated or inconsistent fee data, producing incorrect invoices, student disputes, and revenue leakage.","sourceid":"id-a711bf13-8d88-4d21-8410-ab448500566a","targetid":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","specialization":""},{"id":"rel-flow-hiedrs-0106","type":"FlowRelationship","name":"Program Evaluation Report","documentation":"Content\nThe Program Evaluation Report moves as a written assessment of a study programme against accreditation criteria, signed by internal reviewers and containing strengths, weaknesses, and a recommendation. It leaves Evaluate Academic Program after internal review, with mandatory sections and traceable evidence.\n\nTrigger\nEvaluation of a programme is completed because accreditation renewal or internal review is due.\n\nUnlocks\nManage Accreditation can assemble the accreditation application and self-evaluation with an evidence-based internal review rather than only raw documentation.\n\nWithout this\nManage Accreditation would have to rely on unassessed programme documentation and could submit an accreditation file with unknown gaps, risking NAT rejection.","sourceid":"id-d8e4c197-826c-4d16-8f57-a29cd7b40c14","targetid":"id-a6bbc833-d30e-460f-9df3-0ebe783e8f43","specialization":""},{"id":"rel-flow-hiedrs-0060","type":"FlowRelationship","name":"Program Revision Recommendation","documentation":"Content\nA formal recommendation identifying gaps between the current accredited programme and NAT or ESG 2015 standards, with suggestions for curriculum changes.\n\nTrigger\nThe internal program evaluation finds that a learning outcome, ECTS allocation, or staff qualification requirement is not met.\n\nUnlocks\nPlan Curriculum and Courses can draft a Study Programme Proposal for revision, adjusting courses, ECTS credits, or staffing to bring the programme back into compliance.\n\nWithout this\nPlan Curriculum and Courses does not know which parts of the programme have failed evaluation, so revisions miss critical gaps and the programme risks losing accreditation.","sourceid":"id-d8e4c197-826c-4d16-8f57-a29cd7b40c14","targetid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","specialization":""},{"id":"rel-flow-hiedrs-0045","type":"FlowRelationship","name":"Programme Margin Analysis","documentation":"Content\nProgramme Margin Analysis from profitability calculation contains margin per study programme by funding type, separating state-funded and self-financing places, and showing cost per enrolment.\n\nTrigger\nFinancial records for a period close and profitability review is requested.\n\nUnlocks\nDefine Marketing Strategy can shift marketing budget and enrolment targets toward programmes with sustainable margins and away from loss-making programmes.\n\nWithout this\nStrategy would allocate budget without knowledge of which programmes generate net revenue, risking overpromotion of low-margin programmes and quota waste.","sourceid":"id-05994d0d-610b-45e2-b8c2-a60663547d24","targetid":"id-b08a3dbb-d42a-4bcc-b7c2-eab26c498651","specialization":""},{"id":"rel-flow-hiedrs-0006","type":"FlowRelationship","name":"Project Progress Report","documentation":"Content\nA report covering work performed in the period, milestone completion status, budget variance explanation, and next-period plan, signed by the responsible academic.\n\nTrigger\nThe sponsor-required reporting period closes and the project manager submits the progress report.\n\nUnlocks\nMonitor Compliance can check that activities match the agreed work plan, reporting deadlines are met, and deviations are identified for corrective action.\n\nWithout this\nThe compliance function cannot assess whether the project is performing within the grant terms and must rely on unaudited verbal assurances.","sourceid":"id-fea4c7b7-058d-4326-a804-3451a3d9276e","targetid":"id-23e7115f-0500-4038-95a8-21e2597ef3b0","specialization":""},{"id":"rel-flow-hiedrs-0000","type":"FlowRelationship","name":"Proposal","documentation":"Content\nThe final technical narrative and budget packet, internally endorsed, with the sponsor's required annexes and signatures, in submission-ready state.\n\nTrigger\nThe application is certified complete by the proposal team and assigned for institutional review and potential award acceptance.\n\nUnlocks\nApproval and Award can compare sponsor terms to the proposed scope and budget, decide whether terms are acceptable, and prepare for contract negotiation.\n\nWithout this\nThere is no agreed technical and financial baseline, so Approval and Award cannot determine if the eventual award deviates from what was proposed or whether institutional endorsements cover the work.","sourceid":"id-a1b2e963-145c-42d9-a3b0-fdaff60f0fc3","targetid":"id-59c01b9a-4dd2-4265-bb01-11c8157b4d2b","specialization":""},{"id":"rel-flow-hiedrs-0083","type":"FlowRelationship","name":"Proposal for Major Gift","documentation":"Content\nA signed major gift proposal setting out the donor's intended amount, fund designation, payment schedule, and signatory, produced after the donor accepts the proposal.\n\nTrigger\nThe donor signs the major gift proposal and the solicitor returns it for gift processing.\n\nUnlocks\nManage Pledges and Gifts can record the signed proposal as a pledge commitment, create the receivable, and begin payment scheduling.\n\nWithout this\nManage Pledges and Gifts cannot record the major gift pledge; the commitment remains only in the solicitor's notes and no receivable is established.","sourceid":"id-4ea30967-ff0b-4c5d-9d5e-1523da7907d9","targetid":"id-54df2c7e-67f4-4959-8243-c1c192a5cf63","specialization":""},{"id":"rel-flow-hiedrs-0049","type":"FlowRelationship","name":"Prospect Record","documentation":"Content\nProspect Record with contact details, consent flag, source, interests and interaction history, usable as prospective student data for segmentation.\n\nTrigger\nA new prospect record is created or updated.\n\nUnlocks\nSegment Customers can group prospects into actionable segments, score leads and assign them to targeted marketing campaigns.\n\nWithout this\nSegmentation lacks raw prospect data, forcing campaigns to target undifferentiated audiences with poor results.","sourceid":"id-42e5f948-24cb-4fd9-8dcd-d99ec588dcef","targetid":"id-6f1e97f2-f962-4853-b211-ad1f254d6ecc","specialization":""},{"id":"rel-flow-hiedrs-0101","type":"FlowRelationship","name":"Qualified Lead","documentation":"Content\nQualified Lead containing a prospective student's profile, contact consent, programme interest and readiness to apply, passed from recruitment to admissions.\n\nTrigger\nProspect is scored and meets qualification criteria.\n\nUnlocks\nAdmit Students can invite the lead to submit a formal Application for Admission and begin evaluation for a specific programme.\n\nWithout this\nAdmissions has no pipeline from recruitment and must rely on unprompted applications, missing interested prospects.","sourceid":"id-42e5f948-24cb-4fd9-8dcd-d99ec588dcef","targetid":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","specialization":""},{"id":"rel-flow-hiedrs-0062","type":"FlowRelationship","name":"Quality Improvement Plan","documentation":"Content\nA plan specifying underperforming learning outcomes, weak satisfaction dimensions, and proposed changes to teaching, assessment, or programme structure.\n\nTrigger\nThe Academic Program Effectiveness Report identifies metrics below institutional thresholds or ESG 2015 expectations.\n\nUnlocks\nPlan Curriculum and Courses can design targeted curriculum revisions that address the identified weaknesses before the next accreditation cycle.\n\nWithout this\nPlan Curriculum and Courses revises the curriculum without evidence of what is failing, perpetuating weaknesses that damage learning outcomes and accreditation.","sourceid":"id-8b80a6ea-0dfa-4673-9eab-027449e3bf84","targetid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","specialization":""},{"id":"rel-flow-hiedrs-0119","type":"FlowRelationship","name":"Ranking of Applicants","documentation":"Content\nRanking of Applicants moves as the final merit list of admitted candidates for each study programme, ordered by admission criteria and indicating qualification for budget places.\n\nTrigger\nAdmit Students completes evaluation and ranking after the admission examination or documents are assessed.\n\nUnlocks\nManage State Funding can assign state-funded places according to the approved quota and the ranking, ensuring public funds follow the most qualified applicants.\n\nWithout this\nState-funded places would be allocated without a lawful ranking, risking ministry challenge and misuse of quota.","sourceid":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","targetid":"id-58101092-095e-42fc-a263-ddc537d93a84","specialization":""},{"id":"rel-flow-hiedrs-0112","type":"FlowRelationship","name":"Recognition Decision","documentation":"Content\nRecognition Decision moves as a signed, binding decision under the Law on Higher Education stating that a foreign qualification is comparable to a Serbian study programme in the same Bologna cycle.\n\nTrigger\nA foreign qualification submitted with an application for admission has been authenticated and assessed.\n\nUnlocks\nAdmit Students can treat the applicant's prior education as verified and rank them for admission without further foreign credential checks.\n\nWithout this\nAdmit Students cannot complete admission for applicants with foreign qualifications, causing them to reject eligible applicants or admit on unverified documents.","sourceid":"id-9475e03b-21b2-44ad-a009-25c3be831b1e","targetid":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","specialization":""},{"id":"rel-flow-hiedrs-0033","type":"FlowRelationship","name":"Recognition Guidance","documentation":"Content\nRecognition Guidance moves as a written Advisory Response on the formal recognition of foreign qualifications and the current NAT accreditation status of the chosen study programme. It states whether the transcript meets Serbian admission requirements and what additional documents are needed.\n\nTrigger\nAn applicant submits an Official Academic Transcript from a foreign institution or asks whether a qualification is recognized in the Serbian system during the admission cycle.\n\nUnlocks\nAdmit Students can evaluate the foreign qualification, request the formal Recognition Decision if required, and issue a valid admission decision rather than deferring the application.\n\nWithout this\nAdmissions staff misclassify foreign qualifications, create an invalid Student Record, or reject a qualified applicant for lack of clarity on recognition.","sourceid":"id-8abb076b-05fc-4e17-8f75-51b43cf80016","targetid":"id-e7d25916-7b86-47dd-bab7-bf57aa7d5f5d","specialization":""},{"id":"rel-flow-hiedrs-0113","type":"FlowRelationship","name":"Recognition Record","documentation":"Content\nRecognition Record moves as a durable entry of the recognition decision, including the foreign qualification details, the Serbian comparability statement, and the issuing official.\n\nTrigger\nRecognize Foreign Qualifications issues a positive or negative Recognition Decision and logs it.\n\nUnlocks\nMaintain Student Records can store the recognition outcome in the student file, ensuring later transcript and diploma processes see verified prior education.\n\nWithout this\nThe student record would lack proof of qualification equivalence, and future status checks would be incomplete.","sourceid":"id-9475e03b-21b2-44ad-a009-25c3be831b1e","targetid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","specialization":""},{"id":"rel-flow-hiedrs-0017","type":"FlowRelationship","name":"Sales Order Record","documentation":"Content\nSales Order Record captures the validated buyer, programme or service, price, channel, quota confirmation, and payment terms after Multi-Channel Sales accepts an order.\n\nTrigger\nA Customer Order passes validation and a seat or cohort place is confirmed.\n\nUnlocks\nAccount Management can record the purchase history for the customer, update the account, and identify cross-sell opportunities based on the completed sale.\n\nWithout this\nAccount Management has no evidence of the sale, so the customer's purchase history remains incomplete and renewal or cross-sell decisions are made blind.","sourceid":"id-8ef1a7e0-4d0f-4e57-bcf7-50501651842d","targetid":"id-e5bf6235-0851-40cc-9e21-86b9fbcaac81","specialization":""},{"id":"rel-flow-hiedrs-0024","type":"FlowRelationship","name":"Sales Order Record","documentation":"Content\nSales Order Record from Multi-Channel Sales contains the validated payor, amount, programme or service, payment terms, and quota confirmation for a completed sale.\n\nTrigger\nA sales order is validated and a seat or place is confirmed.\n\nUnlocks\nManage Financial Relationships can set up the Financial Relationship Record and Payment Obligation linking the customer or sponsor to the institution.\n\nWithout this\nThe institution cannot establish who owes what, so billing cannot start and sold capacity is not converted into a receivable.","sourceid":"id-8ef1a7e0-4d0f-4e57-bcf7-50501651842d","targetid":"id-b334c94a-a2ff-449e-869e-70a0960b4aca","specialization":""},{"id":"flow-dom-sales--manage-students","type":"FlowRelationship","name":"Sales Order Record","documentation":"","sourceid":"id-d282e41f-2f23-4160-9a6f-d9401cc14f2a","targetid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","specialization":""},{"id":"rel-flow-hiedrs-0088","type":"FlowRelationship","name":"Scholarship Award","documentation":"Content\nScholarship Award specifying amount and source, issued from financial aid evaluation and valid for the current aid period.\n\nTrigger\nA student's aid package is determined and approved.\n\nUnlocks\nBill Customer or Payor can offset the awarded amount against tuition charges and issue an accurate invoice.\n\nWithout this\nThe student is billed the full amount despite being entitled to aid, producing incorrect invoices and payment disputes.","sourceid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","targetid":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","specialization":""},{"id":"rel-flow-hiedrs-0089","type":"FlowRelationship","name":"Scholarship Award","documentation":"Content\nScholarship Award stating amount and source, issued after aid eligibility determination.\n\nTrigger\nAid decision finalised.\n\nUnlocks\nManage Financial Relationships can link the aid to the student's financial relationship and record payment obligations for the remaining balance.\n\nWithout this\nThe financial relationship lacks the aid component, so the payor is not matched with the correct net obligation.","sourceid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","targetid":"id-b334c94a-a2ff-449e-869e-70a0960b4aca","specialization":""},{"id":"rel-flow-hiedrs-0125","type":"FlowRelationship","name":"Scholarship Award Decision","documentation":"Content\nScholarship Award Decision moves as a formal outcome of the scholarship ranking under the applicable scholarship rule, naming the student, amount, and source.\n\nTrigger\nAdminister Student Standard completes ranking and approval of scholarship applications.\n\nUnlocks\nAward and Monitor Financial Aid can include the student standard scholarship in the student's overall aid package and instruct disbursement.\n\nWithout this\nA scholarship granted through the student centre would not be integrated into the central financial aid record, causing duplicate or missing payments.","sourceid":"id-703c3278-af18-4e57-8bd0-ef52b23dc077","targetid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","specialization":""},{"id":"rel-flow-hiedrs-0077","type":"FlowRelationship","name":"Segmentation List","documentation":"Content\nA current segmentation list of prospects and donors, grouped by giving capacity, engagement, consent status, and communication preference, emitted from the contributor database.\n\nTrigger\nA new solicitation initiative is being planned and prospect selection is due.\n\nUnlocks\nSolicit Prospects can identify major gift prospects and assign solicitors based on reliable segment data and lawful outreach flags.\n\nWithout this\nSolicit Prospects works from an ad hoc prospect list, causing non-compliant outreach and low conversion.","sourceid":"id-96bbedb3-ee3c-46fc-8623-e16a8fa4e7d2","targetid":"id-4ea30967-ff0b-4c5d-9d5e-1523da7907d9","specialization":""},{"id":"rel-flow-hiedrs-0078","type":"FlowRelationship","name":"Segmentation List","documentation":"Content\nA current segmentation list with prospect contact and consent status for each target segment, ready for campaign distribution.\n\nTrigger\nA fundraising campaign or event reaches the launch stage and requires an approved prospect list.\n\nUnlocks\nExecute Fundraising Initiatives can distribute solicitation appeals and event invitations to the correct segments without contacting prospects lacking consent.\n\nWithout this\nExecute Fundraising Initiatives delays the campaign or violates data protection law and suffers low response from stale prospect lists.","sourceid":"id-96bbedb3-ee3c-46fc-8623-e16a8fa4e7d2","targetid":"id-6abc9eb9-f507-4dcf-8200-f9e870ec19a3","specialization":""},{"id":"rel-flow-hiedrs-0121","type":"FlowRelationship","name":"Self-Financing Status Confirmation","documentation":"Content\nSelf-Financing Status Confirmation moves as an official record that a student is not awarded a state-funded place and must pay the full tuition fee for the programme.\n\nTrigger\nManage State Funding completes assignment of state-funded places and confirms the remaining admitted students as self-financing.\n\nUnlocks\nBill Customer or Payor can issue the correct tuition invoice and set the fee status for the student.\n\nWithout this\nThe billing capability would not know whether to bill full tuition or only non-subsidised fees, causing incorrect invoices and revenue leakage.","sourceid":"id-58101092-095e-42fc-a263-ddc537d93a84","targetid":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","specialization":""},{"id":"rel-flow-hiedrs-0015","type":"FlowRelationship","name":"Sold Quota Allocation","documentation":"Content\nSold Quota Allocation specifies the remaining and allocated self-financing quota by study programme and sales channel, aligned with the ministry-approved enrolment quota and academic calendar.\n\nTrigger\nThe ministry quota decision is published and Sales Planning allocates quota across programmes and channels.\n\nUnlocks\nMulti-Channel Sales can validate each customer order against available quota, reserve a seat or cohort place, and reject orders that exceed the allocation.\n\nWithout this\nChannels oversell the same programme, producing conflicting confirmations and forcing the institution to refuse valid orders or exceed state-approved capacity.","sourceid":"id-52f6b145-944f-43d6-8dff-7f43ef37bc51","targetid":"id-8ef1a7e0-4d0f-4e57-bcf7-50501651842d","specialization":""},{"id":"rel-flow-hiedrs-0086","type":"FlowRelationship","name":"Solicitation Outcome Log","documentation":"Content\nA log of responses received from campaign appeals and events, including prospect identifier, response status, requested follow-up, and consent flags, compiled when a campaign or event closes.\n\nTrigger\nA fundraising campaign or event concludes and the solicitation outcome log is compiled.\n\nUnlocks\nSolicit Prospects can update prospect stages, assign follow-up, and suppress prospects who declined or requested no contact.\n\nWithout this\nSolicit Prospects works from a stale prospect pipeline, risks duplicate outreach, and misses major gift follow-up.","sourceid":"id-6abc9eb9-f507-4dcf-8200-f9e870ec19a3","targetid":"id-4ea30967-ff0b-4c5d-9d5e-1523da7907d9","specialization":""},{"id":"rel-flow-hiedrs-0007","type":"FlowRelationship","name":"Sponsor Invoice","documentation":"Content\nThe sponsor invoice with a unique invoice number, sponsor reference, amount, currency, and budget line allocations, issued after expenditures are verified and cost share documented.\n\nTrigger\nApproved expenditure report and cost share certification are complete, and the billing unit issues the invoice.\n\nUnlocks\nReceive Funding can match a sponsor payment to this invoice, record the cash receipt, and allocate the amount to the correct grant budget lines.\n\nWithout this\nSponsor payments arrive without reference, become unidentified, and cannot be posted to the grant, leaving project accounts unreconciled.","sourceid":"id-1db93bd4-1dfe-459a-8324-c55dee07ec4f","targetid":"id-51cd6874-501c-40ec-b797-8d46bc6d2240","specialization":""},{"id":"rel-flow-hiedrs-0120","type":"FlowRelationship","name":"State-Funded Place Confirmation","documentation":"Content\nState-Funded Place Confirmation moves as a decision that a specific student is awarded a budget place for the academic year, tied to the ministry-set quota and study programme, issued to confirm the assignment.\n\nTrigger\nManage State Funding has assigned quota places after ranking and quota distribution.\n\nUnlocks\nAward and Monitor Financial Aid can activate the student's state-funded aid package, including any associated scholarships and subsidies, without duplicating quota decisions.\n\nWithout this\nFinancial aid would not know whether a student is state-funded, causing wrong disbursements and potential overpayment of self-financing students.","sourceid":"id-58101092-095e-42fc-a263-ddc537d93a84","targetid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","specialization":""},{"id":"rel-flow-hiedrs-0122","type":"FlowRelationship","name":"Student Funding Status","documentation":"Content\nStudent Funding Status moves as an official update of the student's public funding classification, to be recorded in the master student record.\n\nTrigger\nManage State Funding determines or changes a student's funding status.\n\nUnlocks\nMaintain Student Records can reflect the correct funding status in the student record, ensuring consistency across all downstream processes.\n\nWithout this\nThe master record would disagree with funding decisions, causing billing, financial aid, and reporting errors.","sourceid":"id-58101092-095e-42fc-a263-ddc537d93a84","targetid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","specialization":""},{"id":"rel-flow-hiedrs-0035","type":"FlowRelationship","name":"Student Record","documentation":"Content\nMaster Student Record subset relevant to the reported issue, such as enrolment or grade data, shared under data protection rules.\n\nTrigger\nAn Issue Report involving a student's record is being diagnosed.\n\nUnlocks\nDiagnose/Resolve Issues can correlate the reported symptom with the correct student data and resolve the issue without unnecessary personal data exposure.\n\nWithout this\nSupport staff cannot verify the student's situation, delaying resolution or causing privacy violations.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-ebfc2ab0-2c6f-42e4-b1d7-a387d571b009","specialization":""},{"id":"rel-flow-hiedrs-0067","type":"FlowRelationship","name":"Student Record","documentation":"Content\nMaster Student Record with academic standing, ECTS credits, completed courses and programme requirements.\n\nTrigger\nAdvising session requested or progress review due.\n\nUnlocks\nAdvise Students and Provide can assess academic standing and develop a valid study plan for the next term.\n\nWithout this\nAdvisors work from incomplete data and may approve course selections that violate the curriculum.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-d7a1670b-5b1f-4419-a987-19f2b699fecb","specialization":""},{"id":"rel-flow-hiedrs-0068","type":"FlowRelationship","name":"Student Record","documentation":"Content\nMaster Student Record confirming active enrolment and relevant personal data authorised for support handling.\n\nTrigger\nStudent submits a support request or is referred for assistance.\n\nUnlocks\nAssistance can verify enrolment status before providing accommodations, financial referrals or learning support.\n\nWithout this\nAssistance may be granted to non-enrolled students or without required legitimacy.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-4a109615-89b7-4d83-9527-666fb431ad35","specialization":""},{"id":"rel-flow-hiedrs-0094","type":"FlowRelationship","name":"Student Record","documentation":"Content\nMaster Student Record with personal data, programme, funding status, academic progress and consent flags, in current and accurate state.\n\nTrigger\nA student's record is updated or requested by the aid office.\n\nUnlocks\nAward and Monitor Financial Aid can evaluate aid applications, verify satisfactory academic progress and determine state-funded place eligibility.\n\nWithout this\nAid decisions are made without reliable student information, causing incorrect awards and compliance risk.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-2e6834a2-c238-4cf4-989a-cca3222baa9f","specialization":""},{"id":"rel-flow-hiedrs-0095","type":"FlowRelationship","name":"Student Record","documentation":"Content\nMaster Student Record with programme, funding type and fee-relevant data.\n\nTrigger\nBilling needs to calculate charges for a student.\n\nUnlocks\nBill Customer or Payor can determine whether the student is state-funded or self-financing and apply the correct tuition fee schedule.\n\nWithout this\nFee status is unknown and billing cannot produce a lawful invoice.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-cb9285c8-a7b1-40d3-a951-9c75bbc5cdc3","specialization":""},{"id":"rel-flow-hiedrs-0096","type":"FlowRelationship","name":"Student Record","documentation":"Content\nMaster Student Record with personal data, academic standing and programme details.\n\nTrigger\nStudent initiates course selection or registration for a new term.\n\nUnlocks\nEnroll in Classes can verify the student's identity, programme and prerequisites before registering courses.\n\nWithout this\nRegistration cannot proceed because the student's standing cannot be confirmed.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-dd24e87e-c22c-4207-8c1a-a42a041e2a10","specialization":""},{"id":"rel-flow-hiedrs-0097","type":"FlowRelationship","name":"Student Record","documentation":"Content\nMaster Student Record with contact details and valid consent flag for directory publication.\n\nTrigger\nDirectory update or publication requested for a student.\n\nUnlocks\nMaintain Campus Community Directory can publish an accurate entry only if consent is recorded and contact data is correct.\n\nWithout this\nThe directory cannot list the student, or would risk publishing without lawful basis.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-d6e5d220-7427-459d-b8f4-8fae0c27c848","specialization":""},{"id":"rel-flow-hiedrs-0098","type":"FlowRelationship","name":"Student Record","documentation":"Content\nMaster Student Record confirming enrolled status, student standard eligibility and personal data.\n\nTrigger\nHousing application submitted or housing assignment reviewed.\n\nUnlocks\nProvide Housing and Auxiliary Services can verify that the student is enrolled and eligible for subsidised accommodation before issuing a housing contract.\n\nWithout this\nHousing may be assigned to an ineligible or non-enrolled applicant, violating student standard rules.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-3c048211-0449-40be-a766-678a749f7390","specialization":""},{"id":"rel-flow-hiedrs-0104","type":"FlowRelationship","name":"Student Record","documentation":"Content\nMaster Student Record with identity, programme, funding type and contact data needed to set up a payor, sponsor or state-funded financial relationship.\n\nTrigger\nA financial relationship is set up for a student.\n\nUnlocks\nManage Financial Relationships can verify student identity and funding status before recording payment obligations.\n\nWithout this\nFinancial relationships may be attached to the wrong student or fail to distinguish state-funded from self-financing obligations.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-b334c94a-a2ff-449e-869e-70a0960b4aca","specialization":""},{"id":"rel-flow-hiedrs-0117","type":"FlowRelationship","name":"Student Record","documentation":"Content\nStudent Record moves as the master record of the student's personal data, enrolment history, programme, funding status, and academic standing, released for graduation clearance.\n\nTrigger\nIssue Diplomas and Diploma Supplements requests the record for a candidate in the final phase of study.\n\nUnlocks\nIssue Diplomas can match the transcript and thesis defense to the correct student identity and programme, ensuring the diploma is issued to the right graduate.\n\nWithout this\nThe diploma process would lack authoritative personal and programme data, risking misidentification and invalid issuance.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-7867ed7a-a6c0-499b-a13e-41619962e307","specialization":""},{"id":"rel-flow-hiedrs-0124","type":"FlowRelationship","name":"Student Record","documentation":"Content\nStudent Record moves as an authorised extract of the student's enrolment and personal status to confirm active student status for student standard evaluation.\n\nTrigger\nAdminister Student Standard requests verification when a student applies for subsidised accommodation, meals, or scholarships.\n\nUnlocks\nAdminister Student Standard can confirm the applicant is enrolled and eligible before evaluating income and capacity.\n\nWithout this\nThe capability could allocate student standard support to non-enrolled persons, violating the Law on Higher Education and wasting public resources.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-703c3278-af18-4e57-8bd0-ef52b23dc077","specialization":""},{"id":"rel-flow-hiedrs-0126","type":"FlowRelationship","name":"Student Record","documentation":"Content\nStudent Record moves as the verified record of student identity and admission status needed to assign state-funded or self-financing places accurately.\n\nTrigger\nManage State Funding requests the record when distributing quotas and assigning student funding status.\n\nUnlocks\nState funding can rank and assign students only against verified enrolment and admission data, reducing errors and duplication.\n\nWithout this\nQuota assignments could be based on inaccurate identities or statuses, leading to incorrect budget place allocation and funding claims.","sourceid":"id-ab7d54b7-532a-45a6-9e8f-f4be13b38dca","targetid":"id-58101092-095e-42fc-a263-ddc537d93a84","specialization":""},{"id":"flow-dom-manage-students--support","type":"FlowRelationship","name":"Student Record","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-ae0ab1dc-95a9-4226-8013-05a65cb447de","specialization":""},{"id":"flow-dom-manage-students--manage-academics","type":"FlowRelationship","name":"Student Record","documentation":"","sourceid":"id-7eb7c6a1-4864-4c4b-9b13-d344309f4f58","targetid":"id-b3783a69-5a26-4c8c-b0dc-f13ebb34baf9","specialization":""},{"id":"rel-flow-hiedrs-0123","type":"FlowRelationship","name":"Student Standard Record","documentation":"Content\nStudent Standard Record moves as a certified record of the student's entitlement to subsidised accommodation, meals, or other services, including the specific decision and any conditions.\n\nTrigger\nAdminister Student Standard issues a subsidy or scholarship decision and sends the record to the student centre's implementation unit.\n\nUnlocks\nProvide Housing and Auxiliary Services can allocate a dormitory place or meal plan according to the confirmed entitlement.\n\nWithout this\nHousing and auxiliary services would not know which students are subsidised, causing either denial of service or provision without verified eligibility.","sourceid":"id-703c3278-af18-4e57-8bd0-ef52b23dc077","targetid":"id-3c048211-0449-40be-a766-678a749f7390","specialization":""},{"id":"rel-flow-hiedrs-0053","type":"FlowRelationship","name":"Study Programme Curriculum","documentation":"Content\nThe definitive curriculum document for each accredited study programme, including required and elective courses, prerequisites, and the ECTS credit allocation per year.\n\nTrigger\nA new or revised study programme is accredited and the curriculum becomes available to student advisors.\n\nUnlocks\nAdvise Students can prepare individual Study Plans that respect the 60 ECTS per year workload and the official course requirements.\n\nWithout this\nAdvise Students must advise from memory or outdated curriculum, leading to course selections that violate ECTS limits or miss required courses, delaying graduation.","sourceid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","targetid":"id-d7a1670b-5b1f-4419-a987-19f2b699fecb","specialization":""},{"id":"rel-flow-hiedrs-0069","type":"FlowRelationship","name":"Study Programme Documentation","documentation":"Content\nThe current accredited study programme documentation, including curriculum map, learning outcomes, and ECTS allocation, produced from the official course catalogue and accredited programme record.\n\nTrigger\nA programme is due for internal review or accreditation self-evaluation.\n\nUnlocks\nEvaluate Academic Program can review the documentation against NAT and ESG 2015 criteria and produce the Program Evaluation Report.\n\nWithout this\nEvaluate Academic Program has no authoritative basis for assessing curriculum coherence and must request documents ad hoc, delaying accreditation preparation.","sourceid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","targetid":"id-d8e4c197-826c-4d16-8f57-a29cd7b40c14","specialization":""},{"id":"rel-flow-hiedrs-0108","type":"FlowRelationship","name":"Study Programme Documentation","documentation":"Content\nThe Study Programme Documentation moves as the final draft of a programme proposal, curriculum map, ECTS allocation and syllabus pack produced before NAT submission.\n\nTrigger\nA new programme or major revision has been planned and signed by the academic body.\n\nUnlocks\nManage Accreditation can compare the planned programme against NAT accreditation standards and prepare the formal application.\n\nWithout this\nManage Accreditation would have no normative curriculum text to evaluate, so accreditation status of the programme could not be verified or maintained.","sourceid":"id-4d2511d9-a1f7-4fd0-aa32-3792735a926a","targetid":"id-a6bbc833-d30e-460f-9df3-0ebe783e8f43","specialization":""},{"id":"rel-flow-hiedrs-0072","type":"FlowRelationship","name":"Syllabus Template","documentation":"Content\nThe standardised course syllabus with learning outcomes, teaching methods, assessment criteria and the approved marking scheme.\n\nTrigger\nThe course catalogue is published for the term and assessment preparation begins.\n\nUnlocks\nEvaluate Student Performance can mark examination scripts and assignments against the approved scheme, ensuring assessment is aligned with the accredited syllabus.\n\nWithout this\nEvaluate Student Performance lacks the
